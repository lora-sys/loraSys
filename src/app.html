<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/favicon-180.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f4f1ec" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
		<link rel="alternate" type="application/rss+xml" title="Lora Sys Blog" href="/api/rss.xml" />
		<!-- Image reveal transitions — static file bypasses Tailwind JIT purging.
		.loaded class is added by JS after images load. -->
		<link rel="stylesheet" href="./image-reveal.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Prevent dark-mode FOUC: inject CSS variables + add mode-dark class
			// before first paint, before any lazy images load.
			// mode-watcher will sync its reactive store on hydration later.
			(function () {
				var css =
					'html.mode-dark,html.mode-dark :root{--ink:#f3efe6;--ink-soft:#b5afa6;--ink-mute:#8a857c;--paper:#1a1815;--paper-2:#24211c;--zhu:#e0473a;--ink-line:rgba(243,239,230,.12);--ink-line-strong:rgba(243,239,230,.25)}html.mode-dark body{background:var(--paper);color:var(--ink)}';
				var style = document.createElement('style');
				style.id = 'ink-dark-mode-critical';
				style.textContent = css;
				document.head.appendChild(style);
				try {
					var stored = localStorage.getItem('mode-watcher-mode');
					var isDark =
						stored === 'dark' ||
						(!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (isDark) {
						document.documentElement.classList.add('mode-dark');
					}
				} catch (e) {}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
