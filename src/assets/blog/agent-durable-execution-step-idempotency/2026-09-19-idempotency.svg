<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="1400" height="780" fill="#F7F1E8"/><text x="70" y="80" font-size="42" font-family="Arial,sans-serif" font-weight="700" fill="#211A17">持久步骤仍然需要幂等键</text><text x="70" y="125" font-size="22" font-family="Arial,sans-serif" fill="#66574D">外部服务已经成功，但确认响应丢失时，运行时无法只靠本地状态判断副作用是否发生</text><rect x="60" y="180" width="610" height="455" rx="28" fill="#EFE5D8" stroke="#5F5147" stroke-width="3"/><text x="95" y="230" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#5A3024">没有幂等键</text><g font-family="Arial,sans-serif" font-size="24"><rect x="135" y="285" width="455" height="65" rx="14" fill="#FFFDF8"/><text x="175" y="326">退款请求成功</text><rect x="135" y="385" width="455" height="65" rx="14" fill="#F4CDC5"/><text x="175" y="426">确认响应丢失</text><rect x="135" y="485" width="455" height="65" rx="14" fill="#F4CDC5"/><text x="175" y="526">步骤重试，再次退款</text></g><text x="180" y="595" font-size="27" font-family="Arial,sans-serif" fill="#A13B2E">副作用可能发生两次</text><rect x="730" y="180" width="610" height="455" rx="28" fill="#FFF9ED" stroke="#A46D18" stroke-width="3"/><text x="765" y="230" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#8B5E18">使用稳定幂等键</text><g font-family="Arial,sans-serif" font-size="24"><rect x="805" y="275" width="430" height="75" rx="14" fill="#FFFDF8"/><text x="845" y="308">请求携带 stepId</text><text x="845" y="337">作为 Idempotency-Key</text><rect x="805" y="390" width="430" height="75" rx="14" fill="#F4CDC5"/><text x="845" y="435">确认响应丢失，步骤重试</text><rect x="805" y="505" width="430" height="75" rx="14" fill="#E4EEDC"/><text x="845" y="538">服务端识别相同键</text><text x="845" y="567">返回已有结果</text></g><text x="70" y="710" font-size="25" font-family="Arial,sans-serif" fill="#5F5147">图 3  Vercel Workflow 文档建议使用重试期间稳定的 stepId 作为第三方 API 的幂等键。</text></svg>