<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="1400" height="780" fill="#F7F1E8"/><text x="70" y="80" font-size="42" font-family="Arial,sans-serif" font-weight="700" fill="#211A17">Why not start over after a process crash?</text><text x="70" y="125" font-size="22" font-family="Arial,sans-serif" fill="#66574D">If side effects already happened, starting over repeats real operations</text><rect x="60" y="175" width="610" height="500" rx="28" fill="#EFE5D8" stroke="#5F5147" stroke-width="3"/><text x="95" y="225" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#5A3024">Ordinary in-memory loop</text><g font-family="Arial,sans-serif" font-size="24" fill="#211A17"><rect x="135" y="275" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="180" y="320">1 Look up order</text><rect x="135" y="375" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="180" y="420">2 Refund  Succeeded</text><rect x="135" y="475" width="430" height="72" rx="14" fill="#F4CDC5"/><text x="180" y="520">3 Follow-up error</text><rect x="135" y="575" width="430" height="72" rx="14" fill="#F4CDC5"/><text x="180" y="620">Restart: refund may run again</text></g><rect x="730" y="175" width="610" height="500" rx="28" fill="#FFF9ED" stroke="#A46D18" stroke-width="3"/><text x="765" y="225" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#8B5E18">Durable execution</text><g font-family="Arial,sans-serif" font-size="24" fill="#211A17"><rect x="805" y="275" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="850" y="320">1 Order lookup  Result saved</text><rect x="805" y="375" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="850" y="420">2 Refund  Result saved</text><rect x="805" y="475" width="430" height="72" rx="14" fill="#F4CDC5"/><text x="850" y="520">3 Follow-up failed</text><rect x="805" y="575" width="430" height="72" rx="14" fill="#E4EEDC"/><text x="850" y="620" style=";font-size:19.9px">Resume unfinished work after restart</text></g><text x="70" y="735" font-size="24" font-family="Arial,sans-serif" fill="#5F5147">Figure 1. Teaching illustration: durable records let recovery skip completed steps.</text></svg>