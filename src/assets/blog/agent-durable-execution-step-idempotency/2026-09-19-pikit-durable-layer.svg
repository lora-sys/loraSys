<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="1400" height="780" fill="#F7F1E8"/><text x="70" y="80" font-size="42" font-family="Arial,sans-serif" font-weight="700" fill="#211A17">Lora PI Kit 现有边界怎样接入持久 Run</text><text x="70" y="125" font-size="22" font-family="Arial,sans-serif" fill="#66574D">保留 Pi 执行环境、工具策略和 trace 事件，把持久状态放到 Glassbox 控制层</text><rect x="60" y="185" width="570" height="465" rx="28" fill="#EFE5D8" stroke="#5F5147" stroke-width="3"/><text x="95" y="235" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#5A3024">当前 PI Kit</text><g font-family="Arial,sans-serif" font-size="24"><rect x="130" y="285" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="170" y="330">Pi Session 负责 Agent 执行</text><rect x="130" y="390" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="170" y="435">tool-policy.ts 过滤可用工具</text><rect x="130" y="495" width="430" height="92" rx="14" fill="#FFFDF8"/><text x="170" y="532">trace-hooks.ts 记录 agent_start</text><text x="170" y="566">tool_call、tool_result 等事件</text></g><rect x="770" y="185" width="570" height="465" rx="28" fill="#FFF9ED" stroke="#A46D18" stroke-width="3"/><text x="805" y="235" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#8B5E18">建议新增 Glassbox Run 层</text><g font-family="Arial,sans-serif" font-size="24"><rect x="840" y="280" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="880" y="325">Run 保存目标、状态、权限快照</text><rect x="840" y="385" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="880" y="430">Step 保存输入、结果、状态</text><rect x="840" y="490" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="880" y="535">副作用步骤保存幂等键</text><rect x="840" y="585" width="430" height="45" rx="14" fill="#E4EEDC"/><text x="880" y="616">重启后从未完成 Step 继续</text></g><path d="M650 420 L750 420" stroke="#8B5E18" stroke-width="10"/><polygon points="750,420 715,398 715,442" fill="#8B5E18"/><text x="70" y="720" font-size="24" font-family="Arial,sans-serif" fill="#5F5147">图 4  基于当前仓库的工程迁移示意。本文没有修改仓库。</text></svg>