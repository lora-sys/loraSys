<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="1400" height="780" fill="#F7F1E8"/><text x="70" y="80" font-size="42" font-family="Arial,sans-serif" font-weight="700" fill="#211A17">Step boundary 决定失败以后重试多大一块</text><text x="70" y="125" font-size="22" font-family="Arial,sans-serif" fill="#66574D">边界太大时，一个后续错误会让前面的副作用再次执行</text><rect x="60" y="180" width="610" height="455" rx="28" fill="#EFE5D8" stroke="#5F5147" stroke-width="3"/><text x="95" y="230" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#5A3024">整轮作为一个 step</text><rect x="135" y="285" width="455" height="85" rx="15" fill="#FFFDF8"/><text x="175" y="335" font-size="25" font-family="Arial,sans-serif">查订单 + 退款 + 生成回复</text><rect x="135" y="415" width="455" height="85" rx="15" fill="#F4CDC5"/><text x="175" y="465" font-size="25" font-family="Arial,sans-serif">生成回复失败</text><rect x="135" y="545" width="455" height="60" rx="15" fill="#F4CDC5"/><text x="175" y="584" font-size="23" font-family="Arial,sans-serif">整个 step 重试，退款也会再跑</text><rect x="730" y="180" width="610" height="455" rx="28" fill="#FFF9ED" stroke="#A46D18" stroke-width="3"/><text x="765" y="230" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#8B5E18">副作用工具单独成 step</text><g font-family="Arial,sans-serif" font-size="24"><rect x="810" y="275" width="430" height="70" rx="14" fill="#FFFDF8"/><text x="850" y="318">step 1  查订单  已完成</text><rect x="810" y="375" width="430" height="70" rx="14" fill="#FFFDF8"/><text x="850" y="418">step 2  执行退款  已完成</text><rect x="810" y="475" width="430" height="70" rx="14" fill="#F4CDC5"/><text x="850" y="518">step 3  后续处理  失败</text><rect x="810" y="565" width="430" height="50" rx="14" fill="#E4EEDC"/><text x="850" y="598">只重试 step 3</text></g><text x="70" y="710" font-size="25" font-family="Arial,sans-serif" fill="#5F5147">图 2  工程建议。会产生真实副作用的工具，优先划成独立的持久步骤。</text></svg>