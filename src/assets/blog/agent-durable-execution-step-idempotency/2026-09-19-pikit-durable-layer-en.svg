<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="1400" height="780" fill="#F7F1E8"/><text x="70" y="80" font-size="42" font-family="Arial,sans-serif" font-weight="700" fill="#211A17">Adding durable runs to Lora PI Kit</text><text x="70" y="125" font-size="22" font-family="Arial,sans-serif" fill="#66574D">Keep Pi execution, tool policy, and trace events; store durable state in the Glassbox control layer</text><rect x="60" y="185" width="570" height="465" rx="28" fill="#EFE5D8" stroke="#5F5147" stroke-width="3"/><text x="95" y="235" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#5A3024">Current PI Kit</text><g font-family="Arial,sans-serif" font-size="24"><rect x="130" y="285" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="170" y="330">Pi Session executes agents</text><rect x="130" y="390" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="170" y="435" style=";font-size:22.1px">tool-policy.ts filters available tools</text><rect x="130" y="495" width="430" height="92" rx="14" fill="#FFFDF8"/><text x="170" y="532" style=";font-size:21.9px">trace-hooks.ts records agent_start</text><text x="170" y="566" style=";font-size:19.6px">tool_call, tool_result, and other events</text></g><rect x="770" y="185" width="570" height="465" rx="28" fill="#FFF9ED" stroke="#A46D18" stroke-width="3"/><text x="805" y="235" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#8B5E18">Proposed Glassbox run layer</text><g font-family="Arial,sans-serif" font-size="24"><rect x="840" y="280" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="880" y="325" style=";font-size:19.9px">Run: goal, state, permission snapshot</text><rect x="840" y="385" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="880" y="430">Step: input, result, state</text><rect x="840" y="490" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="880" y="535" style=";font-size:19.1px">Side-effecting steps: idempotency keys</text><rect x="840" y="585" width="430" height="45" rx="14" fill="#E4EEDC"/><text x="880" y="616" style=";font-size:19.9px">Resume unfinished steps after restart</text></g><path d="M650 420 L750 420" stroke="#8B5E18" stroke-width="10"/><polygon points="750,420 715,398 715,442" fill="#8B5E18"/><text x="70" y="720" font-size="24" font-family="Arial,sans-serif" fill="#5F5147" style=";font-size:22.4px">Figure 4. Adaptation proposal based on the current repository. No repository changes were made for this article.</text></svg>