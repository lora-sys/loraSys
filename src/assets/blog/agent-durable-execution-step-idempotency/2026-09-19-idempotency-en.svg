<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="1400" height="780" fill="#F7F1E8"/><text x="70" y="80" font-size="42" font-family="Arial,sans-serif" font-weight="700" fill="#211A17">Durable steps still need idempotency keys</text><text x="70" y="125" font-size="22" font-family="Arial,sans-serif" fill="#66574D">If a remote operation succeeds but its response is lost, local state alone cannot establish the side effect</text><rect x="60" y="180" width="610" height="455" rx="28" fill="#EFE5D8" stroke="#5F5147" stroke-width="3"/><text x="95" y="230" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#5A3024">No idempotency key</text><g font-family="Arial,sans-serif" font-size="24"><rect x="135" y="285" width="455" height="65" rx="14" fill="#FFFDF8"/><text x="175" y="326">Refund request succeeds</text><rect x="135" y="385" width="455" height="65" rx="14" fill="#F4CDC5"/><text x="175" y="426">Confirmation is lost</text><rect x="135" y="485" width="455" height="65" rx="14" fill="#F4CDC5"/><text x="175" y="526">Step retries and refunds again</text></g><text x="180" y="595" font-size="27" font-family="Arial,sans-serif" fill="#A13B2E">The side effect may occur twice</text><rect x="730" y="180" width="610" height="455" rx="28" fill="#FFF9ED" stroke="#A46D18" stroke-width="3"/><text x="765" y="230" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#8B5E18">Use a stable idempotency key</text><g font-family="Arial,sans-serif" font-size="24"><rect x="805" y="275" width="430" height="75" rx="14" fill="#FFFDF8"/><text x="845" y="308">Request carries stepId</text><text x="845" y="337">as Idempotency-Key</text><rect x="805" y="390" width="430" height="75" rx="14" fill="#F4CDC5"/><text x="845" y="435">Confirmation lost; step retries</text><rect x="805" y="505" width="430" height="75" rx="14" fill="#E4EEDC"/><text x="845" y="538" style=";font-size:23.4px">Server recognizes the same key</text><text x="845" y="567">Returns the existing result</text></g><text x="70" y="710" font-size="25" font-family="Arial,sans-serif" fill="#5F5147" style=";font-size:23.2px">Figure 3. Vercel Workflow recommends a stepId stable across retries as the third-party API idempotency key.</text></svg>