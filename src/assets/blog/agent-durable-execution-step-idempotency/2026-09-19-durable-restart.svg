<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="1400" height="780" fill="#F7F1E8"/><text x="70" y="80" font-size="42" font-family="Arial,sans-serif" font-weight="700" fill="#211A17">进程崩溃以后，为什么不能直接从头重跑</text><text x="70" y="125" font-size="22" font-family="Arial,sans-serif" fill="#66574D">副作用已经发生时，从头执行会把真实操作再做一次</text><rect x="60" y="175" width="610" height="500" rx="28" fill="#EFE5D8" stroke="#5F5147" stroke-width="3"/><text x="95" y="225" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#5A3024">普通内存循环</text><g font-family="Arial,sans-serif" font-size="24" fill="#211A17"><rect x="135" y="275" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="180" y="320">1 查订单</text><rect x="135" y="375" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="180" y="420">2 执行退款  已成功</text><rect x="135" y="475" width="430" height="72" rx="14" fill="#F4CDC5"/><text x="180" y="520">3 后续处理报错</text><rect x="135" y="575" width="430" height="72" rx="14" fill="#F4CDC5"/><text x="180" y="620">从头重跑  退款可能再执行</text></g><rect x="730" y="175" width="610" height="500" rx="28" fill="#FFF9ED" stroke="#A46D18" stroke-width="3"/><text x="765" y="225" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#8B5E18">持久执行</text><g font-family="Arial,sans-serif" font-size="24" fill="#211A17"><rect x="805" y="275" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="850" y="320">1 查订单  结果已记录</text><rect x="805" y="375" width="430" height="72" rx="14" fill="#FFFDF8"/><text x="850" y="420">2 执行退款  结果已记录</text><rect x="805" y="475" width="430" height="72" rx="14" fill="#F4CDC5"/><text x="850" y="520">3 后续处理失败</text><rect x="805" y="575" width="430" height="72" rx="14" fill="#E4EEDC"/><text x="850" y="620">重启后从未完成处继续</text></g><text x="70" y="735" font-size="24" font-family="Arial,sans-serif" fill="#5F5147">图 1  教学示意。已完成步骤要有持久记录，恢复时才能跳过。</text></svg>