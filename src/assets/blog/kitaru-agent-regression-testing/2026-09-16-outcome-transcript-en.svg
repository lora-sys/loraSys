<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f1e7"/><text x="60" y="78" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="40" font-weight="700" fill="#211a16">Grade the Outcome first, then read the Transcript</text><text x="60" y="118" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="21" fill="#6b5b50">An agent saying &quot;done&quot; is not evidence. Check the actual final system state first.</text><g font-family="Arial,Noto Sans CJK SC,sans-serif"><rect x="55" y="170" width="500" height="390" rx="24" fill="#fffaf2" stroke="#7b5a3d" stroke-width="3"/><rect x="645" y="170" width="500" height="390" rx="24" fill="#fffaf2" stroke="#7b5a3d" stroke-width="3"/><text x="95" y="225" font-size="31" font-weight="700" fill="#6c4a24">Outcome: final state</text><text x="685" y="225" font-size="31" font-weight="700" fill="#6c4a24">Transcript: execution trace</text><text x="95" y="275" font-size="21" fill="#3e3127">Does the refund record exist?</text><text x="95" y="315" font-size="21" fill="#3e3127">Is the order status correct?</text><text x="95" y="355" font-size="21" fill="#3e3127">Is the amount correct?</text><text x="95" y="395" font-size="21" fill="#3e3127">Did the tests pass?</text><rect x="95" y="435" width="420" height="85" rx="14" fill="#f4d59a"/><text x="305" y="472" text-anchor="middle" font-size="18" fill="#6b5b50">Question answered</text><text x="305" y="502" text-anchor="middle" font-size="22" font-weight="700" fill="#211a16">Was the task actually completed?</text><text x="685" y="275" font-size="21" fill="#3e3127">Which tools were called?</text><text x="685" y="315" font-size="21" fill="#3e3127">What were the arguments and results?</text><text x="685" y="355" font-size="21" fill="#3e3127">Where were retries or errors?</text><text x="685" y="395" font-size="18.5" fill="#3e3127">How many turns, how much time and tokens?</text><rect x="685" y="435" width="420" height="85" rx="14" fill="#efe7db"/><text x="895" y="472" text-anchor="middle" font-size="18" fill="#6b5b50">Question answered</text><text x="895" y="502" text-anchor="middle" font-size="22" font-weight="700" fill="#211a16">Why did it succeed or fail?</text></g><rect x="215" y="590" width="770" height="55" rx="16" fill="#2b211b"/><text x="600" y="626" text-anchor="middle" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="700" fill="#f2b85b">Use outcomes to accept and traces to explain. Keep their scores separate.</text></svg>