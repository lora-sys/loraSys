<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#F6F0E6"/><text x="70" y="95" font-family="sans-serif" font-size="48" font-weight="700" fill="#2B2118">把线上失败变成回归测试</text><text x="70" y="140" font-family="sans-serif" font-size="24" fill="#6B5A4A">固定真实输入，只改一个变量，再判断是否值得上线</text><g font-family="sans-serif"><g><rect x="70" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="110" cy="275" r="22" fill="#D49A55"/><text x="102" y="283" font-size="22" font-weight="700" fill="#FFF">1</text><text x="100" y="335" font-size="29" font-weight="700" fill="#2B2118">生产运行</text><text x="100" y="380" font-size="21" fill="#6B5A4A">真实用户输入</text><text x="100" y="415" font-size="21" fill="#6B5A4A">工具调用和结果</text></g><g><rect x="300" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="340" cy="275" r="22" fill="#D49A55"/><text x="332" y="283" font-size="22" font-weight="700" fill="#FFF">2</text><text x="330" y="335" font-size="29" font-weight="700" fill="#2B2118">冻结样本</text><text x="330" y="380" font-size="21" fill="#6B5A4A">近期真实流量</text><text x="330" y="415" font-size="21" fill="#6B5A4A">已知失败案例</text></g><g><rect x="530" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="570" cy="275" r="22" fill="#D49A55"/><text x="562" y="283" font-size="22" font-weight="700" fill="#FFF">3</text><text x="560" y="335" font-size="29" font-weight="700" fill="#2B2118">只改一处</text><text x="560" y="380" font-size="21" fill="#6B5A4A">模型或提示词</text><text x="560" y="415" font-size="21" fill="#6B5A4A">代码或工具策略</text></g><g><rect x="760" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="800" cy="275" r="22" fill="#D49A55"/><text x="792" y="283" font-size="22" font-weight="700" fill="#FFF">4</text><text x="790" y="335" font-size="29" font-weight="700" fill="#2B2118">重放</text><text x="790" y="380" font-size="21" fill="#6B5A4A">重新执行 Agent</text><text x="790" y="415" font-size="21" fill="#6B5A4A">保留相同外部条件</text></g><g><rect x="990" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="1030" cy="275" r="22" fill="#D49A55"/><text x="1022" y="283" font-size="22" font-weight="700" fill="#FFF">5</text><text x="1020" y="335" font-size="29" font-weight="700" fill="#2B2118">评测</text><text x="1020" y="380" font-size="21" fill="#6B5A4A">结果是否正确</text><text x="1020" y="415" font-size="21" fill="#6B5A4A">成本是否下降</text></g><g><rect x="1215" y="230" rx="24" width="130" height="210" fill="#F2E5D4" stroke="#8B6B4A" stroke-width="3"/><text x="1240" y="335" font-size="28" font-weight="700" fill="#2B2118">CI</text><text x="1235" y="380" font-size="21" fill="#6B5A4A">通过</text><text x="1235" y="415" font-size="21" fill="#6B5A4A">才上线</text></g><g fill="#8B6B4A" font-size="42"><text x="265" y="355">→</text><text x="495" y="355">→</text><text x="725" y="355">→</text><text x="955" y="355">→</text><text x="1182" y="355">→</text></g><rect x="70" y="520" rx="22" width="1275" height="145" fill="#2B2118"/><text x="105" y="575" font-size="26" font-weight="700" fill="#F8E7C8">关键纪律</text><text x="105" y="620" font-size="23" fill="#FFF9F0">先把原版本原样重放一次。基线都复现不了时，不要比较新旧方案。</text><text x="105" y="652" font-size="23" fill="#FFF9F0">比较时一次只改一个变量，否则你无法知道改进来自哪里。</text></g></svg>