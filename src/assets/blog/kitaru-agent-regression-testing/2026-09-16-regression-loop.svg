<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b5a3d"/></marker></defs><rect width="1200" height="675" fill="#f7f1e7"/><text x="60" y="78" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="40" font-weight="700" fill="#211a16">线上失败怎样变成回归测试</text><text x="60" y="118" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="21" fill="#6b5b50">固定现场，只改一个变量，再决定能不能上线</text><g font-family="Arial,Noto Sans CJK SC,sans-serif" text-anchor="middle"><g fill="#fffaf2" stroke="#7b5a3d" stroke-width="3"><rect x="55" y="190" width="210" height="120" rx="18"/><rect x="335" y="190" width="210" height="120" rx="18"/><rect x="615" y="190" width="210" height="120" rx="18"/><rect x="895" y="190" width="210" height="120" rx="18"/><rect x="195" y="415" width="210" height="120" rx="18"/><rect x="495" y="415" width="210" height="120" rx="18"/><rect x="795" y="415" width="210" height="120" rx="18"/></g><g fill="#211a16" font-size="25" font-weight="700"><text x="160" y="235">1 线上失败</text><text x="440" y="235">2 保存 Session</text><text x="720" y="235">3 冻结 Cohort</text><text x="1000" y="235">4 基线重放</text><text x="300" y="460">5 只改一处</text><text x="600" y="460">6 候选重放</text><text x="900" y="460">7 评测与 CI</text></g><g fill="#6b5b50" font-size="18"><text x="160" y="275">真实任务出了错</text><text x="440" y="275">输入、工具、结果</text><text x="720" y="275">固定一批样本</text><text x="1000" y="275">确认现场可复现</text><text x="300" y="500">模型或提示词或代码</text><text x="600" y="500">同一批任务再跑</text><text x="900" y="500">结果不过就不放行</text></g></g><g stroke="#7b5a3d" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M265 250 H325"/><path d="M545 250 H605"/><path d="M825 250 H885"/><path d="M1000 310 C1000 365 300 350 300 405"/><path d="M405 475 H485"/><path d="M705 475 H785"/></g><rect x="55" y="585" width="1090" height="55" rx="16" fill="#2b211b"/><text x="600" y="621" text-anchor="middle" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="700" fill="#f2b85b">关键：先证明基线能稳定重放，再比较候选版本。</text></svg>