<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#F6F0E6"/><text x="70" y="95" font-family="sans-serif" font-size="48" font-weight="700" fill="#2B2118">回归测试集怎么选</text><text x="70" y="140" font-family="sans-serif" font-size="24" fill="#6B5A4A">真实流量、历史失败和人工边界样本要互相补位</text><g font-family="sans-serif"><rect x="80" y="220" rx="24" width="330" height="315" fill="#E8F1F6" stroke="#5F8196" stroke-width="3"/><text x="120" y="285" font-size="31" font-weight="700" fill="#304C5C">近期真实流量</text><text x="120" y="335" font-size="22" fill="#465E6B">覆盖常见用户行为</text><text x="120" y="375" font-size="22" fill="#465E6B">反映当前输入分布</text><text x="120" y="430" font-size="21" fill="#80513A">缺点：罕见风险可能没出现</text><rect x="535" y="220" rx="24" width="330" height="315" fill="#F8E9DD" stroke="#B17A45" stroke-width="3"/><text x="575" y="285" font-size="31" font-weight="700" fill="#68442F">历史失败</text><text x="575" y="335" font-size="22" fill="#6A4E3D">线上事故和用户投诉</text><text x="575" y="375" font-size="22" fill="#6A4E3D">修复后永远留在测试里</text><text x="575" y="430" font-size="21" fill="#80513A">缺点：容易只盯旧问题</text><rect x="990" y="220" rx="24" width="330" height="315" fill="#EEF1E6" stroke="#7C8658" stroke-width="3"/><text x="1030" y="285" font-size="31" font-weight="700" fill="#485032">人工边界样本</text><text x="1030" y="335" font-size="22" fill="#596142">权限、空输入、超时</text><text x="1030" y="375" font-size="22" fill="#596142">新功能尚未发生的风险</text><text x="1030" y="430" font-size="21" fill="#80513A">缺点：可能和真实流量脱节</text><text x="445" y="375" font-size="54" font-weight="700" fill="#8B6B4A">+</text><text x="900" y="375" font-size="54" font-weight="700" fill="#8B6B4A">+</text><path d="M245 565 C245 620 490 630 635 630" stroke="#8B6B4A" stroke-width="5" fill="none"/><path d="M700 565 L700 630" stroke="#8B6B4A" stroke-width="5"/><path d="M1155 565 C1155 620 910 630 765 630" stroke="#8B6B4A" stroke-width="5" fill="none"/><rect x="520" y="605" rx="22" width="360" height="90" fill="#2B2118"/><text x="585" y="647" font-size="27" font-weight="700" fill="#F8E7C8">冻结成版本化样本集</text><text x="600" y="678" font-size="20" fill="#FFF9F0">以后每次改动跑同一批样本</text></g></svg>