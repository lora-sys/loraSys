<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b5a3d"/></marker></defs><rect width="1200" height="675" fill="#f7f1e7"/><text x="60" y="78" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="40" font-weight="700" fill="#211a16">回归测试集不能只收事故</text><text x="60" y="118" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="21" fill="#6b5b50">真实流量、历史失败和人工边界案例解决的是三种不同风险</text><g font-family="Arial,Noto Sans CJK SC,sans-serif"><rect x="55" y="180" width="300" height="260" rx="22" fill="#fffaf2" stroke="#8c7764" stroke-width="3"/><text x="205" y="230" text-anchor="middle" font-size="28" font-weight="700" fill="#211a16">近期真实流量</text><text x="90" y="285" font-size="20" fill="#3e3127">覆盖常见用户行为</text><text x="90" y="325" font-size="20" fill="#3e3127">保持任务贴近生产</text><text x="90" y="365" font-size="20" fill="#6b5b50">缺点：罕见风险可能没出现</text><rect x="450" y="180" width="300" height="260" rx="22" fill="#f4d59a" stroke="#a97932" stroke-width="3"/><text x="600" y="230" text-anchor="middle" font-size="28" font-weight="700" fill="#211a16">历史失败案例</text><text x="485" y="285" font-size="20" fill="#3e3127">防止修过的问题回来</text><text x="485" y="325" font-size="20" fill="#3e3127">直接绑定真实事故</text><text x="485" y="365" font-size="20" fill="#6b5b50">缺点：容易只盯旧问题</text><rect x="845" y="180" width="300" height="260" rx="22" fill="#efe7db" stroke="#8c7764" stroke-width="3"/><text x="995" y="230" text-anchor="middle" font-size="28" font-weight="700" fill="#211a16">人工边界案例</text><text x="880" y="285" font-size="20" fill="#3e3127">覆盖空输入、超时、越权</text><text x="880" y="325" font-size="20" fill="#3e3127">模拟尚未发生的高风险</text><text x="880" y="365" font-size="20" fill="#6b5b50">缺点：要避免凭空编场景</text></g><g stroke="#7b5a3d" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M205 440 C205 500 470 500 510 525"/><path d="M600 440 V510"/><path d="M995 440 C995 500 730 500 690 525"/></g><rect x="355" y="510" width="490" height="100" rx="20" fill="#2b211b"/><text x="600" y="552" text-anchor="middle" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#f2b85b">冻结并版本化的 Cohort</text><text x="600" y="585" text-anchor="middle" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="19" fill="#fffaf2">同一次比较必须使用同一批任务</text></svg>