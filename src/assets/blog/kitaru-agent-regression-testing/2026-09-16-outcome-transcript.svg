<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f1e7"/><text x="60" y="78" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="40" font-weight="700" fill="#211a16">评分时先看 Outcome，再读 Transcript</text><text x="60" y="118" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="21" fill="#6b5b50">Agent 说“完成了”不是证据。先检查系统最后真的变成什么。</text><g font-family="Arial,Noto Sans CJK SC,sans-serif"><rect x="55" y="170" width="500" height="390" rx="24" fill="#fffaf2" stroke="#7b5a3d" stroke-width="3"/><rect x="645" y="170" width="500" height="390" rx="24" fill="#fffaf2" stroke="#7b5a3d" stroke-width="3"/><text x="95" y="225" font-size="31" font-weight="700" fill="#6c4a24">Outcome  最终状态</text><text x="685" y="225" font-size="31" font-weight="700" fill="#6c4a24">Transcript  执行轨迹</text><text x="95" y="275" font-size="21" fill="#3e3127">退款记录是否存在</text><text x="95" y="315" font-size="21" fill="#3e3127">订单状态是否正确</text><text x="95" y="355" font-size="21" fill="#3e3127">金额是否正确</text><text x="95" y="395" font-size="21" fill="#3e3127">测试是否通过</text><rect x="95" y="435" width="420" height="85" rx="14" fill="#f4d59a"/><text x="305" y="472" text-anchor="middle" font-size="18" fill="#6b5b50">回答的问题</text><text x="305" y="502" text-anchor="middle" font-size="22" font-weight="700" fill="#211a16">任务真的完成了吗</text><text x="685" y="275" font-size="21" fill="#3e3127">调用了哪些工具</text><text x="685" y="315" font-size="21" fill="#3e3127">参数和返回值是什么</text><text x="685" y="355" font-size="21" fill="#3e3127">哪里重试或报错</text><text x="685" y="395" font-size="21" fill="#3e3127">用了多少轮、时间和 token</text><rect x="685" y="435" width="420" height="85" rx="14" fill="#efe7db"/><text x="895" y="472" text-anchor="middle" font-size="18" fill="#6b5b50">回答的问题</text><text x="895" y="502" text-anchor="middle" font-size="22" font-weight="700" fill="#211a16">为什么成功或失败</text></g><rect x="215" y="590" width="770" height="55" rx="16" fill="#2b211b"/><text x="600" y="626" text-anchor="middle" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="700" fill="#f2b85b">结果用于验收，轨迹用于解释。两者不要混成一个分数。</text></svg>