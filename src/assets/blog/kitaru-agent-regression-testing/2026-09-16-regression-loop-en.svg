<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#F6F0E6"/><text x="70" y="95" font-family="sans-serif" font-size="48" font-weight="700" fill="#2B2118">Turn production failures into regression tests</text><text x="70" y="140" font-family="sans-serif" font-size="24" fill="#6B5A4A">Fix real inputs, change one variable, then decide whether to ship</text><g font-family="sans-serif"><g><rect x="70" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="110" cy="275" r="22" fill="#D49A55"/><text x="102" y="283" font-size="22" font-weight="700" fill="#FFF">1</text><text x="100" y="335" font-size="19" font-weight="700" fill="#2B2118">Production run</text><text x="100" y="380" font-size="19" fill="#6B5A4A">Real user input</text><text x="100" y="415" font-size="13" fill="#6B5A4A">Tool calls and results</text></g><g><rect x="300" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="340" cy="275" r="22" fill="#D49A55"/><text x="332" y="283" font-size="22" font-weight="700" fill="#FFF">2</text><text x="330" y="335" font-size="18.5" font-weight="700" fill="#2B2118">Freeze samples</text><text x="330" y="380" font-size="16.5" fill="#6B5A4A">Recent real traffic</text><text x="330" y="415" font-size="19" fill="#6B5A4A">Known failures</text></g><g><rect x="530" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="570" cy="275" r="22" fill="#D49A55"/><text x="562" y="283" font-size="22" font-weight="700" fill="#FFF">3</text><text x="560" y="335" font-size="16.5" font-weight="700" fill="#2B2118">Change one thing</text><text x="560" y="380" font-size="17" fill="#6B5A4A">Model or prompt</text><text x="560" y="415" font-size="15" fill="#6B5A4A">Code or tool policy</text></g><g><rect x="760" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="800" cy="275" r="22" fill="#D49A55"/><text x="792" y="283" font-size="22" font-weight="700" fill="#FFF">4</text><text x="790" y="335" font-size="29" font-weight="700" fill="#2B2118">Replay</text><text x="790" y="380" font-size="17" fill="#6B5A4A">Rerun the agent</text><text x="790" y="415" font-size="14.5" fill="#6B5A4A">Same external state</text></g><g><rect x="990" y="230" rx="24" width="190" height="210" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><circle cx="1030" cy="275" r="22" fill="#D49A55"/><text x="1022" y="283" font-size="22" font-weight="700" fill="#FFF">5</text><text x="1020" y="335" font-size="29" font-weight="700" fill="#2B2118">Evaluate</text><text x="1020" y="380" font-size="16.5" fill="#6B5A4A">Correct outcome?</text><text x="1020" y="415" font-size="21" fill="#6B5A4A">Lower cost?</text></g><g><rect x="1215" y="230" rx="24" width="130" height="210" fill="#F2E5D4" stroke="#8B6B4A" stroke-width="3"/><text x="1240" y="335" font-size="28" font-weight="700" fill="#2B2118">CI</text><text x="1235" y="380" font-size="19" fill="#6B5A4A">Pass first,</text><text x="1235" y="415" font-size="20.5" fill="#6B5A4A">then ship</text></g><g fill="#8B6B4A" font-size="42"><text x="265" y="355">→</text><text x="495" y="355">→</text><text x="725" y="355">→</text><text x="955" y="355">→</text><text x="1182" y="355">→</text></g><rect x="70" y="520" rx="22" width="1275" height="145" fill="#2B2118"/><text x="105" y="575" font-size="26" font-weight="700" fill="#F8E7C8">Key discipline</text><text x="105" y="620" font-size="22.5" fill="#FFF9F0">Replay the original version unchanged first. Do not compare versions if the baseline cannot be reproduced.</text><text x="105" y="652" font-size="23" fill="#FFF9F0">Change one variable at a time, or you will not know what caused an improvement.</text></g></svg>