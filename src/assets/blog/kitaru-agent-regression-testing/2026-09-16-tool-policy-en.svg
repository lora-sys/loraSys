<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#F6F0E6"/><text x="70" y="95" font-family="sans-serif" font-size="48" font-weight="700" fill="#2B2118">What should tools return during replay?</text><text x="70" y="140" font-family="sans-serif" font-size="24" fill="#6B5A4A">Without fixed external conditions, test results are hard to compare</text><g font-family="sans-serif"><rect x="70" y="215" rx="24" width="285" height="350" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><text x="105" y="275" font-size="31" font-weight="700" fill="#2B2118">history</text><text x="105" y="320" font-size="15" fill="#6B5A4A">Returns the recorded result</text><text x="105" y="365" font-size="15" fill="#6B5A4A">Pro: closest to original state</text><text x="105" y="400" font-size="19" fill="#6B5A4A">Pro: avoids production</text><text x="105" y="450" font-size="21" font-weight="700" fill="#8B4A32">For regression tests</text><rect x="385" y="215" rx="24" width="285" height="350" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><text x="420" y="275" font-size="31" font-weight="700" fill="#2B2118">static</text><text x="420" y="320" font-size="15" fill="#6B5A4A">Returns a predefined result</text><text x="420" y="365" font-size="17" fill="#6B5A4A">Pro: controlled, low cost</text><text x="420" y="400" font-size="18.5" fill="#6B5A4A">Con: may be unrealistic</text><text x="420" y="450" font-size="21" font-weight="700" fill="#8B4A32">For edge-case tests</text><rect x="700" y="215" rx="24" width="285" height="350" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><text x="735" y="275" font-size="31" font-weight="700" fill="#2B2118">passthrough</text><text x="735" y="320" font-size="14.5" fill="#6B5A4A">Calls the real production tool</text><text x="735" y="365" font-size="21" fill="#6B5A4A">Pro: most realistic</text><text x="735" y="400" font-size="17" fill="#6B5A4A">Risk: changes real state</text><text x="735" y="450" font-size="14.5" font-weight="700" fill="#B33425">Avoid by default in regression</text><rect x="1015" y="215" rx="24" width="315" height="350" fill="#2B2118"/><text x="1050" y="275" font-size="21" font-weight="700" fill="#F8E7C8">Recommended default</text><text x="1050" y="335" font-size="21" fill="#FFF9F0">When history matches,</text><text x="1050" y="370" font-size="18.5" fill="#FFF9F0">return the recorded result</text><text x="1050" y="420" font-size="22" fill="#FFF9F0">On a new tool call,</text><text x="1050" y="455" font-size="16.5" fill="#FFF9F0">fail; do not access production</text><text x="1050" y="510" font-size="19" fill="#D9B071">This reveals whether the</text><text x="1050" y="542" font-size="16.5" fill="#D9B071">new version took a new path</text><rect x="70" y="610" rx="18" width="1260" height="78" fill="#E9D7C0"/><text x="100" y="660" font-size="17" font-weight="700" fill="#5A3926">Fix external conditions before comparing models, prompts, or code. An API fluctuation can otherwise look like an agent improvement.</text></g></svg>