<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b5a3d"/></marker></defs><rect width="1200" height="675" fill="#f7f1e7"/><text x="60" y="78" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="40" font-weight="700" fill="#211a16">A regression set needs more than incidents</text><text x="60" y="118" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="21" fill="#6b5b50">Real traffic, past failures, and designed edge cases address three different risks</text><g font-family="Arial,Noto Sans CJK SC,sans-serif"><rect x="55" y="180" width="300" height="260" rx="22" fill="#fffaf2" stroke="#8c7764" stroke-width="3"/><text x="205" y="230" text-anchor="middle" font-size="28" font-weight="700" fill="#211a16">Recent real traffic</text><text x="90" y="285" font-size="15" fill="#3e3127">Covers common user behavior</text><text x="90" y="325" font-size="14.5" fill="#3e3127">Keeps tasks close to production</text><text x="90" y="365" font-size="15" fill="#6b5b50">Con: rare risks may not appear</text><rect x="450" y="180" width="300" height="260" rx="22" fill="#f4d59a" stroke="#a97932" stroke-width="3"/><text x="600" y="230" text-anchor="middle" font-size="28" font-weight="700" fill="#211a16">Historical failures</text><text x="485" y="285" font-size="15" fill="#3e3127">Prevents fixed bugs returning</text><text x="485" y="325" font-size="16.5" fill="#3e3127">Tied directly to real incidents</text><text x="485" y="365" font-size="14.5" fill="#6b5b50">Con: may focus on old problems</text><rect x="845" y="180" width="300" height="260" rx="22" fill="#efe7db" stroke="#8c7764" stroke-width="3"/><text x="995" y="230" text-anchor="middle" font-size="25" font-weight="700" fill="#211a16">Designed edge cases</text><text x="880" y="285" font-size="17" fill="#3e3127"><tspan x="880" y="281">Empty inputs, timeouts,</tspan><tspan x="880" y="304">and unauthorized access</tspan></text><text x="880" y="325" font-size="17" fill="#3e3127"><tspan x="880" y="332">Simulates high risks</tspan><tspan x="880" y="354">not yet encountered</tspan></text><text x="880" y="395" font-size="15" fill="#6b5b50">Con: avoid invented scenarios</text></g><g stroke="#7b5a3d" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M205 440 C205 500 470 500 510 525"/><path d="M600 440 V510"/><path d="M995 440 C995 500 730 500 690 525"/></g><rect x="355" y="510" width="490" height="100" rx="20" fill="#2b211b"/><text x="600" y="552" text-anchor="middle" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#f2b85b">Frozen, versioned Cohort</text><text x="600" y="585" text-anchor="middle" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="19" fill="#fffaf2">Use the same tasks within each comparison</text></svg>