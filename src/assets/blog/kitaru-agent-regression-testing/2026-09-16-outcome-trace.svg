<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#F6F0E6"/><text x="70" y="95" font-family="sans-serif" font-size="48" font-weight="700" fill="#2B2118">评测要看结果，也要看过程</text><text x="70" y="140" font-family="sans-serif" font-size="24" fill="#6B5A4A">先确认事情真的做成，再检查做法是否可靠、合规、可重复</text><g font-family="sans-serif"><rect x="80" y="210" rx="26" width="545" height="390" fill="#EEF4EA" stroke="#6F875C" stroke-width="3"/><text x="120" y="275" font-size="34" font-weight="700" fill="#30452B">结果 Outcome</text><text x="120" y="330" font-size="23" fill="#43583D">数据库里真的有退款记录吗</text><text x="120" y="370" font-size="23" fill="#43583D">文件真的生成了吗</text><text x="120" y="410" font-size="23" fill="#43583D">单元测试真的通过了吗</text><text x="120" y="450" font-size="23" fill="#43583D">最终答案真的满足任务吗</text><rect x="115" y="500" rx="16" width="475" height="62" fill="#6F875C"/><text x="160" y="540" font-size="24" font-weight="700" fill="#FFF">优先用代码和状态检查验证</text><rect x="775" y="210" rx="26" width="545" height="390" fill="#F8ECE0" stroke="#B17A45" stroke-width="3"/><text x="815" y="275" font-size="34" font-weight="700" fill="#6A4026">过程 Transcript</text><text x="815" y="330" font-size="23" fill="#6A4E3D">调用了哪些工具</text><text x="815" y="370" font-size="23" fill="#6A4E3D">是否越过权限</text><text x="815" y="410" font-size="23" fill="#6A4E3D">是否反复重试或浪费 token</text><text x="815" y="450" font-size="23" fill="#6A4E3D">错误发生在哪一步</text><rect x="810" y="500" rx="16" width="475" height="62" fill="#B17A45"/><text x="850" y="540" font-size="24" font-weight="700" fill="#FFF">用于诊断、质量和安全检查</text><circle cx="700" cy="405" r="82" fill="#2B2118"/><text x="654" y="398" font-size="25" font-weight="700" fill="#F8E7C8">两边</text><text x="642" y="435" font-size="25" font-weight="700" fill="#F8E7C8">都要看</text><rect x="115" y="635" rx="18" width="1170" height="72" fill="#E9D7C0"/><text x="145" y="680" font-size="23" font-weight="700" fill="#5A3926">Agent 说“完成了”只是轨迹中的一句话。最终状态才决定任务是否完成，轨迹负责解释为什么成功或失败。</text></g></svg>