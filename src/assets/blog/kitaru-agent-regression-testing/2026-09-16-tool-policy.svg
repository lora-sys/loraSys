<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#F6F0E6"/><text x="70" y="95" font-family="sans-serif" font-size="48" font-weight="700" fill="#2B2118">重放时，工具到底该返回什么</text><text x="70" y="140" font-family="sans-serif" font-size="24" fill="#6B5A4A">外部世界不固定，测试结果就很难比较</text><g font-family="sans-serif"><rect x="70" y="215" rx="24" width="285" height="350" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><text x="105" y="275" font-size="31" font-weight="700" fill="#2B2118">history</text><text x="105" y="320" font-size="22" fill="#6B5A4A">返回原运行记录里的结果</text><text x="105" y="365" font-size="21" fill="#6B5A4A">优点：最接近原现场</text><text x="105" y="400" font-size="21" fill="#6B5A4A">优点：不会碰生产系统</text><text x="105" y="450" font-size="21" font-weight="700" fill="#8B4A32">适合回归测试</text><rect x="385" y="215" rx="24" width="285" height="350" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><text x="420" y="275" font-size="31" font-weight="700" fill="#2B2118">static</text><text x="420" y="320" font-size="22" fill="#6B5A4A">返回预先写好的固定结果</text><text x="420" y="365" font-size="21" fill="#6B5A4A">优点：可控、便宜</text><text x="420" y="400" font-size="21" fill="#6B5A4A">缺点：可能不够真实</text><text x="420" y="450" font-size="21" font-weight="700" fill="#8B4A32">适合边界测试</text><rect x="700" y="215" rx="24" width="285" height="350" fill="#FFF9F0" stroke="#8B6B4A" stroke-width="3"/><text x="735" y="275" font-size="31" font-weight="700" fill="#2B2118">passthrough</text><text x="735" y="320" font-size="22" fill="#6B5A4A">真正调用线上工具</text><text x="735" y="365" font-size="21" fill="#6B5A4A">优点：最真实</text><text x="735" y="400" font-size="21" fill="#6B5A4A">风险：会修改真实状态</text><text x="735" y="450" font-size="21" font-weight="700" fill="#B33425">默认不要用于回归</text><rect x="1015" y="215" rx="24" width="315" height="350" fill="#2B2118"/><text x="1050" y="275" font-size="31" font-weight="700" fill="#F8E7C8">推荐默认值</text><text x="1050" y="335" font-size="22" fill="#FFF9F0">历史记录能命中时</text><text x="1050" y="370" font-size="22" fill="#FFF9F0">直接返回历史结果</text><text x="1050" y="420" font-size="22" fill="#FFF9F0">遇到新工具调用时</text><text x="1050" y="455" font-size="22" fill="#FFF9F0">直接失败，不访问生产</text><text x="1050" y="510" font-size="21" fill="#D9B071">这样才能知道新方案</text><text x="1050" y="542" font-size="21" fill="#D9B071">是不是改变了行为路径</text><rect x="70" y="610" rx="18" width="1260" height="78" fill="#E9D7C0"/><text x="100" y="660" font-size="24" font-weight="700" fill="#5A3926">先控制外部条件，再比较模型、提示词或代码。否则一次 API 波动就可能被误认为 Agent 变好了。</text></g></svg>