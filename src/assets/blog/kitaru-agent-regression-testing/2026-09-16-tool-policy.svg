<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f1e7"/><text x="60" y="78" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="40" font-weight="700" fill="#211a16">Replay 最容易踩坑的是工具</text><text x="60" y="118" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="21" fill="#6b5b50">Kitaru 的三种工具策略，决定测试是在复现现场，还是又碰了一次真实系统</text><g font-family="Arial,Noto Sans CJK SC,sans-serif"><rect x="55" y="175" width="330" height="350" rx="22" fill="#f4d59a" stroke="#a97932" stroke-width="3"/><text x="85" y="225" font-size="31" font-weight="700" fill="#211a16">history</text><text x="85" y="265" font-size="20" fill="#3e3127">按工具名和参数匹配历史结果</text><text x="85" y="305" font-size="20" fill="#3e3127">不调用真实工具</text><text x="85" y="345" font-size="20" fill="#3e3127">未匹配时可设置 fail</text><rect x="85" y="395" width="270" height="90" rx="14" fill="#fffaf2"/><text x="220" y="430" text-anchor="middle" font-size="18" fill="#6b5b50">适合回归测试</text><text x="220" y="462" text-anchor="middle" font-size="22" font-weight="700" fill="#6c4a24">复现当时的外部世界</text><rect x="435" y="175" width="330" height="350" rx="22" fill="#efe7db" stroke="#8c7764" stroke-width="3"/><text x="465" y="225" font-size="31" font-weight="700" fill="#211a16">static</text><text x="465" y="265" font-size="20" fill="#3e3127">返回预先指定的固定结果</text><text x="465" y="305" font-size="20" fill="#3e3127">不依赖真实系统</text><text x="465" y="345" font-size="20" fill="#3e3127">适合故障和边界条件</text><rect x="465" y="395" width="270" height="90" rx="14" fill="#fffaf2"/><text x="600" y="430" text-anchor="middle" font-size="18" fill="#6b5b50">适合构造测试现场</text><text x="600" y="462" text-anchor="middle" font-size="22" font-weight="700" fill="#6c4a24">结果完全可控</text><rect x="815" y="175" width="330" height="350" rx="22" fill="#fff3e8" stroke="#bd684d" stroke-width="3"/><text x="845" y="225" font-size="31" font-weight="700" fill="#211a16">passthrough</text><text x="845" y="265" font-size="20" fill="#3e3127">真的调用外部工具</text><text x="845" y="305" font-size="20" fill="#3e3127">外部状态可能变化</text><text x="845" y="345" font-size="20" fill="#9a3e2f">可能产生真实副作用</text><rect x="845" y="395" width="270" height="90" rx="14" fill="#fffaf2"/><text x="980" y="430" text-anchor="middle" font-size="18" fill="#6b5b50">只在明确需要时使用</text><text x="980" y="462" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3e2f">不是默认安全选项</text></g><rect x="55" y="565" width="1090" height="70" rx="16" fill="#2b211b"/><text x="600" y="608" text-anchor="middle" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="700" fill="#f2b85b">回归测试要隔离生产系统。出现历史里没有的新调用时，先停下来检查。</text></svg>