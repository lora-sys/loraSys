<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#F5F0E7"/><rect x="40" y="36" width="1360" height="100" rx="24" fill="#211B17"/><text x="80" y="98" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#FFF8EC">Tool Search changes which tools enter context</text><text x="80" y="128" font-family="Arial, sans-serif" font-size="22" fill="#D8C8B4">It selects visible definitions, rather than changing how tools are called</text><rect x="60" y="180" width="620" height="560" rx="28" fill="#FFF9F0" stroke="#9D8063" stroke-width="3"/><text x="100" y="235" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#3A2C24">Preload everything</text><rect x="100" y="275" width="540" height="390" rx="22" fill="#EFE4D5"/><text x="130" y="318" font-family="Arial, sans-serif" font-size="22" fill="#5A4637">Model context</text><g fill="#D2B99F" stroke="#5A4637" stroke-width="2"><rect x="130" y="350" width="145" height="70" rx="14"/><rect x="295" y="350" width="145" height="70" rx="14"/><rect x="460" y="350" width="145" height="70" rx="14"/><rect x="130" y="440" width="145" height="70" rx="14"/><rect x="295" y="440" width="145" height="70" rx="14"/><rect x="460" y="440" width="145" height="70" rx="14"/><rect x="130" y="530" width="145" height="70" rx="14"/><rect x="295" y="530" width="145" height="70" rx="14"/><rect x="460" y="530" width="145" height="70" rx="14"/></g><g font-family="Arial, sans-serif" font-size="19" fill="#3A2C24" text-anchor="middle"><text x="202" y="393" style=";font-size:17px"><tspan x="202.0" y="385.0">Tool</tspan><tspan x="202.0" y="405.0">definition</tspan></text><text x="367" y="393" style=";font-size:17px"><tspan x="367.0" y="385.0">Tool</tspan><tspan x="367.0" y="405.0">definition</tspan></text><text x="532" y="393" style=";font-size:17px"><tspan x="532.0" y="385.0">Tool</tspan><tspan x="532.0" y="405.0">definition</tspan></text><text x="202" y="483" style=";font-size:17px"><tspan x="202.0" y="475.0">Tool</tspan><tspan x="202.0" y="495.0">definition</tspan></text><text x="367" y="483" style=";font-size:17px"><tspan x="367.0" y="475.0">Tool</tspan><tspan x="367.0" y="495.0">definition</tspan></text><text x="532" y="483" style=";font-size:17px"><tspan x="532.0" y="475.0">Tool</tspan><tspan x="532.0" y="495.0">definition</tspan></text><text x="202" y="573" style=";font-size:17px"><tspan x="202.0" y="565.0">Tool</tspan><tspan x="202.0" y="585.0">definition</tspan></text><text x="367" y="573" style=";font-size:17px"><tspan x="367.0" y="565.0">Tool</tspan><tspan x="367.0" y="585.0">definition</tspan></text><text x="532" y="573">More tools</text></g><text x="100" y="710" font-family="Arial, sans-serif" font-size="22" fill="#8B3F32" style=";font-size:17px"><tspan x="100.0" y="702.0">Problem: definitions fill context, mixing relevant and irrelevant</tspan><tspan x="100.0" y="722.0">tools</tspan></text><rect x="760" y="180" width="620" height="560" rx="28" fill="#FFF9F0" stroke="#A66F23" stroke-width="3"/><text x="800" y="235" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#3A2C24">Load on demand</text><rect x="820" y="290" width="500" height="76" rx="18" fill="#E8DDCF"/><text x="1070" y="338" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#3A2C24">User task</text><path d="M1070 370 L1070 410" stroke="#6C5747" stroke-width="5" marker-end="url(#a)"/><rect x="880" y="420" width="380" height="82" rx="18" fill="#DDB06B"/><text x="1070" y="470" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2A211D">Tool Search</text><path d="M1070 506 L1070 546" stroke="#6C5747" stroke-width="5" marker-end="url(#a)"/><rect x="815" y="558" width="510" height="96" rx="18" fill="#F1E2C7"/><g fill="#CDA679" stroke="#5A4637" stroke-width="2"><rect x="845" y="580" width="135" height="50" rx="12"/><rect x="1003" y="580" width="135" height="50" rx="12"/><rec