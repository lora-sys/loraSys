<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#F5F0E7"/><rect x="42" y="36" width="1356" height="100" rx="24" fill="#211B17"/><text x="80" y="96" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFF8EC">A one-hour controlled Tool Search experiment</text><text x="80" y="126" font-family="Arial, sans-serif" font-size="21" fill="#D8C8B4">Teaching experiment design; results are not assumed</text><rect x="70" y="180" width="600" height="420" rx="28" fill="#FFF9F0" stroke="#9D8063" stroke-width="3"/><text x="110" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">Group A: load all tools directly</text><rect x="110" y="285" width="520" height="92" rx="18" fill="#E8DDCF"/><text x="370" y="340" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24" style=";font-size:17.2px">Same tasks + same model + same tool implementations</text><rect x="110" y="415" width="520" height="112" rx="18" fill="#F1E2C7"/><text x="370" y="457" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">All tool definitions enter model context</text><text x="370" y="495" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#6C5747">Record each selection, call, and final result</text><rect x="770" y="180" width="600" height="420" rx="28" fill="#FFF9F0" stroke="#A66F23" stroke-width="3"/><text x="810" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">Group B: on-demand Tool Search</text><rect x="810" y="285" width="520" height="92" rx="18" fill="#E8DDCF"/><text x="1070" y="340" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24" style=";font-size:20.0px">Keep tasks, model, and tools identical to group A</text><rect x="810" y="415" width="520" height="112" rx="18" fill="#DDB06B"/><text x="1070" y="457" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2A211D" style=";font-size:19.6px">Retrieve first, then load a few relevant tools</text><text x="1070" y="495" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#3A2C24">Record search hits and subsequent calls</text><rect x="150" y="650" width="1140" height="120" rx="24" fill="#2E241E"/><text x="190" y="695" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#FFF8EC">Compare verifiable metrics only</text><text x="190" y="738" font-family="Arial, sans-serif" font-size="21" fill="#E4D5C5">Task success   Correct tool selection   Input tokens   Total time   Tool errors   Irrelevant calls</text><text x="1040" y="695" font-family="Arial, sans-serif" font-size="22" fill="#F1C77D" style=";font-size:17px"><tspan x="1040.0" y="687.0">Change only the</tspan><tspan x="1040.0" y="707.0">tool-loading method</tspan></text></svg>