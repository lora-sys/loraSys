<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#F5F0E7"/><rect x="42" y="36" width="1356" height="102" rx="24" fill="#211B17"/><text x="80" y="96" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFF8EC">MCP, Tool Search, and ARD have different jobs</text><text x="80" y="128" font-family="Arial, sans-serif" font-size="21" fill="#D8C8B4">Three responsibilities, based on official documentation</text><rect x="90" y="188" width="1260" height="150" rx="28" fill="#FFF9F0" stroke="#A66F23" stroke-width="3"/><text x="130" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">ARD: which external capabilities are available?</text><text x="130" y="282" font-family="Arial, sans-serif" font-size="21.2" fill="#5A4637">Search federated registries for MCP servers, skills, agents, or other resources</text><rect x="980" y="222" width="310" height="74" rx="18" fill="#F1E2C7"/><text x="1135" y="268" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">Resource discovery</text><path d="M720 342 L720 390" stroke="#6C5747" stroke-width="6" marker-end="url(#a)"/><rect x="90" y="402" width="1260" height="150" rx="28" fill="#FFF9F0" stroke="#9D8063" stroke-width="3"/><text x="130" y="449" font-family="Arial, sans-serif" font-size="24.3" font-weight="700" fill="#3A2C24">MCP: how do connected services expose and execute tools?</text><text x="130" y="496" font-family="Arial, sans-serif" font-size="19.7" fill="#5A4637">Standardize tool connections, arguments, and results between clients and services</text><rect x="980" y="436" width="310" height="74" rx="18" fill="#E8DDCF"/><text x="1135" y="482" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">Connect and execute</text><path d="M720 556 L720 604" stroke="#6C5747" stroke-width="6" marker-end="url(#a)"/><rect x="90" y="616" width="1260" height="150" rx="28" fill="#FFF9F0" stroke="#A66F23" stroke-width="3"/><text x="130" y="663" font-family="Arial, sans-serif" font-size="22.1" font-weight="700" fill="#3A2C24">Tool Search: which definitions should the model see for this task?</text><text x="130" y="710" font-family="Arial, sans-serif" font-size="20.3" fill="#5A4637">Retrieve relevant tools from a known catalog and load them into current context</text><rect x="980" y="650" width="310" height="74" rx="18" fill="#DDB06B"/><text x="1135" y="696" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2A211D">Context selection</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6C5747"/></marker></defs></svg>