<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#F5F0E7"/><rect x="44" y="38" width="1352" height="96" rx="24" fill="#211B17"/><text x="82" y="98" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFF8EC">defer_loading 如何省上下文，又保住 Prompt Cache</text><text x="82" y="128" font-family="Arial, sans-serif" font-size="21" fill="#D8C8B4">以 Anthropic Tool Search 的公开机制为例</text><rect x="65" y="180" width="360" height="540" rx="28" fill="#FFF9F0" stroke="#9D8063" stroke-width="3"/><text x="105" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">请求发给 API</text><rect x="105" y="280" width="280" height="78" rx="16" fill="#E8DDCF"/><text x="245" y="328" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#3A2C24">常用工具</text><rect x="105" y="380" width="280" height="78" rx="16" fill="#E8DDCF"/><text x="245" y="428" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#3A2C24">Tool Search</text><rect x="105" y="480" width="280" height="112" rx="16" fill="#F1E2C7"/><text x="245" y="520" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">延迟工具定义</text><text x="245" y="555" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#6C5747">仍在 tools 数组里</text><text x="245" y="585" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#6C5747">但标记 defer_loading</text><text x="105" y="660" font-family="Arial, sans-serif" font-size="20" fill="#6F4A1E">API 服务器仍然知道全部工具</text><path d="M430 450 L525 450" stroke="#6C5747" stroke-width="6" marker-end="url(#a)"/><rect x="540" y="180" width="360" height="540" rx="28" fill="#FFF9F0" stroke="#A66F23" stroke-width="3"/><text x="580" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">模型起始上下文</text><rect x="580" y="285" width="280" height="100" rx="16" fill="#DDB06B"/><text x="720" y="326" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#2A211D">稳定前缀</text><text x="720" y="360" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#3A2C24">系统提示 + 常用工具 + Tool Search</text><rect x="580" y="425" width="280" height="138" rx="16" fill="#F6EBDD" stroke="#B89975" stroke-dasharray="10 8" stroke-width="3"/><text x="720" y="475" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#6C5747">延迟工具</text><text x="720" y="510" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#6C5747">暂时不进入模型前缀</text><text x="720" y="545" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#6C5747">缓存键不被这批定义扰动</text><text x="580" y="640" font-family="Arial, sans-serif" font-size="20" fill="#6F4A1E">Prompt Cache 继续复用稳定前缀</text><path d="M905 450 L1000 450" stroke="#6C5747" stroke-width="6" marker-end="url(#a)"/><rect x="1015" y="180" width="360" height="540" rx="28" fill="#FFF9F0" stroke="#9D8063" stroke-width="3"/><text x="1055" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">需要工具时</text><rect x="1055" y="285" width="280" height="78" rx="16" fill="#E8DDCF"/><text x="1195" y="333" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#3A2C24">搜索工具目录</text><path d="M1195 368 L1195 405" stroke="#6C5747" stroke-width="5" marker-end="url(#a)"/><rect x="1055" y="418" width="280" height="82" rx="16" fill="#DDB06B"/><text x="1195" y="467" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#2A211D">tool_reference</text><path d="M1195 505 L1195 542" stroke="#6C5747" stroke-width="5" marker-end="url(#a)"/><rect x="1055" y="555" width="280" height="100" rx="16" fill="#F1E2C7"/><text x="1195" y="597" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">完整工具定义</text><text x="1195" y="630" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#6C5747">在对话当前位置展开</text><text x="1055" y="690" font-family="Arial, sans-serif" font-size="20" fill="#6F4A1E">只在真正需要时占用上下文</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6C5747"/></marker></defs></svg>