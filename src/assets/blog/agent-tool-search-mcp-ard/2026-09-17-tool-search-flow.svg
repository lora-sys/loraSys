<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#F5F0E7"/><rect x="40" y="36" width="1360" height="100" rx="24" fill="#211B17"/><text x="80" y="98" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#FFF8EC">工具搜索改变的不是“会不会调用工具”</text><text x="80" y="128" font-family="Arial, sans-serif" font-size="22" fill="#D8C8B4">它改变的是哪些工具定义进入模型当前上下文</text><rect x="60" y="180" width="620" height="560" rx="28" fill="#FFF9F0" stroke="#9D8063" stroke-width="3"/><text x="100" y="235" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#3A2C24">全部预加载</text><rect x="100" y="275" width="540" height="390" rx="22" fill="#EFE4D5"/><text x="130" y="318" font-family="Arial, sans-serif" font-size="22" fill="#5A4637">模型上下文</text><g fill="#D2B99F" stroke="#5A4637" stroke-width="2"><rect x="130" y="350" width="145" height="70" rx="14"/><rect x="295" y="350" width="145" height="70" rx="14"/><rect x="460" y="350" width="145" height="70" rx="14"/><rect x="130" y="440" width="145" height="70" rx="14"/><rect x="295" y="440" width="145" height="70" rx="14"/><rect x="460" y="440" width="145" height="70" rx="14"/><rect x="130" y="530" width="145" height="70" rx="14"/><rect x="295" y="530" width="145" height="70" rx="14"/><rect x="460" y="530" width="145" height="70" rx="14"/></g><g font-family="Arial, sans-serif" font-size="19" fill="#3A2C24" text-anchor="middle"><text x="202" y="393">工具定义</text><text x="367" y="393">工具定义</text><text x="532" y="393">工具定义</text><text x="202" y="483">工具定义</text><text x="367" y="483">工具定义</text><text x="532" y="483">工具定义</text><text x="202" y="573">工具定义</text><text x="367" y="573">工具定义</text><text x="532" y="573">更多工具</text></g><text x="100" y="710" font-family="Arial, sans-serif" font-size="22" fill="#8B3F32">问题：工具定义先占上下文，相关与无关信息混在一起</text><rect x="760" y="180" width="620" height="560" rx="28" fill="#FFF9F0" stroke="#A66F23" stroke-width="3"/><text x="800" y="235" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#3A2C24">按需加载</text><rect x="820" y="290" width="500" height="76" rx="18" fill="#E8DDCF"/><text x="1070" y="338" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#3A2C24">用户任务</text><path d="M1070 370 L1070 410" stroke="#6C5747" stroke-width="5" marker-end="url(#a)"/><rect x="880" y="420" width="380" height="82" rx="18" fill="#DDB06B"/><text x="1070" y="470" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2A211D">工具搜索</text><path d="M1070 506 L1070 546" stroke="#6C5747" stroke-width="5" marker-end="url(#a)"/><rect x="815" y="558" width="510" height="96" rx="18" fill="#F1E2C7"/><g fill="#CDA679" stroke="#5A4637" stroke-width="2"><rect x="845" y="580" width="135" height="50" rx="12"/><rect x="1003" y="580" width="135" height="50" rx="12"/><rect x="1160" y="580" width="135" height="50" rx="12"/></g><g font-family="Arial, sans-serif" font-size="18" fill="#3A2C24" text-anchor="middle"><text x="912" y="612">相关工具</text><text x="1070" y="612">相关工具</text><text x="1227" y="612">相关工具</text></g><path d="M1070 658 L1070 690" stroke="#6C5747" stroke-width="5" marker-end="url(#a)"/><text x="1070" y="725" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#2A211D">模型调用</text><text x="800" y="710" font-family="Arial, sans-serif" font-size="21" fill="#6F4A1E">关键：只把当前任务需要的工具定义加载进来</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6C5747"/></marker></defs></svg>