<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#F5F0E7"/><rect x="42" y="36" width="1356" height="102" rx="24" fill="#211B17"/><text x="80" y="96" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFF8EC">MCP、Tool Search、ARD 解决的不是同一个问题</text><text x="80" y="128" font-family="Arial, sans-serif" font-size="21" fill="#D8C8B4">本文根据官方文档整理三层职责</text><rect x="90" y="188" width="1260" height="150" rx="28" fill="#FFF9F0" stroke="#A66F23" stroke-width="3"/><text x="130" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">ARD：先回答“外面有什么能力可以用？”</text><text x="130" y="282" font-family="Arial, sans-serif" font-size="22" fill="#5A4637">搜索联邦 Registry，发现 MCP Server、Skill、Agent 或其他资源</text><rect x="980" y="222" width="310" height="74" rx="18" fill="#F1E2C7"/><text x="1135" y="268" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">资源发现</text><path d="M720 342 L720 390" stroke="#6C5747" stroke-width="6" marker-end="url(#a)"/><rect x="90" y="402" width="1260" height="150" rx="28" fill="#FFF9F0" stroke="#9D8063" stroke-width="3"/><text x="130" y="449" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">MCP：再回答“已连接的服务怎样暴露工具并执行？”</text><text x="130" y="496" font-family="Arial, sans-serif" font-size="22" fill="#5A4637">标准化客户端与外部服务之间的工具连接、参数与结果传递</text><rect x="980" y="436" width="310" height="74" rx="18" fill="#E8DDCF"/><text x="1135" y="482" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">连接与执行</text><path d="M720 556 L720 604" stroke="#6C5747" stroke-width="6" marker-end="url(#a)"/><rect x="90" y="616" width="1260" height="150" rx="28" fill="#FFF9F0" stroke="#A66F23" stroke-width="3"/><text x="130" y="663" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">Tool Search：最后回答“这次任务应该把哪些工具定义给模型？”</text><text x="130" y="710" font-family="Arial, sans-serif" font-size="22" fill="#5A4637">在已知工具目录中检索相关工具，按需加载进当前上下文</text><rect x="980" y="650" width="310" height="74" rx="18" fill="#DDB06B"/><text x="1135" y="696" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2A211D">上下文选择</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6C5747"/></marker></defs></svg>