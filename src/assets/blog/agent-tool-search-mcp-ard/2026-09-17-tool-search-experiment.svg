<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#F5F0E7"/><rect x="42" y="36" width="1356" height="100" rx="24" fill="#211B17"/><text x="80" y="96" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFF8EC">一个小时能做完的 Tool Search 对照实验</text><text x="80" y="126" font-family="Arial, sans-serif" font-size="21" fill="#D8C8B4">教学实验设计，不预设结果</text><rect x="70" y="180" width="600" height="420" rx="28" fill="#FFF9F0" stroke="#9D8063" stroke-width="3"/><text x="110" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">A 组：全部工具直接加载</text><rect x="110" y="285" width="520" height="92" rx="18" fill="#E8DDCF"/><text x="370" y="340" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">同一批任务 + 同一模型 + 同一工具实现</text><rect x="110" y="415" width="520" height="112" rx="18" fill="#F1E2C7"/><text x="370" y="457" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">所有工具定义进入模型上下文</text><text x="370" y="495" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#6C5747">记录每次选择、调用和最终结果</text><rect x="770" y="180" width="600" height="420" rx="28" fill="#FFF9F0" stroke="#A66F23" stroke-width="3"/><text x="810" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3A2C24">B 组：Tool Search 按需加载</text><rect x="810" y="285" width="520" height="92" rx="18" fill="#E8DDCF"/><text x="1070" y="340" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3A2C24">任务、模型、工具实现与 A 组保持一致</text><rect x="810" y="415" width="520" height="112" rx="18" fill="#DDB06B"/><text x="1070" y="457" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2A211D">先检索，再加载少量相关工具</text><text x="1070" y="495" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#3A2C24">记录搜索命中与后续调用</text><rect x="150" y="650" width="1140" height="120" rx="24" fill="#2E241E"/><text x="190" y="695" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#FFF8EC">只比较可验证指标</text><text x="190" y="738" font-family="Arial, sans-serif" font-size="21" fill="#E4D5C5">任务是否完成　工具选择是否正确　输入 token　总耗时　工具错误　不相关工具调用次数</text><text x="1040" y="695" font-family="Arial, sans-serif" font-size="22" fill="#F1C77D">一次只改“工具加载方式”</text></svg>