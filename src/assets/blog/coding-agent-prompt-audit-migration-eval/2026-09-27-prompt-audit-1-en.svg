<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900">
<style>
text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#2f2822}
.h1{font-size:44px;font-weight:700}.h2{font-size:27px;font-weight:700}.b{font-size:22px}.s{font-size:18px}
</style>
<rect width="1536" height="900" fill="#f5eddf" />
<text x="70" y="78" class="h1" font-size="40.5" style="font-size:40.5px" font-family="Arial, sans-serif">Why old prompts can become a burden after a model upgrade</text>
<text x="70" y="122" class="b" font-size="22.0" style="font-size:22.0px" font-family="Arial, sans-serif">The same reinforcing instruction can trigger different amounts of search, tool use, and verification across models.</text>
<rect x="55" y="165" width="665" height="590" rx="28" fill="#fff9ef" stroke="#8c725c" stroke-width="3" />
<rect x="816" y="165" width="665" height="590" rx="28" fill="#fff9ef" stroke="#c78a42" stroke-width="3" />
<text x="90" y="220" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">With the old model</text>
<text x="850" y="220" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">After the model upgrade</text>
<rect x="105" y="270" width="565" height="320" rx="20" fill="#eee0cf" />
<text x="135" y="315" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">CLAUDE.md</text>
<text x="135" y="365" class="b" font-size="22.0" style="font-size:22.0px" font-family="Arial, sans-serif">Use tools when uncertain</text>
<text x="135" y="405" class="b" font-size="22.0" style="font-size:22.0px" font-family="Arial, sans-serif">Always check repeatedly</text>
<text x="135" y="445" class="b" font-size="22.0" style="font-size:22.0px" font-family="Arial, sans-serif">Search more thoroughly by default</text>
<text x="135" y="510" class="s" font-size="18.0" style="font-size:18.0px" font-family="Arial, sans-serif">These rules may once have compensated for</text>
<text x="135" y="542" class="s" font-size="18.0" style="font-size:18.0px" font-family="Arial, sans-serif">too little tool use or verification.</text>
<rect x="866" y="270" width="565" height="320" rx="20" fill="#f2ddbd" />
<text x="896" y="315" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">The same prompt</text>
<text x="896" y="365" class="b" font-size="22.0" style="font-size:22.0px" font-family="Arial, sans-serif">Repeated searches</text>
<text x="896" y="405" class="b" font-size="22.0" style="font-size:22.0px" font-family="Arial, sans-serif">Repeated checks</text>
<text x="896" y="445" class="b" font-size="22.0" style="font-size:22.0px" font-family="Arial, sans-serif">Too many tool calls</text>
<text x="896" y="485" class="b" font-size="22.0" style="font-size:22.0px" font-family="Arial, sans-serif">Extra tokens and latency</text>
<text x="896" y="535" class="s" font-size="18.0" style="font-size:18.0px" font-family="Arial, sans-serif">The new model is already more proactive.</text>
<text x="896" y="567" class="s" font-size="18.0" style="font-size:18.0px" font-family="Arial, sans-serif">Old reinforcement may now overprompt it.</text>
<path d="M710 445 L810 445" stroke="#c78a42" stroke-width="10" /><path d="M790 425 L815 445 L790 465" fill="none" stroke="#c78a42" stroke-width="10" />
<text x="105" y="625" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">Do not simply delete rules</text>
<text x="865" y="625" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">Audit first, then test</text>
<text x="90" y="690" class="b" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Keep safety boundaries, project facts, and acceptance requirements</text>
<text x="850" y="690" class="b" font-size="16.5" style="font-size:16.5px" font-family="Arial, sans-serif">Review model workarounds, repeated checks, and excessive tool triggers</text>
<rect x="55" y="790" width="1426" height="72" rx="18" fill="#3e342c" />
<text x="100" y="837" font-family="Arial, sans-serif" font-size="25.0" style="fill:#fff9ef;font-size:25.0px">Retest prompts as model behavior changes. Old model workarounds are not permanent rules.</text>
</svg>