<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900">
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#302820}.h1{font-size:43px;font-weight:700}.h2{font-size:27px;font-weight:700}.b{font-size:21px}.s{font-size:17px}.tag{font-size:18px;font-weight:700}</style>
<rect width="1536" height="900" fill="#f6efe3" />
<text x="70" y="78" class="h1" font-size="43.0" style="font-size:43.0px" font-family="Arial, sans-serif">Where should an instruction live?</text>
<text x="70" y="120" class="b" font-size="21.0" style="font-size:21.0px" font-family="Arial, sans-serif">Decide when it needs to enter context, then choose CLAUDE.md, a Rule, a Skill, or an Agent.</text>
<rect x="55" y="175" width="330" height="560" rx="25" fill="#fffaf1" stroke="#6f5d50" stroke-width="3" />
<rect x="415" y="175" width="330" height="560" rx="25" fill="#fffaf1" stroke="#9c7d5e" stroke-width="3" />
<rect x="775" y="175" width="330" height="560" rx="25" fill="#fffaf1" stroke="#c08a4d" stroke-width="3" />
<rect x="1135" y="175" width="345" height="560" rx="25" fill="#fffaf1" stroke="#7b684f" stroke-width="3" />
<text x="90" y="230" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">CLAUDE.md</text><text x="450" y="230" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">Rule</text><text x="810" y="230" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">Skill</text><text x="1170" y="230" class="h2" font-size="27.0" style="font-size:27.0px" font-family="Arial, sans-serif">Agent</text>
<rect x="90" y="265" width="260" height="58" rx="14" fill="#e7d7c5" /><text x="120" y="302" class="tag" font-size="18.0" style="font-size:18.0px" font-family="Arial, sans-serif">Needed every session</text>
<rect x="450" y="265" width="260" height="58" rx="14" fill="#eadfce" /><text x="480" y="302" class="tag" font-size="18.0" style="font-size:18.0px" font-family="Arial, sans-serif">Global or path-scoped</text>
<rect x="810" y="265" width="260" height="58" rx="14" fill="#f2dfbf" /><text x="840" y="302" class="tag" font-size="18.0" style="font-size:18.0px" font-family="Arial, sans-serif">Loaded on demand</text>
<rect x="1170" y="265" width="275" height="58" rx="14" fill="#e6d9c9" /><text x="1200" y="302" class="tag" font-size="14.5" style="font-size:14.5px" font-family="Arial, sans-serif">Separate execution context</text>
<text x="90" y="375" class="b" font-size="21.0" style="font-size:21.0px" font-family="Arial, sans-serif">Good fit</text><text x="90" y="415" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Build commands</text><text x="90" y="450" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Core coding conventions</text><text x="90" y="485" class="s" font-size="16.5" style="font-size:16.5px" font-family="Arial, sans-serif">Rules that must never be broken</text>
<text x="450" y="375" class="b" font-size="21.0" style="font-size:21.0px" font-family="Arial, sans-serif">Good fit</text><text x="450" y="415" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Language or directory rules</text><text x="450" y="450" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Applies only to selected paths</text><text x="450" y="485" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Less irrelevant context</text>
<text x="810" y="375" class="b" font-size="21.0" style="font-size:21.0px" font-family="Arial, sans-serif">Good fit</text><text x="810" y="415" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Deployment procedures</text><text x="810" y="450" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">API reference material</text><text x="810" y="485" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Occasional workflows</text>
<text x="1170" y="375" class="b" font-size="21.0" style="font-size:21.0px" font-family="Arial, sans-serif">Good fit</text><text x="1170" y="415" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Code review</text><text x="1170" y="450" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Independent research</text><text x="1170" y="485" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Work needing isolated context</text>
<line x1="90" y1="535" x2="350" y2="535" stroke="#c5b09a" stroke-width="2" /><line x1="450" y1="535" x2="710" y2="535" stroke="#c5b09a" stroke-width="2" /><line x1="810" y1="535" x2="1070" y2="535" stroke="#c5b09a" stroke-width="2" /><line x1="1170" y1="535" x2="1440" y2="535" stroke="#c5b09a" stroke-width="2" />
<text x="90" y="580" class="b" font-size="21.0" style="font-size:21.0px" font-family="Arial, sans-serif">Poor fit</text><text x="90" y="620" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Long reference documents</text><text x="90" y="655" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Steps used only in a few tasks</text>
<text x="450" y="580" class="b" font-size="21.0" style="font-size:21.0px" font-family="Arial, sans-serif">Poor fit</text><text x="450" y="620" class="s" font-size="15.0" style="font-size:15.0px" font-family="Arial, sans-serif">Details irrelevant to every project</text><text x="450" y="655" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Workflows unrelated to paths</text>
<text x="810" y="580" class="b" font-size="21.0" style="font-size:21.0px" font-family="Arial, sans-serif">Poor fit</text><text x="810" y="620" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Always-on safety rules</text><text x="810" y="655" class="s" font-size="14.5" style="font-size:14.5px" font-family="Arial, sans-serif">Cannot rely on the model invoking it</text>
<text x="1170" y="580" class="b" font-size="21.0" style="font-size:21.0px" font-family="Arial, sans-serif">Poor fit</text><text x="1170" y="620" class="s" font-size="15.0" style="font-size:15.0px" font-family="Arial, sans-serif">State the main agent must retain</text><text x="1170" y="655" class="s" font-size="16.5" style="font-size:16.5px" font-family="Arial, sans-serif">Simple, tightly sequential tasks</text>
<rect x="55" y="785" width="1425" height="74" rx="18" fill="#44382f" />
<text x="105" y="832" font-family="Arial, sans-serif" font-size="25.0" style="fill:#fffaf1;font-size:25.0px">Claude Code guidance: keep CLAUDE.md concise, with only what every session needs.</text>
</svg>