<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900">
<style>
text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#2f2822}
.h1{font-size:44px;font-weight:700}.h2{font-size:27px;font-weight:700}.b{font-size:22px}.s{font-size:18px}
</style>
<rect width="1536" height="900" fill="#f5eddf"/>
<text x="70" y="78" class="h1">模型升级以后，旧提示为什么可能变成负担</text>
<text x="70" y="122" class="b">同一句强化指令，在不同模型上可能触发不同程度的搜索、工具调用和验证。</text>
<rect x="55" y="165" width="665" height="590" rx="28" fill="#fff9ef" stroke="#8c725c" stroke-width="3"/>
<rect x="816" y="165" width="665" height="590" rx="28" fill="#fff9ef" stroke="#c78a42" stroke-width="3"/>
<text x="90" y="220" class="h2">旧模型阶段</text>
<text x="850" y="220" class="h2">模型升级以后</text>
<rect x="105" y="270" width="565" height="320" rx="20" fill="#eee0cf"/>
<text x="135" y="315" class="h2">CLAUDE.md</text>
<text x="135" y="365" class="b">如果不确定，就使用工具</text>
<text x="135" y="405" class="b">务必反复检查</text>
<text x="135" y="445" class="b">默认做更彻底的搜索</text>
<text x="135" y="510" class="s">这些规则当时可能用于补足</text>
<text x="135" y="542" class="s">工具触发不足或验证不足。</text>
<rect x="866" y="270" width="565" height="320" rx="20" fill="#f2ddbd"/>
<text x="896" y="315" class="h2">同一份提示</text>
<text x="896" y="365" class="b">重复搜索</text>
<text x="896" y="405" class="b">重复检查</text>
<text x="896" y="445" class="b">工具调用过多</text>
<text x="896" y="485" class="b">额外 token 与延迟</text>
<text x="896" y="535" class="s">新模型本来已经更主动，旧的</text>
<text x="896" y="567" class="s">强化措辞可能变成过度提示。</text>
<path d="M710 445 L810 445" stroke="#c78a42" stroke-width="10"/><path d="M790 425 L815 445 L790 465" fill="none" stroke="#c78a42" stroke-width="10"/>
<text x="105" y="625" class="h2">不要直接删</text>
<text x="865" y="625" class="h2">先审计，再实测</text>
<text x="90" y="690" class="b">保留：安全边界、项目事实、验收要求</text>
<text x="850" y="690" class="b">调整：模型补丁式措辞、重复验证、过度工具触发</text>
<rect x="55" y="790" width="1426" height="72" rx="18" fill="#3e342c"/>
<text x="225" y="837" font-family="Noto Sans SC,Arial" font-size="25" style="fill:#fff9ef">提示文件要随模型行为重新验收，不能把旧模型的补丁当成永久规则。</text>
</svg>