<text x="895" y="310" class="h2" font-size="26.0" style="font-size:26.0px" font-family="Arial, sans-serif">Prompt Compatibility check</text><text x="895" y="350" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Scan promptTemplate and enabled Skills</text><text x="895" y="380" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Report suspicious patterns; do not change files</text>
<rect x="865" y="420" width="550" height="125" rx="18" fill="#ead8c2" />
<text x="895" y="460" class="h2" font-size="26.0" style="font-size:26.0px" font-family="Arial, sans-serif">Compatibility records</text><text x="895" y="500" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">File path, model family, last test date, and eval set</text><text x="895" y="530" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Store separately, outside the prompt text</text>
<rect x="865" y="570" width="550" height="125" rx="18" fill="#e4d5c7" />
<text x="895" y="610" class="h2" font-size="26.0" style="font-size:26.0px" font-family="Arial, sans-serif">Migration evals</text><text x="895" y="650" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Compare before and after on the same tasks</text><text x="895" y="680" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Test passes, tool calls, tokens, and elapsed time</text>
<text x="75" y="805" class="b" font-size="20.0" style="font-size:20.0px" font-family="Arial, sans-serif">Keep the existing layers and add checks. Temporary model workarounds should not become permanent rules for every Profile.</text>
<rect x="55" y="835" width="1425" height="42" rx="14" fill="#44382f" />
<text x="85" y="864" font-family="Arial, sans-serif" font-size="20.0" style="fill:#fff9ef;font-size:20.0px">Proposal only; no repository changes. Current doctor checks runtime, locks, Skill integrity, Profiles, and the MCP registry.</text>
