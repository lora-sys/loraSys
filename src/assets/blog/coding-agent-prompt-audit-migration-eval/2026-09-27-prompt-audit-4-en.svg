<text x="120" y="440" class="mono" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">prompts/coding.md / prompts/worker.md</text><text x="120" y="474" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Coding acceptance requirements and worker contracts</text>
