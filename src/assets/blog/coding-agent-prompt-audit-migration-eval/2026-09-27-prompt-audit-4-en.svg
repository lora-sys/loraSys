<text x="120" y="310" class="mono" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">prompts/base.md</text><text x="120" y="344" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Long-term safety, execution, and research principles</text>
