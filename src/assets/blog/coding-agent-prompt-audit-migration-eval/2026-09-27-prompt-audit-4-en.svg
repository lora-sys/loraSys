<text x="120" y="570" class="mono" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">skills/*/SKILL.md</text><text x="120" y="604" class="s" font-size="17.0" style="font-size:17.0px" font-family="Arial, sans-serif">Task-specific reference material and workflows</text>
