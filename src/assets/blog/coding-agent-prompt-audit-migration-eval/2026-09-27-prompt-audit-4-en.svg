<rect width="1536" height="900" fill="#f6eee2" />
<text x="70" y="78" class="h1" font-size="39.0" style="font-size:39.0px" font-family="Arial, sans-serif">Lora PI Kit could add prompt compatibility to its existing doctor</text>
<text x="70" y="120" class="b" font-size="20.0" style="font-size:20.0px" font-family="Arial, sans-serif">This diagram separates existing code from this article's proposals. Proposed work is not yet implemented.</text>
