<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#F6F0E6" /><text x="60" y="70" font-size="38" font-family="sans-serif" font-weight="700" fill="#211A16">A session is not a context window</text><text x="60" y="112" font-size="22" font-family="sans-serif" fill="#5D5148">Long tasks continue through persistent state, not endless chat history</text><g font-family="sans-serif"><rect x="60" y="165" width="290" height="260" rx="22" fill="#FFF9EF" stroke="#8A6A4D" stroke-width="3" /><text x="90" y="210" font-size="25" font-weight="700">Context 1</text><text x="90" y="260" font-size="17">Understand requirements</text><text x="90" y="300" font-size="20">Read code and docs</text><text x="90" y="340" font-size="18.5">Implement the first step</text><rect x="455" y="165" width="290" height="260" rx="22" fill="#FFF9EF" stroke="#8A6A4D" stroke-width="3" /><text x="485" y="210" font-size="25" font-weight="700">Context 2</text><text x="485" y="260" font-size="20">Read handoff state</text><text x="485" y="300" font-size="18.5">Continue implementation</text><text x="485" y="340" font-size="20">Run tests</text><rect x="850" y="165" width="290" height="260" rx="22" fill="#FFF9EF" stroke="#8A6A4D" stroke-width="3" /><text x="880" y="210" font-size="25" font-weight="700">Context 3</text><text x="880" y="260" font-size="20">Read handoff state</text><text x="880" y="300" font-size="19">Validate the whole task</text><text x="880" y="340" font-size="20">Prepare delivery</text><path d="M350 295 H455" stroke="#B77932" stroke-width="8" /><polygon points="455,295 430,280 430,310" fill="#B77932" /><path d="M745 295 H850" stroke="#B77932" stroke-width="8" /><polygon points="850,295 825,280 825,310" fill="#B77932" /><rect x="130" y="475" width="940" height="115" rx="20" fill="#E7D4B8" /><text x="165" y="515" font-size="24" font-weight="700">Persistent state</text><text x="165" y="555" font-size="20">Files · Git history · Progress · Key decisions · Test results · Intermediate artifacts</text><text x="165" y="580" font-size="17" fill="#5D5148">A window can end while task state persists.</text></g></svg>