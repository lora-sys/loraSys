<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="#F6F0E6" /><g font-family="sans-serif" fill="#211A16"><text x="60" y="70" font-size="38" font-weight="700">A minimal structure for an agent harness</text><text x="60" y="112" font-size="22" fill="#5D5148">Engineering advice, not a fixed directory required by OpenAI or Anthropic</text><rect x="70" y="180" width="240" height="280" rx="22" fill="#FFF9EF" stroke="#7D654E" stroke-width="3" /><text x="105" y="225" font-size="24" font-weight="700">Task entry</text><text x="105" y="275" font-size="19">goal.md</text><text x="105" y="315" font-size="18.5">Acceptance criteria</text><text x="105" y="355" font-size="19"><tspan x="105" dy="0">Constraints and</tspan><tspan x="105" dy="22.4">permissions</tspan></text><rect x="480" y="180" width="240" height="280" rx="22" fill="#EADCC7" stroke="#7D654E" stroke-width="3" /><text x="515" y="225" font-size="19" font-weight="700">Persistent state</text><text x="515" y="275" font-size="19">progress.md</text><text x="515" y="315" font-size="19">decisions.md</text><text x="515" y="355" font-size="19">artifacts/</text><text x="515" y="395" font-size="19">Git history</text><rect x="890" y="180" width="240" height="280" rx="22" fill="#D9C3A4" stroke="#7D654E" stroke-width="3" /><text x="925" y="225" font-size="18.5" font-weight="700">Each agent round</text><text x="925" y="275" font-size="18.5">Read minimal state</text><text x="925" y="315" font-size="16.5">Complete a small goal</text><text x="925" y="355" font-size="19">Run validation</text><text x="925" y="395" font-size="16.5">Update handoff state</text><path d="M310 320 H470" stroke="#B77932" stroke-width="8" /><polygon points="470,320 445,305 445,335" fill="#B77932" /><path d="M720 320 H880" stroke="#B77932" stroke-width="8" /><polygon points="880,320 855,305 855,335" fill="#B77932" /><path d="M1010 475 C1010 570 600 590 600 475" fill="none" stroke="#8A6A4D" stroke-width="5" /><text x="690" y="575" font-size="17"><tspan x="690" dy="0">After validation, write actual results back to state,</tspan><tspan x="690" dy="20.1">then start the next round</tspan></text></g></svg>