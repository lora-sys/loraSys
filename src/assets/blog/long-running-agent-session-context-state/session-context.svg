<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#F6F0E6"/><text x="60" y="70" font-size="38" font-family="sans-serif" font-weight="700" fill="#211A16">Session 不等于 Context Window</text><text x="60" y="112" font-size="22" font-family="sans-serif" fill="#5D5148">长任务靠持久状态接力，不靠无限聊天记录</text><g font-family="sans-serif"><rect x="60" y="165" width="290" height="260" rx="22" fill="#FFF9EF" stroke="#8A6A4D" stroke-width="3"/><text x="90" y="210" font-size="25" font-weight="700">Context 1</text><text x="90" y="260" font-size="20">理解需求</text><text x="90" y="300" font-size="20">读代码与文档</text><text x="90" y="340" font-size="20">做第一步实现</text><rect x="455" y="165" width="290" height="260" rx="22" fill="#FFF9EF" stroke="#8A6A4D" stroke-width="3"/><text x="485" y="210" font-size="25" font-weight="700">Context 2</text><text x="485" y="260" font-size="20">读取交接状态</text><text x="485" y="300" font-size="20">继续实现</text><text x="485" y="340" font-size="20">运行测试</text><rect x="850" y="165" width="290" height="260" rx="22" fill="#FFF9EF" stroke="#8A6A4D" stroke-width="3"/><text x="880" y="210" font-size="25" font-weight="700">Context 3</text><text x="880" y="260" font-size="20">读取交接状态</text><text x="880" y="300" font-size="20">验证整体</text><text x="880" y="340" font-size="20">准备交付</text><path d="M350 295 H455" stroke="#B77932" stroke-width="8"/><polygon points="455,295 430,280 430,310" fill="#B77932"/><path d="M745 295 H850" stroke="#B77932" stroke-width="8"/><polygon points="850,295 825,280 825,310" fill="#B77932"/><rect x="130" y="475" width="940" height="115" rx="20" fill="#E7D4B8"/><text x="165" y="515" font-size="24" font-weight="700">持久状态</text><text x="165" y="555" font-size="20">文件　Git 历史　进度记录　关键决策　测试结果　中间产物</text><text x="165" y="580" font-size="17" fill="#5D5148">窗口可以结束，任务状态仍然存在。</text></g></svg>