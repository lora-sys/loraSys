<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="#F6F0E6" /><g font-family="sans-serif" fill="#211A16"><text x="60" y="70" font-size="38" font-weight="700">Separate three kinds of state for long tasks</text><text x="60" y="112" font-size="22" fill="#5D5148">Do not put everything back into the model context</text><rect x="60" y="170" width="330" height="330" rx="24" fill="#FFF9EF" stroke="#7D654E" stroke-width="3" /><text x="95" y="220" font-size="27" font-weight="700">Working context</text><text x="95" y="270" font-size="20"><tspan x="95" dy="0">What the model needs</tspan><tspan x="95" dy="23.6">to see right now</tspan></text><text x="95" y="320" font-size="19">Current goal</text><text x="95" y="355" font-size="19">Recent tool results</text><text x="95" y="390" font-size="19">Relevant code snippets</text><text x="95" y="445" font-size="17" fill="#8A5B2E">Short-term, limited, selected</text><rect x="435" y="170" width="330" height="330" rx="24" fill="#EADCC7" stroke="#7D654E" stroke-width="3" /><text x="470" y="220" font-size="27" font-weight="700">Task state</text><text x="470" y="270" font-size="18.5"><tspan x="470" dy="0">Information needed to keep</tspan><tspan x="470" dy="21.8">working across windows</tspan></text><text x="470" y="320" font-size="19">What is done</text><text x="470" y="355" font-size="19">What comes next</text><text x="470" y="390" font-size="19">Unresolved issues</text><text x="470" y="445" font-size="16.5" fill="#8A5B2E">Persist it so it can be read again</text><rect x="810" y="170" width="330" height="330" rx="24" fill="#D9C3A4" stroke="#7D654E" stroke-width="3" /><text x="845" y="220" font-size="24.5" font-weight="700">Environment state</text><text x="845" y="270" font-size="20"><tspan x="845" dy="0">Actual results left by</tspan><tspan x="845" dy="23.6">code and tools</tspan></text><text x="845" y="320" font-size="19">Git commit</text><text x="845" y="355" font-size="19">Files and databases</text><text x="845" y="390" font-size="19">Tests and build artifacts</text><text x="845" y="445" font-size="17" fill="#8A5B2E">The final source of truth</text><text x="150" y="565" font-size="22">What the model sees</text><text x="520" y="565" font-size="22">Task progress</text><text x="900" y="565" font-size="22"><tspan x="900" dy="0">What actually changed</tspan><tspan x="900" dy="26.0">in the system</tspan></text></g></svg>