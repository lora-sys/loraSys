<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="#F6F0E6" /><g font-family="sans-serif" fill="#211A16"><text x="60" y="70" font-size="38" font-weight="700">A handoff file is not a chat summary</text><text x="60" y="112" font-size="22" fill="#5D5148">It answers what the next agent actually needs to know before starting work</text><rect x="70" y="170" width="460" height="370" rx="24" fill="#FFF9EF" stroke="#7D654E" stroke-width="3" /><text x="105" y="220" font-size="26" font-weight="700">Poor handoff</text><text x="105" y="275" font-size="20">"We discussed many approaches..."</text><text x="105" y="315" font-size="20">"The code is mostly done..."</text><text x="105" y="355" font-size="20">"Keep optimizing later..."</text><text x="105" y="425" font-size="18" fill="#9B3D2D">The problem</text><text x="105" y="460" font-size="18">No file paths, no test evidence,</text><text x="105" y="492" font-size="18">and no clear next step.</text><rect x="670" y="170" width="460" height="370" rx="24" fill="#E7D4B8" stroke="#7D654E" stroke-width="3" /><text x="705" y="220" font-size="26" font-weight="700">Actionable handoff</text><text x="705" y="270" font-size="19">Goal: finish caching the search endpoint</text><text x="705" y="310" font-size="19">Done: cache layer and unit tests</text><text x="705" y="350" font-size="19">Evidence: tests/search_cache passes</text><text x="705" y="390" font-size="19">Unfinished: invalidation strategy</text><text x="705" y="430" font-size="18.5">Key decision: use a 5-minute TTL for now</text><text x="705" y="470" font-size="18.5">Next: add invalidation tests,</text><text x="705" y="500" font-size="18.5">then change code</text><path d="M550 350 H650" stroke="#B77932" stroke-width="8" /><polygon points="650,350 625,335 625,365" fill="#B77932" /></g></svg>