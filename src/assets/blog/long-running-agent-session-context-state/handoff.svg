<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="#F6F0E6"/><g font-family="sans-serif" fill="#211A16"><text x="60" y="70" font-size="38" font-weight="700">交接文件不是聊天摘要</text><text x="60" y="112" font-size="22" fill="#5D5148">它只回答下一个 Agent 开工前真正需要知道的事</text><rect x="70" y="170" width="460" height="370" rx="24" fill="#FFF9EF" stroke="#7D654E" stroke-width="3"/><text x="105" y="220" font-size="26" font-weight="700">低质量交接</text><text x="105" y="275" font-size="20">“我们讨论了很多方案……”</text><text x="105" y="315" font-size="20">“代码基本完成……”</text><text x="105" y="355" font-size="20">“后面继续优化……”</text><text x="105" y="425" font-size="18" fill="#9B3D2D">问题</text><text x="105" y="460" font-size="18">没有文件路径，没有测试证据，</text><text x="105" y="492" font-size="18">没有明确下一步。</text><rect x="670" y="170" width="460" height="370" rx="24" fill="#E7D4B8" stroke="#7D654E" stroke-width="3"/><text x="705" y="220" font-size="26" font-weight="700">可执行交接</text><text x="705" y="270" font-size="19">目标：完成搜索接口缓存</text><text x="705" y="310" font-size="19">已完成：缓存层与单元测试</text><text x="705" y="350" font-size="19">证据：tests/search_cache 通过</text><text x="705" y="390" font-size="19">未完成：失效策略</text><text x="705" y="430" font-size="19">关键决定：TTL 先用 5 分钟</text><text x="705" y="470" font-size="19">下一步：补失效测试再改实现</text><path d="M550 350 H650" stroke="#B77932" stroke-width="8"/><polygon points="650,350 625,335 625,365" fill="#B77932"/></g></svg>