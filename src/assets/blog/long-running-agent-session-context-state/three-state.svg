<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="#F6F0E6"/><g font-family="sans-serif" fill="#211A16"><text x="60" y="70" font-size="38" font-weight="700">长任务要分清三种状态</text><text x="60" y="112" font-size="22" fill="#5D5148">不要把所有东西都塞回模型上下文</text><rect x="60" y="170" width="330" height="330" rx="24" fill="#FFF9EF" stroke="#7D654E" stroke-width="3"/><text x="95" y="220" font-size="27" font-weight="700">工作上下文</text><text x="95" y="270" font-size="20">模型这一刻需要看到的内容</text><text x="95" y="320" font-size="19">当前目标</text><text x="95" y="355" font-size="19">最近工具结果</text><text x="95" y="390" font-size="19">相关代码片段</text><text x="95" y="445" font-size="17" fill="#8A5B2E">短期、有限、需要筛选</text><rect x="435" y="170" width="330" height="330" rx="24" fill="#EADCC7" stroke="#7D654E" stroke-width="3"/><text x="470" y="220" font-size="27" font-weight="700">任务状态</text><text x="470" y="270" font-size="20">跨窗口继续工作所需的信息</text><text x="470" y="320" font-size="19">完成了什么</text><text x="470" y="355" font-size="19">下一步是什么</text><text x="470" y="390" font-size="19">未解决问题</text><text x="470" y="445" font-size="17" fill="#8A5B2E">应持久化，可重新读取</text><rect x="810" y="170" width="330" height="330" rx="24" fill="#D9C3A4" stroke="#7D654E" stroke-width="3"/><text x="845" y="220" font-size="27" font-weight="700">环境状态</text><text x="845" y="270" font-size="20">代码和工具留下的真实结果</text><text x="845" y="320" font-size="19">Git commit</text><text x="845" y="355" font-size="19">文件与数据库</text><text x="845" y="390" font-size="19">测试与构建产物</text><text x="845" y="445" font-size="17" fill="#8A5B2E">最终事实来源</text><text x="150" y="565" font-size="22">模型看到什么</text><text x="520" y="565" font-size="22">任务走到哪里</text><text x="900" y="565" font-size="22">系统实际变成什么</text></g></svg>