<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="#F6F0E6"/><g font-family="sans-serif" fill="#211A16"><text x="60" y="70" font-size="38" font-weight="700">迁移到 Agent Harness 的最小结构</text><text x="60" y="112" font-size="22" fill="#5D5148">这是工程建议，不是 OpenAI 或 Anthropic 的固定目录</text><rect x="70" y="180" width="240" height="280" rx="22" fill="#FFF9EF" stroke="#7D654E" stroke-width="3"/><text x="105" y="225" font-size="24" font-weight="700">任务入口</text><text x="105" y="275" font-size="19">goal.md</text><text x="105" y="315" font-size="19">验收条件</text><text x="105" y="355" font-size="19">约束与权限</text><rect x="480" y="180" width="240" height="280" rx="22" fill="#EADCC7" stroke="#7D654E" stroke-width="3"/><text x="515" y="225" font-size="24" font-weight="700">持久状态</text><text x="515" y="275" font-size="19">progress.md</text><text x="515" y="315" font-size="19">decisions.md</text><text x="515" y="355" font-size="19">artifacts/</text><text x="515" y="395" font-size="19">Git 历史</text><rect x="890" y="180" width="240" height="280" rx="22" fill="#D9C3A4" stroke="#7D654E" stroke-width="3"/><text x="925" y="225" font-size="24" font-weight="700">每轮 Agent</text><text x="925" y="275" font-size="19">读取最小状态</text><text x="925" y="315" font-size="19">完成一个小目标</text><text x="925" y="355" font-size="19">运行验证</text><text x="925" y="395" font-size="19">更新交接状态</text><path d="M310 320 H470" stroke="#B77932" stroke-width="8"/><polygon points="470,320 445,305 445,335" fill="#B77932"/><path d="M720 320 H880" stroke="#B77932" stroke-width="8"/><polygon points="880,320 855,305 855,335" fill="#B77932"/><path d="M1010 475 C1010 570 600 590 600 475" fill="none" stroke="#8A6A4D" stroke-width="5"/><text x="690" y="575" font-size="18">验证后把真实结果写回状态，再进入下一轮</text></g></svg>