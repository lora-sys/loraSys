<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#F7F1E7"/>
<text x="720" y="72" text-anchor="middle" font-size="44" font-family="sans-serif" font-weight="700" fill="#2B241F">SAIGE 的核心：需要时再拆，需要时再取信息</text>
<text x="720" y="112" text-anchor="middle" font-size="23" font-family="sans-serif" fill="#806B59">根据论文 Figure 2 重绘</text>
<rect x="60" y="165" rx="26" width="620" height="590" fill="#FFF9EF" stroke="#806B59" stroke-width="2"/>
<rect x="760" y="165" rx="26" width="620" height="590" fill="#FFF9EF" stroke="#806B59" stroke-width="2"/>
<text x="370" y="220" text-anchor="middle" font-size="30" font-family="sans-serif" font-weight="700" fill="#2B241F">1. 增量生成子 Agent</text>
<text x="1070" y="220" text-anchor="middle" font-size="30" font-family="sans-serif" font-weight="700" fill="#2B241F">2. 按需获取跨 Agent 信息</text>
<circle cx="370" cy="330" r="70" fill="#F1C77C"/><text x="370" y="340" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#2B241F">父 Agent</text>
<rect x="140" y="455" rx="20" width="210" height="80" fill="#E9DDCE"/><text x="245" y="505" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#2B241F">边界不成立</text>
<rect x="390" y="455" rx="20" width="210" height="80" fill="#8DAA91" opacity=".45"/><text x="495" y="505" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#2B241F">边界成立</text>
<line x1="335" y1="395" x2="245" y2="455" stroke="#806B59" stroke-width="5"/>
<line x1="405" y1="395" x2="495" y2="455" stroke="#806B59" stroke-width="5"/>
<text x="245" y="585" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#2B241F">继续当前任务</text>
<text x="495" y="585" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#2B241F">创建子 Agent</text>
<rect x="405" y="620" rx="18" width="180" height="70" fill="#F1C77C"/><text x="495" y="664" text-anchor="middle" font-size="21" font-family="sans-serif" fill="#2B241F">独立执行子任务</text>
<text x="370" y="715" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#806B59">不提前固定整棵协作树</text>
<rect x="830" y="285" rx="18" width="190" height="74" fill="#8DAA91" opacity=".48"/><text x="925" y="330" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#2B241F">Agent A 结果</text>
<rect x="1120" y="285" rx="18" width="190" height="74" fill="#8DAA91" opacity=".48"/><text x="1215" y="330" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#2B241F">Agent B 工作中</text>
<line x1="1020" y1="322" x2="1120" y2="322" stroke="#B8AEA2" stroke-width="4" stroke-dasharray="10 10"/>
<text x="1070" y="300" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#806B59">不主动推送全部内容</text>
<rect x="965" y="455" rx="20" width="210" height="80" fill="#F1C77C"/><text x="1070" y="505" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#2B241F">出现真实依赖</text>
<line x1="1215" y1="359" x2="1125" y2="455" stroke="#806B59" stroke-width="5"/>
<line x1="1070" y1="535" x2="1070" y2="585" stroke="#806B59" stroke-width="5"/>
<rect x="940" y="585" rx="20" width="260" height="80" fill="#E9DDCE"/><text x="1070" y="635" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#2B241F">只拉取所需结果</text>
<text x="1070" y="715" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#806B59">减少无关跨 Agent 上下文</text>
<text x="720" y="835" text-anchor="middle" font-size="25" font-family="sans-serif" font-weight="700" fill="#2B241F">拆分和通信都由执行反馈触发，而不是开局一次性决定</text>
</svg>