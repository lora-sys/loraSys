<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Link CLI payment authorization flow</title><desc id="d">The agent submits a purchase request. After the user approves, Link returns a one-time payment credential.</desc><rect width="1200" height="680" fill="#f7f1e7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#242424}.h{font-size:36px;font-weight:700}.s{font-size:24px}.n{font-size:19px}.box{fill:#fffaf2;stroke:#242424;stroke-width:3}.ok{fill:#1f7a72;stroke:#1f7a72;stroke-width:3}.line{stroke:#242424;stroke-width:4;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#242424"/></marker></defs><text x="60" y="75" class="h">Approve first, then enable one payment</text><text x="60" y="116" class="n">The agent does not need the user's saved, real card number</text><rect class="box" x="70" y="240" width="230" height="130" rx="24"/><text x="185" y="292" text-anchor="middle" class="s">Agent</text><text x="185" y="324" text-anchor="middle" class="n"><tspan x="185">Create a purchase</tspan><tspan x="185" dy="24">request</tspan></text><rect class="box" x="360" y="240" width="250" height="130" rx="24"/><text x="485" y="292" text-anchor="middle" class="s">Purchase request</text><text x="485" y="324" text-anchor="middle" class="n"><tspan x="485">Merchant, amount,</tspan><tspan x="485" dy="24">context</tspan></text><rect class="box" x="670" y="240" width="220" height="130" rx="24"/><text x="780" y="292" text-anchor="middle" class="s">User approval</text><text x="780" y="324" text-anchor="middle" class="n"><tspan x="780">Decide whether</tspan><tspan x="780" dy="24">to allow it</tspan></text><rect class="ok" x="950" y="240" width="190" height="130" rx="24"/><text x="1045" y="279" text-anchor="middle" class="s" style="fill:#fff"><tspan x="1045">One-time</tspan><tspan x="1045" dy="29">credential</tspan></text><text x="1045" y="343" text-anchor="middle" class="n" style="fill:#fff">For this payment</text><path class="line" d="M300 305H355"/><path class="line" d="M610 305H665"/><path class="line" d="M890 305H945"/><text x="70" y="470" class="s">The checkout scenario determines the credential type</text><text x="70" y="515" class="n">Virtual card: ordinary web checkout</text><text x="70" y="550" class="n">Link Pay Token: Stripe-hosted payment forms</text><text x="70" y="585" class="n">Shared Payment Token: merchants supporting machine payment protocols</text><text x="60" y="646" class="n">Based on Stripe's public flow: request, approval, one-time payment credential</text></svg>
