<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Link CLI 支付授权流程</title><desc id="d">Agent 先提交购买请求，用户确认后，Link 返回一次性支付凭证。站点重建版，非原附件。</desc><rect width="1200" height="680" fill="#f7f1e7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#242424}.h{font-size:36px;font-weight:700}.s{font-size:24px}.n{font-size:19px}.box{fill:#fffaf2;stroke:#242424;stroke-width:3}.ok{fill:#1f7a72;stroke:#1f7a72;stroke-width:3}.line{stroke:#242424;stroke-width:4;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#242424"/></marker></defs><text x="60" y="75" class="h">先确认，再给一次支付能力</text><text x="60" y="116" class="n">Agent 不需要拿到用户保存的真实卡号</text><rect class="box" x="70" y="240" width="230" height="130" rx="24"/><text x="125" y="296" class="s">Agent</text><text x="104" y="333" class="n">创建购买请求</text><rect class="box" x="360" y="240" width="250" height="130" rx="24"/><text x="414" y="296" class="s">购买请求</text><text x="402" y="333" class="n">商家 金额 上下文</text><rect class="box" x="670" y="240" width="220" height="130" rx="24"/><text x="724" y="296" class="s">用户确认</text><text x="706" y="333" class="n">决定是否放行</text><rect class="ok" x="950" y="240" width="190" height="130" rx="24"/><text x="988" y="296" class="s" fill="#fff">一次凭证</text><text x="980" y="333" class="n" fill="#fff">用于本次付款</text><path class="line" d="M300 305H355"/><path class="line" d="M610 305H665"/><path class="line" d="M890 305H945"/><text x="70" y="470" class="s">凭证类型由结账场景决定</text><text x="70" y="515" class="n">虚拟卡：普通网页 checkout</text><text x="70" y="550" class="n">Link Pay Token：Stripe 托管支付表单</text><text x="70" y="585" class="n">Shared Payment Token：支持机器支付协议的商家</text><text x="60" y="646" class="n">站点重建版，非原附件。依据 Notion 原文主视觉说明重建。</text></svg>