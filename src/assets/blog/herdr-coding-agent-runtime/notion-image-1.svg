<g font-family="Noto Sans CJK SC, Arial, sans-serif">
<text x="66" y="112" fill="#E0A23E" font-size="28">CODING AGENT RUNTIME</text>
<text x="62" y="245" fill="#FCF8EE" font-size="82" font-weight="700">Herdr 不替换 Agent</text>
<text x="62" y="355" fill="#E0A23E" font-size="82" font-weight="700">它接管终端</text>
<text x="66" y="432" fill="#E8DED0" font-size="31">Claude Code、Codex、Cursor、OpenCode 继续照常运行。</text>
<text x="66" y="480" fill="#E8DED0" font-size="31">Herdr 管终端、会话状态和跨机器连接。</text>
<rect x="66" y="540" width="235" height="140" rx="24" fill="#2B2521" stroke="#655345" stroke-width="2"/>
<text x="86" y="595" fill="#FCF8EE" font-size="31" font-weight="700">持续终端</text>
<text x="86" y="645" fill="#D9CCBC" font-size="21">断开客户端，任务继续</text>
<rect x="336" y="540" width="235" height="140" rx="24" fill="#2B2521" stroke="#655345" stroke-width="2"/>
<text x="356" y="595" fill="#FCF8EE" font-size="31" font-weight="700">阻塞状态</text>
<text x="356" y="645" fill="#D9CCBC" font-size="21">working / blocked / idle</text>
<rect x="606" y="540" width="235" height="140" rx="24" fill="#593C2B" stroke="#8A654B" stroke-width="2"/>
<text x="626" y="595" fill="#E0A23E" font-size="31" font-weight="700">跨机器</text>
<text x="626" y="645" fill="#E2D0BF" font-size="21">本地与 SSH 同一窗口</text>
<text x="66" y="805" fill="#B8AA98" font-size="20">herdrdev/herdr · Apache 2.0</text>
<text x="66" y="845" fill="#827466" font-size="20">终端持久化 · 状态检测 · 跨机器 · CLI / socket API</text>
