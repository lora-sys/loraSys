<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect width="1536" height="1024" fill="#F5EEDF"/>
<text x="768" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#2B211B">Separate Lora PI Kit tool and network permissions</text>
<text x="768" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5A4638">Tool policy decides what can run. Network policy decides where it can connect.</text>
<rect x="70" y="190" width="650" height="700" rx="28" fill="#FFF9F0" stroke="#8C6A51" stroke-width="4"/>
<text x="395" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#5A4638">Existing tool boundary</text>
<rect x="120" y="315" width="550" height="145" rx="20" fill="#EFE3D3"/>
<text x="160" y="360" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2B211B">tool-policy.ts</text>
<text x="160" y="405" font-family="Arial, sans-serif" font-size="25" fill="#2B211B">Filter toolName by active profile</text>
<rect x="120" y="490" width="550" height="145" rx="20" fill="#EFE3D3"/>
<text x="160" y="535" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2B211B">policy-bridge.ts</text>
<text x="160" y="580" font-family="Arial, sans-serif" font-size="25" fill="#2B211B">Check tool and input at tool_call</text>
<rect x="120" y="665" width="550" height="145" rx="20" fill="#EFE3D3"/>
<text x="160" y="710" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2B211B">tool-adapter.ts</text>
<text x="160" y="755" font-family="Arial, sans-serif" font-size="25" fill="#2B211B" style=";font-size:23.3px">MCP calls support host authorize callbacks</text>
<text x="395" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#6B5140" style=";font-size:24.6px">These checks sit between the agent and tool</text>
<rect x="816" y="190" width="650" height="700" rx="28" fill="#FFF9F0" stroke="#B67A2A" stroke-width="4"/>
<text x="1141" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#7A4E17">Proposed network boundary</text>
<rect x="870" y="315" width="540" height="110" rx="20" fill="#F2E1C0"/>
<text x="1140" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2B211B" style=";font-size:26.6px">1. Check the actual target domain</text>
<text x="1140" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#5A4638">Apply the allowlist to the real destination</text>
<rect x="870" y="455" width="540" height="110" rx="20" fill="#F2E1C0"/>
<text x="1140" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2B211B">2. Recheck after redirects</text>
<text x="1140" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#5A4638">Authorize every hop</text>
<rect x="870" y="595" width="540" height="110" rx="20" fill="#F2E1C0"/>
<text x="1140" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2B211B" style=";font-size:21.0px">3. Give long connections revocable permits</text>
<text x="1140" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#5A4638" style=";font-size:21.7px">Keep HTTP streams and WebSockets controlled</text>
<rect x="870" y="735" width="540" height="110" rx="20" fill="#F7D9D1"/>
<text x="1140" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#A9503E" style=";font-size:26.4px">4. Revoke old permits after reload</text>
<text x="1140" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#5A4638" style=";font-size:22.1px">Stop active requests denied by the new policy</text>
<path d="M720 535 H816" stroke="#6B5140" stroke-width="10" marker-end="url(#a)"/>
<rect x="395" y="920" width="746" height="72" rx="24" fill="#4A3427"/>
<text x="768" y="967" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FFF8EE" style=";font-size:19.4px">Calling a tool does not grant access to every network destination</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5140"/></marker></defs>
</svg>