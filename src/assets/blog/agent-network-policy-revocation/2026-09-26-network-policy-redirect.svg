<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect width="1536" height="1024" fill="#F5EEDF"/>
<text x="768" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#2B211B">网络权限不能只在请求开始时检查一次</text>
<text x="768" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5A4638">真实目的地可能因重定向变化，长连接也可能在策略更新后继续运行</text>
<rect x="70" y="185" width="650" height="710" rx="28" fill="#FFF9F0" stroke="#A95F48" stroke-width="4"/>
<text x="395" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#8C3F31">只在开始时检查</text>
<rect x="130" y="310" width="230" height="90" rx="18" fill="#EFE3D3"/>
<text x="245" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B211B">允许 a.com</text>
<path d="M360 355 H500" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="500" y="310" width="160" height="90" rx="18" fill="#EFE3D3"/>
<text x="580" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B211B">请求</text>
<path d="M580 400 V500" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="430" y="520" width="300" height="110" rx="18" fill="#F7D9D1"/>
<text x="580" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#2B211B">HTTP 302</text>
<text x="580" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#A13F33">Location: b.com</text>
<path d="M430 575 H260" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="105" y="520" width="170" height="110" rx="18" fill="#F7D9D1"/>
<text x="190" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#2B211B">未复核</text>
<text x="190" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#A13F33">继续访问</text>
<text x="395" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#A13F33">风险：新目标可能不在允许列表</text>
<rect x="816" y="185" width="650" height="710" rx="28" fill="#FFF9F0" stroke="#B67A2A" stroke-width="4"/>
<text x="1141" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#7A4E17">每个实际目标都检查</text>
<rect x="880" y="310" width="230" height="90" rx="18" fill="#EFE3D3"/>
<text x="995" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B211B">允许 a.com</text>
<path d="M1110 355 H1250" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="1250" y="310" width="150" height="90" rx="18" fill="#EFE3D3"/>
<text x="1325" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B211B">请求</text>
<path d="M1325 400 V500" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="1170" y="520" width="300" height="110" rx="18" fill="#F2E1C0"/>
<text x="1320" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#2B211B">HTTP 302</text>
<text x="1320" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#8A5A16">Location: b.com</text>
<path d="M1170 575 H1000" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="845" y="520" width="170" height="110" rx="18" fill="#E4EAD9"/>
<text x="930" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#2B211B">重新检查</text>
<text x="930" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#4F6A3A">允许才继续</text>
<text x="1141" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#6C5127">重定向后的新目标也是新的授权对象</text>
<rect x="390" y="925" width="760" height="70" rx="22" fill="#4A3427"/>
<text x="770" y="971" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FFF8EE">授权要跟着真实目的地走</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A5A45"/></marker></defs>
</svg>