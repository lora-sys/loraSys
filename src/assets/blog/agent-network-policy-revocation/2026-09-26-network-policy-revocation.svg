<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect width="1536" height="1024" fill="#F5EEDF"/>
<text x="768" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#2B211B">长连接已经建立后，策略变了怎么办</text>
<text x="768" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5A4638">OpenAI Codex 0.157.0 把网络许可做成可撤销状态，读写期间仍受策略控制</text>
<line x1="160" y1="250" x2="1370" y2="250" stroke="#6B5140" stroke-width="8"/>
<circle cx="240" cy="250" r="32" fill="#B67A2A"/>
<circle cx="760" cy="250" r="32" fill="#B67A2A"/>
<circle cx="1280" cy="250" r="32" fill="#A9503E"/>
<text x="240" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2B211B">t0 建立连接</text>
<text x="760" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2B211B">t1 策略更新</text>
<text x="1280" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2B211B">t2 连接被撤销</text>
<rect x="110" y="380" width="420" height="420" rx="28" fill="#FFF9F0" stroke="#B67A2A" stroke-width="4"/>
<text x="320" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#7A4E17">连接开始时</text>
<text x="320" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#2B211B">目标 api.example.com</text>
<text x="320" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#2B211B">当前策略允许访问</text>
<rect x="155" y="610" width="330" height="90" rx="18" fill="#E4EAD9"/>
<text x="320" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#4F6A3A">持有 network permit</text>
<rect x="555" y="380" width="420" height="420" rx="28" fill="#FFF9F0" stroke="#8C6A51" stroke-width="4"/>
<text x="765" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#5A4638">连接正在运行</text>
<text x="765" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#2B211B">HTTP 流持续读取</text>
<text x="765" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#2B211B">WebSocket 持续读写</text>
<rect x="590" y="610" width="350" height="90" rx="18" fill="#EFE3D3"/>
<text x="765" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#5A4638">permit 跟随整个生命周期</text>
<rect x="1000" y="380" width="420" height="420" rx="28" fill="#FFF9F0" stroke="#A9503E" stroke-width="4"/>
<text x="1210" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#8C3F31">策略撤销访问</text>
<text x="1210" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#2B211B">更新后的规则不再允许该目标</text>
<rect x="1085" y="575" width="250" height="75" rx="16" fill="#F7D9D1"/>
<text x="1210" y="623" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#A9503E">取消 reader</text>
<rect x="1085" y="670" width="250" height="75" rx="16" fill="#F7D9D1"/>
<text x="1210" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#A9503E">取消 writer</text>
<path d="M530 590 H555" stroke="#6B5140" stroke-width="8" marker-end="url(#a)"/>
<path d="M975 590 H1000" stroke="#6B5140" stroke-width="8" marker-end="url(#a)"/>
<rect x="365" y="890" width="806" height="78" rx="24" fill="#4A3427"/>
<text x="768" y="941" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#FFF8EE">策略在变，连接也要跟着变</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5140"/></marker></defs>
</svg>