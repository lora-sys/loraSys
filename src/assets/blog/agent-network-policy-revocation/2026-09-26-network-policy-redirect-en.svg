<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect width="1536" height="1024" fill="#F5EEDF"/>
<text x="768" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#2B211B">Network permission needs more than an initial check</text>
<text x="768" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5A4638">Redirects change destinations. Long connections can outlive policy updates.</text>
<rect x="70" y="185" width="650" height="710" rx="28" fill="#FFF9F0" stroke="#A95F48" stroke-width="4"/>
<text x="395" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#8C3F31">Check only at the start</text>
<rect x="130" y="310" width="230" height="90" rx="18" fill="#EFE3D3"/>
<text x="245" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B211B">Allow a.com</text>
<path d="M360 355 H500" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="500" y="310" width="160" height="90" rx="18" fill="#EFE3D3"/>
<text x="580" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B211B">Request</text>
<path d="M580 400 V500" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="450" y="520" width="260" height="110" rx="18" fill="#F7D9D1"/>
<text x="580" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#2B211B">HTTP 302</text>
<text x="580" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#A13F33">Location: b.com</text>
<path d="M450 575 H260" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="105" y="520" width="170" height="110" rx="18" fill="#F7D9D1"/>
<text x="190" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#2B211B" style=";font-size:25.3px">No recheck</text>
<text x="190" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#A13F33" style=";font-size:17.4px">Continue access</text>
<text x="395" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#A13F33" style=";font-size:27.2px">Risk: the new target may not be allowed</text>
<rect x="816" y="185" width="650" height="710" rx="28" fill="#FFF9F0" stroke="#B67A2A" stroke-width="4"/>
<text x="1141" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#7A4E17">Check every actual destination</text>
<rect x="880" y="310" width="230" height="90" rx="18" fill="#EFE3D3"/>
<text x="995" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B211B">Allow a.com</text>
<path d="M1110 355 H1250" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="1250" y="310" width="150" height="90" rx="18" fill="#EFE3D3"/>
<text x="1325" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B211B">Request</text>
<path d="M1325 400 V500" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="1190" y="520" width="260" height="110" rx="18" fill="#F2E1C0"/>
<text x="1320" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#2B211B">HTTP 302</text>
<text x="1320" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#8A5A16">Location: b.com</text>
<path d="M1190 575 H1000" stroke="#7A5A45" stroke-width="8" marker-end="url(#a)"/>
<rect x="845" y="520" width="170" height="110" rx="18" fill="#E4EAD9"/>
<text x="930" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#2B211B">Recheck</text>
<text x="930" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#4F6A3A" style=";font-size:17px"><tspan x="930.0" y="595.0">Continue only if</tspan><tspan x="930.0" y="615.0">allowed</tspan></text>
<text x="1141" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#6C5127" style=";font-size:24.3px">A redirect target needs its own authorization</text>
<rect x="390" y="925" width="760" height="70" rx="22" fill="#4A3427"/>
<text x="770" y="971" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FFF8EE" style=";font-size:29.5px">Authorization follows the actual destination</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A5A45"/></marker></defs>
</svg>