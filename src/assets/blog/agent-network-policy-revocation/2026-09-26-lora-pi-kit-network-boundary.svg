<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect width="1536" height="1024" fill="#F5EEDF"/>
<text x="768" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#2B211B">Lora PI Kit 的工具权限和网络权限应该分两层</text>
<text x="768" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5A4638">工具策略决定能调用什么，网络策略决定工具运行时能访问哪里</text>
<rect x="70" y="190" width="650" height="700" rx="28" fill="#FFF9F0" stroke="#8C6A51" stroke-width="4"/>
<text x="395" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#5A4638">现有工具边界</text>
<rect x="120" y="315" width="550" height="145" rx="20" fill="#EFE3D3"/>
<text x="160" y="360" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2B211B">tool-policy.ts</text>
<text x="160" y="405" font-family="Arial, sans-serif" font-size="25" fill="#2B211B">按 active profile 过滤 toolName</text>
<rect x="120" y="490" width="550" height="145" rx="20" fill="#EFE3D3"/>
<text x="160" y="535" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2B211B">policy-bridge.ts</text>
<text x="160" y="580" font-family="Arial, sans-serif" font-size="25" fill="#2B211B">在 tool_call 时检查工具与输入</text>
<rect x="120" y="665" width="550" height="145" rx="20" fill="#EFE3D3"/>
<text x="160" y="710" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2B211B">tool-adapter.ts</text>
<text x="160" y="755" font-family="Arial, sans-serif" font-size="25" fill="#2B211B">MCP 调用支持 host authorize 回调</text>
<text x="395" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#6B5140">这些检查发生在 Agent 与工具之间</text>
<rect x="816" y="190" width="650" height="700" rx="28" fill="#FFF9F0" stroke="#B67A2A" stroke-width="4"/>
<text x="1141" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#7A4E17">建议新增网络边界</text>
<rect x="870" y="315" width="540" height="110" rx="20" fill="#F2E1C0"/>
<text x="1140" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2B211B">1. 检查真实目标域名</text>
<text x="1140" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#5A4638">允许列表以真实目的地为准</text>
<rect x="870" y="455" width="540" height="110" rx="20" fill="#F2E1C0"/>
<text x="1140" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2B211B">2. 重定向后重新检查</text>
<text x="1140" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#5A4638">每个 hop 都重新授权</text>
<rect x="870" y="595" width="540" height="110" rx="20" fill="#F2E1C0"/>
<text x="1140" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2B211B">3. 长连接持有可撤销许可</text>
<text x="1140" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#5A4638">HTTP 流与 WebSocket 持续受控</text>
<rect x="870" y="735" width="540" height="110" rx="20" fill="#F7D9D1"/>
<text x="1140" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#A9503E">4. reload 后撤销旧许可</text>
<text x="1140" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#5A4638">被新策略禁止的活动请求立即停止</text>
<path d="M720 535 H816" stroke="#6B5140" stroke-width="10" marker-end="url(#a)"/>
<rect x="395" y="920" width="746" height="72" rx="24" fill="#4A3427"/>
<text x="768" y="967" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FFF8EE">能调用工具，不等于能访问任意网络目的地</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5140"/></marker></defs>
</svg>