<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">SAIGE 的增量委派机制</title><desc id="d">执行反馈触发子 Agent 创建，并在真实需要时读取结果。站点重建版，非原附件。</desc><rect width="1200" height="680" fill="#f7f1e7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#242424}.h{font-size:34px;font-weight:700}.s{font-size:23px}.n{font-size:19px}.box{fill:#fffaf2;stroke:#242424;stroke-width:3}.teal{fill:#1f7a72;stroke:#1f7a72}.line{stroke:#242424;stroke-width:4;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#242424"/></marker></defs><text x="60" y="70" class="h">SAIGE 不是先开满 Agent</text><text x="60" y="112" class="n">它边执行边找可独立的依赖边界</text><rect class="box" x="70" y="190" width="240" height="100" rx="18"/><text x="122" y="248" class="s">父 Agent 执行</text><rect class="box" x="390" y="190" width="260" height="100" rx="18"/><text x="438" y="235" class="s">出现独立边界</text><text x="430" y="268" class="n">执行反馈触发</text><rect class="teal" x="750" y="190" width="260" height="100" rx="18"/><text x="802" y="248" class="s" fill="#fff">创建子 Agent</text><path class="line" d="M310 240 H385"/><path class="line" d="M650 240 H745"/><rect class="box" x="185" y="410" width="270" height="105" rx="18"/><text x="240" y="455" class="s">子 Agent 完成</text><text x="232" y="489" class="n">结果先保存</text><rect class="box" x="650" y="410" width="300" height="105" rx="18"/><text x="704" y="455" class="s">真正需要依赖时</text><text x="730" y="489" class="n">再拉取结果</text><path class="line" d="M880 290 V405"/><path class="line" d="M455 462 H645"/><text x="60" y="610" class="n">两个节省点：不提前创建无用 Agent；不把所有结果一开始塞进所有上下文。</text><text x="60" y="646" class="n">站点重建版，非原附件。依据原文 Figure 2 说明重建。</text></svg>