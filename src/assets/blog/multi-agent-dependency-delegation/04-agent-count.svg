<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">SAIGE 实际平均 Agent 数</title><desc id="d">四个 benchmark 的平均 Agent 数分别是 1.10、1.22、3.87 和 3.36。站点重建版，非原附件。</desc><rect width="1200" height="680" fill="#f7f1e7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#242424}.h{font-size:32px;font-weight:700}.n{font-size:19px}.lab{font-size:20px}.bar{fill:#1f7a72}.grid{stroke:#d8d0c4;stroke-width:2}</style><text x="60" y="65" class="h">SAIGE 会按任务结构决定实际 Agent 数</text><text x="60" y="102" class="n">最大预算都是 4，但紧密依赖任务很少开子 Agent</text><line class="grid" x1="250" y1="560" x2="1080" y2="560"/><text x="65" y="185" class="lab">Terminal Bench 2.1</text><rect class="bar" x="300" y="155" width="220" height="42"/><text x="535" y="184" class="n">1.10</text><text x="65" y="295" class="lab">NL2Repo</text><rect class="bar" x="300" y="265" width="244" height="42"/><text x="560" y="294" class="n">1.22</text><text x="65" y="405" class="lab">Deep Research Bench II</text><rect class="bar" x="300" y="375" width="774" height="42"/><text x="1085" y="404" class="n">3.87</text><text x="65" y="515" class="lab">AgentIF OneDay</text><rect class="bar" x="300" y="485" width="672" height="42"/><text x="985" y="514" class="n">3.36</text><text x="60" y="625" class="n">站点重建版，非原附件。数据来自论文 Figure 5 的原文记录。</text></svg>