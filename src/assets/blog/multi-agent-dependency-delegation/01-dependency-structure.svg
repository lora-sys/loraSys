<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">任务依赖结构</title><desc id="d">左侧是强依赖的串行任务，右侧是可并行调查后汇总的稀疏依赖任务。站点重建版，非原附件。</desc><rect width="1200" height="680" fill="#f7f1e7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#242424}.h{font-size:34px;font-weight:700}.s{font-size:24px}.n{font-size:20px}.box{fill:#fffaf2;stroke:#242424;stroke-width:3;rx:20}.accent{fill:#1f7a72}.line{stroke:#242424;stroke-width:4;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#242424"/></marker></defs><text x="60" y="70" class="h">什么时候该拆 Agent</text><text x="60" y="108" class="n">看依赖关系，不看角色数量</text><text x="90" y="170" class="s">强依赖任务</text><rect class="box" x="70" y="210" width="210" height="90"/><text x="120" y="265" class="s">读报错</text><rect class="box" x="340" y="210" width="210" height="90"/><text x="390" y="265" class="s">改实现</text><rect class="box" x="610" y="210" width="210" height="90"/><text x="655" y="265" class="s">跑测试</text><path class="line" d="M280 255 H335"/><path class="line" d="M550 255 H605"/><text x="90" y="345" class="n">后一步依赖前一步真实结果。拆开只会增加等待和同步。</text><text x="90" y="430" class="s">稀疏依赖任务</text><rect class="box" x="70" y="470" width="220" height="90"/><text x="120" y="525" class="s">查部署</text><rect class="box" x="350" y="470" width="220" height="90"/><text x="400" y="525" class="s">查日志</text><rect class="box" x="630" y="470" width="220" height="90"/><text x="670" y="525" class="s">查依赖</text><rect x="930" y="470" width="200" height="90" rx="20" fill="#1f7a72"/><text x="985" y="525" class="s" fill="#fff">汇总</text><path class="line" d="M290 515 H925"/><path class="line" d="M570 515 H925"/><path class="line" d="M850 515 H925"/><text x="60" y="640" class="n">站点重建版，非原附件。依据原文图意重建。</text></svg>