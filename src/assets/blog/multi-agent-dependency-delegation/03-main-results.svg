<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Single Agent 与 SAIGE 主实验</title><desc id="d">四个 benchmark 内比较 Single Agent 和 SAIGE，数值来自原文记录。站点重建版，非原附件。</desc><rect width="1200" height="760" fill="#f7f1e7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#242424}.h{font-size:32px;font-weight:700}.n{font-size:18px}.lab{font-size:21px}.a{fill:#6b6b6b}.b{fill:#1f7a72}</style><text x="60" y="65" class="h">同一 benchmark 内比较</text><text x="60" y="100" class="n">不同 benchmark 指标不同，不横向比绝对分数</text><text x="80" y="178" class="lab">Terminal Bench 2.1</text><rect class="a" x="330" y="145" width="460" height="32"/><rect class="b" x="330" y="188" width="453" height="32"/><text x="805" y="171" class="n">Single 76.71</text><text x="798" y="214" class="n">SAIGE 75.50</text><text x="80" y="308" class="lab">NL2Repo</text><rect class="a" x="330" y="275" width="292" height="32"/><rect class="b" x="330" y="318" width="295" height="32"/><text x="638" y="301" class="n">48.74</text><text x="638" y="344" class="n">49.23</text><text x="80" y="438" class="lab">Deep Research Bench II</text><rect class="a" x="330" y="405" width="309" height="32"/><rect class="b" x="330" y="448" width="331" height="32"/><text x="675" y="431" class="n">51.49</text><text x="675" y="474" class="n">55.23</text><text x="80" y="568" class="lab">AgentIF OneDay</text><rect class="a" x="330" y="535" width="321" height="32"/><rect class="b" x="330" y="578" width="431" height="32"/><text x="775" y="561" class="n">53.57</text><text x="775" y="604" class="n">71.80</text><rect class="a" x="80" y="660" width="24" height="24"/><text x="115" y="679" class="n">Single Agent</text><rect class="b" x="260" y="660" width="24" height="24"/><text x="295" y="679" class="n">SAIGE</text><text x="60" y="724" class="n">站点重建版，非原附件。数据来自论文 Table 1，按原文记录重绘。</text></svg>