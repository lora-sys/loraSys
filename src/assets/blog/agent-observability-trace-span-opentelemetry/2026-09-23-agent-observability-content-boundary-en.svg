<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#F7F0E6"/><text x="85" y="100" font-size="50" font-family="sans-serif" font-weight="700" fill="#2B241F">Content capture boundaries in agent observability</text><text x="85" y="150" font-size="26" font-family="sans-serif" fill="#7A573A">Start with structured metadata. Capture prompts, responses, and tool arguments only when needed.</text><rect x="75" y="220" width="650" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="115" y="285" font-size="36" font-family="sans-serif" font-weight="700" fill="#2B241F">Collect metadata by default</text><text x="115" y="335" font-size="22" font-family="sans-serif" fill="#7A573A" style=";font-size:17.2px">Copilot excludes prompts, responses, and tool arguments by default.</text><rect x="120" y="400" width="530" height="70" rx="16" fill="#EFE4D4"/><rect x="120" y="495" width="530" height="70" rx="16" fill="#EFE4D4"/><rect x="120" y="590" width="530" height="70" rx="16" fill="#EFE4D4"/><rect x="120" y="685" width="530" height="70" rx="16" fill="#EFE4D4"/><text x="155" y="445" font-size="23" font-family="sans-serif" fill="#2B241F">Model name and finish reason</text><text x="155" y="540" font-size="23" font-family="sans-serif" fill="#2B241F">Input and output token counts</text><text x="155" y="635" font-size="23" font-family="sans-serif" fill="#2B241F">Tool name and error type</text><text x="155" y="730" font-size="23" font-family="sans-serif" fill="#2B241F">Span duration and parent-child links</text><text x="115" y="815" font-size="21" font-family="sans-serif" fill="#677A5B">For routine monitoring, trends, and most debugging.</text><rect x="810" y="220" width="650" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="850" y="285" font-size="36" font-family="sans-serif" font-weight="700" fill="#2B241F" style=";font-size:30.8px">Enable content capture as needed</text><text x="850" y="335" font-size="22" font-family="sans-serif" fill="#7A573A" style=";font-size:17px"><tspan x="850.0" y="327.0">Content helps debug failures but may contain code, files, and user</tspan><tspan x="850.0" y="347.0">input.</tspan></text><rect x="855" y="400" width="530" height="70" rx="16" fill="#F2E6D5"/><rect x="855" y="495" width="530" height="70" rx="16" fill="#F2E6D5"/><rect x="855" y="590" width="530" height="70" rx="16" fill="#F2E6D5"/><rect x="855" y="685" width="530" height="70" rx="16" fill="#F3DDD7"/><text x="890" y="445" font-size="23" font-family="sans-serif" fill="#2B241F">gen_ai.input.messages</text><text x="890" y="540" font-size="23" font-family="sans-serif" fill="#2B241F">gen_ai.output.messages</text><text x="890" y="635" font-size="23" font-family="sans-serif" fill="#2B241F">gen_ai.tool.call.arguments / result</text><text x="890" y="730" font-size="23" font-family="sans-serif" fill="#A95B4D">Minimize collection and restrict access</text><text x="850" y="815" font-size="21" font-family="sans-serif" fill="#A95B4D" style=";font-size:17.3px">Debugging convenience does not replace privacy or access controls.</text><rect x="250" y="910" width="1030" height="70" rx="22" fill="#2B241F"/><text x="335" y="956" font-size="26" font-family="sans-serif" fill="#FFF8EE" style=";font-size:21.1px">Default to structure and usage. Capture content in a controlled scope for difficult cases.</text></svg>