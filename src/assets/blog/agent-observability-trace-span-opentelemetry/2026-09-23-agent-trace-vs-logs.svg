<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#F7F0E6"/><text x="85" y="100" font-size="50" font-family="sans-serif" font-weight="700" fill="#2B241F">日志和 Trace 的差别</text><text x="85" y="150" font-size="26" font-family="sans-serif" fill="#7A573A">同一批事件，日志按时间散落。Trace 用父子关系把它们还原成一次完整任务。</text><rect x="70" y="220" width="600" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="110" y="280" font-size="34" font-family="sans-serif" font-weight="700" fill="#2B241F">普通日志</text><text x="110" y="325" font-size="22" font-family="sans-serif" fill="#7A573A">能看到发生了什么，但很难判断哪些记录属于同一次任务</text><rect x="115" y="390" width="505" height="62" rx="14" fill="#EFE4D4"/><text x="140" y="430" font-size="21" font-family="sans-serif" fill="#2B241F">模型调用完成</text><rect x="115" y="482" width="505" height="62" rx="14" fill="#EFE4D4"/><text x="140" y="522" font-size="21" font-family="sans-serif" fill="#2B241F">读取文件完成</text><rect x="115" y="574" width="505" height="62" rx="14" fill="#EFE4D4"/><text x="140" y="614" font-size="21" font-family="sans-serif" fill="#2B241F">模型再次调用</text><rect x="115" y="666" width="505" height="62" rx="14" fill="#F3DDD7"/><text x="140" y="706" font-size="21" font-family="sans-serif" fill="#A95B4D">运行测试失败</text><rect x="115" y="758" width="505" height="62" rx="14" fill="#EFE4D4"/><text x="140" y="798" font-size="21" font-family="sans-serif" fill="#2B241F">重试开始</text><rect x="760" y="220" width="705" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="800" y="280" font-size="34" font-family="sans-serif" font-weight="700" fill="#2B241F">Trace</text><text x="800" y="325" font-size="22" font-family="sans-serif" fill="#7A573A">一次任务只有一个 trace。每个模型调用和工具调用是一个 span。</text><line x1="850" y1="390" x2="850" y2="760" stroke="#D69A4B" stroke-width="8"/><circle cx="850" cy="410" r="17" fill="#D69A4B"/><circle cx="850" cy="500" r="17" fill="#D69A4B"/><circle cx="850" cy="590" r="17" fill="#D69A4B"/><circle cx="850" cy="680" r="17" fill="#A95B4D"/><rect x="900" y="375" width="455" height="70" rx="16" fill="#EFE4D4"/><rect x="900" y="465" width="455" height="70" rx="16" fill="#EFE4D4"/><rect x="900" y="555" width="455" height="70" rx="16" fill="#EFE4D4"/><rect x="900" y="645" width="455" height="70" rx="16" fill="#F3DDD7"/><text x="930" y="419" font-size="22" font-family="sans-serif" fill="#2B241F">invoke_agent：整次任务</text><text x="930" y="509" font-size="22" font-family="sans-serif" fill="#2B241F">chat：模型判断下一步</text><text x="930" y="599" font-size="22" font-family="sans-serif" fill="#2B241F">execute_tool：读取文件</text><text x="930" y="689" font-size="22" font-family="sans-serif" fill="#A95B4D">execute_tool：测试失败</text><rect x="230" y="910" width="1080" height="70" rx="22" fill="#2B241F"/><text x="315" y="956" font-size="26" font-family="sans-serif" fill="#FFF8EE">Trace 的价值是把一次 Agent 任务还原成可查询的调用树。</text></svg>