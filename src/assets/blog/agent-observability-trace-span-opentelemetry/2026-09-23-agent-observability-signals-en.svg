<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#F7F0E6"/><text x="90" y="100" font-size="52" font-family="sans-serif" font-weight="700" fill="#2B241F">Three signals for agent observability</text><text x="90" y="150" font-size="26" font-family="sans-serif" fill="#7A573A">Traces, metrics, and events answer different questions about the same coding-agent failure</text><rect x="70" y="220" width="440" height="620" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="110" y="285" font-size="40" font-family="sans-serif" font-weight="700" fill="#2B241F">Trace</text><text x="110" y="335" font-size="25" font-family="sans-serif" fill="#7A573A">Inspect one task's call chain</text><line x1="150" y1="405" x2="150" y2="690" stroke="#D69A4B" stroke-width="8"/><circle cx="150" cy="430" r="18" fill="#D69A4B"/><circle cx="150" cy="520" r="18" fill="#D69A4B"/><circle cx="150" cy="610" r="18" fill="#D69A4B"/><circle cx="150" cy="700" r="18" fill="#A95B4D"/><text x="200" y="440" font-size="24" font-family="sans-serif" fill="#2B241F">invoke_agent</text><text x="200" y="530" font-size="24" font-family="sans-serif" fill="#2B241F">chat</text><text x="200" y="620" font-size="24" font-family="sans-serif" fill="#2B241F">execute_tool</text><text x="200" y="710" font-size="24" font-family="sans-serif" fill="#A95B4D">execute_tool fails</text><text x="110" y="790" font-size="22" font-family="sans-serif" fill="#7A573A" style=";font-size:17px"><tspan x="110.0" y="782.0">Where was it slow or wrong? What depended</tspan><tspan x="110.0" y="802.0">on it?</tspan></text><rect x="548" y="220" width="440" height="620" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="588" y="285" font-size="40" font-family="sans-serif" font-weight="700" fill="#2B241F">Metrics</text><text x="588" y="335" font-size="25" font-family="sans-serif" fill="#7A573A">Inspect trends over time</text><rect x="610" y="425" width="55" height="220" rx="10" fill="#A98F75"/><rect x="700" y="500" width="55" height="145" rx="10" fill="#D69A4B"/><rect x="790" y="455" width="55" height="190" rx="10" fill="#677A5B"/><rect x="880" y="540" width="55" height="105" rx="10" fill="#7A573A"/><text x="600" y="700" font-size="24" font-family="sans-serif" fill="#2B241F">Latency</text><text x="700" y="700" font-size="24" font-family="sans-serif" fill="#2B241F">Token</text><text x="800" y="700" font-size="24" font-family="sans-serif" fill="#2B241F">Tool calls</text><text x="588" y="790" font-size="22" font-family="sans-serif" fill="#7A573A" style=";font-size:18.8px">Is latency, cost, or the failure rate rising?</text><rect x="1026" y="220" width="440" height="620" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="1066" y="285" font-size="40" font-family="sans-serif" font-weight="700" fill="#2B241F">Events</text><text x="1066" y="335" font-size="25" font-family="sans-serif" fill="#7A573A" style=";font-size:23.4px">Inspect actions at a point in time</text><rect x="1085" y="410" width="320" height="70" rx="18" fill="#F1E5D4"/><rect x="1085" y="505" width="320" height="70" rx="18" fill="#F1E5D4"/><rect x="1085" y="600" width="320" height="70" rx="18" fill="#F3DDD7"/><text x="1110" y="455" font-size="23" font-family="sans-serif" fill="#2B241F">User submits task</text><text x="1110" y="550" font-size="23" font-family="sans-serif" fill="#2B241F">Tool approved</text><text x="1110" y="645" font-size="23" font-family="sans-serif" fill="#A95B4D">Test fails</text><text x="1066" y="790" font-size="22" font-family="sans-serif" fill="#7A573A">What happened at that moment?</text><rect x="250" y="890" width="1036" height="80" rx="24" fill="#2B241F"/><text x="330" y="942" font-size="28" font-family="sans-serif" fill="#FFF8EE" style=";font-size:17.8px">Traces show causal chains, metrics show trends, and events show discrete actions. Each has its own role.</text></svg>