<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#F7F0E6"/><text x="80" y="95" font-size="50" font-family="sans-serif" font-weight="700" fill="#2B241F">Lora PI Kit 的 trace 怎样接到 OpenTelemetry</text><text x="80" y="145" font-size="26" font-family="sans-serif" fill="#7A573A">左侧是当前仓库已有事件。右侧是建议增加的映射与导出层。</text><rect x="70" y="215" width="540" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="110" y="280" font-size="34" font-family="sans-serif" font-weight="700" fill="#2B241F">当前已有</text><text x="110" y="325" font-size="24" font-family="sans-serif" fill="#7A573A">extensions/glassbox/trace-hooks.ts</text><rect x="110" y="375" width="450" height="82" rx="16" fill="#F1E5D4"/><text x="135" y="409" font-size="23" font-family="sans-serif" font-weight="700" fill="#2B241F">agent_start</text><text x="135" y="439" font-size="19" font-family="sans-serif" fill="#7A573A">一次 Agent 开始</text><rect x="110" y="480" width="450" height="82" rx="16" fill="#F1E5D4"/><text x="135" y="514" font-size="23" font-family="sans-serif" font-weight="700" fill="#2B241F">turn_start / turn_end</text><text x="135" y="544" font-size="19" font-family="sans-serif" fill="#7A573A">一次模型轮次</text><rect x="110" y="585" width="450" height="82" rx="16" fill="#F1E5D4"/><text x="135" y="619" font-size="23" font-family="sans-serif" font-weight="700" fill="#2B241F">tool_call / tool_result</text><text x="135" y="649" font-size="19" font-family="sans-serif" fill="#7A573A">一次工具调用</text><rect x="110" y="690" width="450" height="82" rx="16" fill="#F1E5D4"/><text x="135" y="724" font-size="23" font-family="sans-serif" font-weight="700" fill="#2B241F">usage</text><text x="135" y="754" font-size="19" font-family="sans-serif" fill="#7A573A">模型与 token 用量</text><text x="110" y="825" font-size="20" font-family="sans-serif" fill="#A95B4D">当前 traceBuffer 在进程内存中</text><path d="M650 535 C720 535 735 535 790 535" stroke="#D69A4B" stroke-width="12" fill="none"/><polygon points="790,535 748,510 748,560" fill="#D69A4B"/><text x="670" y="505" font-size="24" font-family="sans-serif" fill="#2B241F">映射层</text><rect x="825" y="215" width="640" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="865" y="280" font-size="34" font-family="sans-serif" font-weight="700" fill="#2B241F">建议增加</text><rect x="865" y="350" width="520" height="100" rx="18" fill="#EFE1CF"/><text x="900" y="392" font-size="25" font-family="sans-serif" font-weight="700" fill="#2B241F">Trace 映射</text><text x="900" y="425" font-size="20" font-family="sans-serif" fill="#7A573A">agent 映射为 invoke_agent，工具调用映射为 execute_tool</text><rect x="865" y="485" width="520" height="100" rx="18" fill="#EFE1CF"/><text x="900" y="527" font-size="25" font-family="sans-serif" font-weight="700" fill="#2B241F">Metrics 汇总</text><text x="900" y="560" font-size="20" font-family="sans-serif" fill="#7A573A">延迟、Token、工具调用数、错误率</text><rect x="865" y="620" width="520" height="100" rx="18" fill="#EFE1CF"/><text x="900" y="662" font-size="25" font-family="sans-serif" font-weight="700" fill="#2B241F">OTLP Exporter</text><text x="900" y="695" font-size="20" font-family="sans-serif" fill="#7A573A">输出到兼容 OpenTelemetry 的后端</text><text x="865" y="785" font-size="20" font-family="sans-serif" fill="#677A5B">保留现有事件采集，只增加标准化和持久导出</text><rect x="180" y="900" width="1175" height="70" rx="22" fill="#2B241F"/><text x="250" y="946" font-size="26" font-family="sans-serif" fill="#FFF8EE">工程边界：PI Kit 产生执行事件，Glassbox 或 exporter 负责标准化、存储和查询。</text></svg>