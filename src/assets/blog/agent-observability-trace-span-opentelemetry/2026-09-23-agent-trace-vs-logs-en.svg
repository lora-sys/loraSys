<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#F7F0E6"/><text x="85" y="100" font-size="50" font-family="sans-serif" font-weight="700" fill="#2B241F">Logs versus traces</text><text x="85" y="150" font-size="26" font-family="sans-serif" fill="#7A573A">Logs scatter events over time. Traces reconstruct a task through parent-child relationships.</text><rect x="70" y="220" width="600" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="110" y="280" font-size="34" font-family="sans-serif" font-weight="700" fill="#2B241F">Ordinary logs</text><text x="110" y="325" font-size="22" font-family="sans-serif" fill="#7A573A" style=";font-size:20.0px">Shows events, but task membership is hard to identify</text><rect x="115" y="390" width="505" height="62" rx="14" fill="#EFE4D4"/><text x="140" y="430" font-size="21" font-family="sans-serif" fill="#2B241F">Model call completed</text><rect x="115" y="482" width="505" height="62" rx="14" fill="#EFE4D4"/><text x="140" y="522" font-size="21" font-family="sans-serif" fill="#2B241F">File read completed</text><rect x="115" y="574" width="505" height="62" rx="14" fill="#EFE4D4"/><text x="140" y="614" font-size="21" font-family="sans-serif" fill="#2B241F">Model called again</text><rect x="115" y="666" width="505" height="62" rx="14" fill="#F3DDD7"/><text x="140" y="706" font-size="21" font-family="sans-serif" fill="#A95B4D">Test execution failed</text><rect x="115" y="758" width="505" height="62" rx="14" fill="#EFE4D4"/><text x="140" y="798" font-size="21" font-family="sans-serif" fill="#2B241F">Retry started</text><rect x="760" y="220" width="705" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="800" y="280" font-size="34" font-family="sans-serif" font-weight="700" fill="#2B241F">Trace</text><text x="800" y="325" font-size="22" font-family="sans-serif" fill="#7A573A">One trace per task. Each model or tool call is a span.</text><line x1="850" y1="390" x2="850" y2="760" stroke="#D69A4B" stroke-width="8"/><circle cx="850" cy="410" r="17" fill="#D69A4B"/><circle cx="850" cy="500" r="17" fill="#D69A4B"/><circle cx="850" cy="590" r="17" fill="#D69A4B"/><circle cx="850" cy="680" r="17" fill="#A95B4D"/><rect x="900" y="375" width="455" height="70" rx="16" fill="#EFE4D4"/><rect x="900" y="465" width="455" height="70" rx="16" fill="#EFE4D4"/><rect x="900" y="555" width="455" height="70" rx="16" fill="#EFE4D4"/><rect x="900" y="645" width="455" height="70" rx="16" fill="#F3DDD7"/><text x="930" y="419" font-size="22" font-family="sans-serif" fill="#2B241F">invoke_agent: entire task</text><text x="930" y="509" font-size="22" font-family="sans-serif" fill="#2B241F">chat: model decides the next step</text><text x="930" y="599" font-size="22" font-family="sans-serif" fill="#2B241F">execute_tool: read file</text><text x="930" y="689" font-size="22" font-family="sans-serif" fill="#A95B4D">execute_tool: test failure</text><rect x="230" y="910" width="1080" height="70" rx="22" fill="#2B241F"/><text x="315" y="956" font-size="26" font-family="sans-serif" fill="#FFF8EE">A trace reconstructs an agent task as a queryable call tree.</text></svg>