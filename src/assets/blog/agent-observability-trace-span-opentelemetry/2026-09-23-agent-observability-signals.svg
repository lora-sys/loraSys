<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#F7F0E6"/><text x="90" y="100" font-size="52" font-family="sans-serif" font-weight="700" fill="#2B241F">Agent 可观测性的三种信号</text><text x="90" y="150" font-size="26" font-family="sans-serif" fill="#7A573A">同一个 Coding Agent 故障，Trace、Metrics、Events 回答不同问题</text><rect x="70" y="220" width="440" height="620" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="110" y="285" font-size="40" font-family="sans-serif" font-weight="700" fill="#2B241F">Trace</text><text x="110" y="335" font-size="25" font-family="sans-serif" fill="#7A573A">看一次任务的调用链</text><line x1="150" y1="405" x2="150" y2="690" stroke="#D69A4B" stroke-width="8"/><circle cx="150" cy="430" r="18" fill="#D69A4B"/><circle cx="150" cy="520" r="18" fill="#D69A4B"/><circle cx="150" cy="610" r="18" fill="#D69A4B"/><circle cx="150" cy="700" r="18" fill="#A95B4D"/><text x="200" y="440" font-size="24" font-family="sans-serif" fill="#2B241F">invoke_agent</text><text x="200" y="530" font-size="24" font-family="sans-serif" fill="#2B241F">chat</text><text x="200" y="620" font-size="24" font-family="sans-serif" fill="#2B241F">execute_tool</text><text x="200" y="710" font-size="24" font-family="sans-serif" fill="#A95B4D">execute_tool 失败</text><text x="110" y="790" font-size="22" font-family="sans-serif" fill="#7A573A">回答：哪里慢，哪里错，前后依赖是什么</text><rect x="548" y="220" width="440" height="620" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="588" y="285" font-size="40" font-family="sans-serif" font-weight="700" fill="#2B241F">Metrics</text><text x="588" y="335" font-size="25" font-family="sans-serif" fill="#7A573A">看一段时间的趋势</text><rect x="610" y="425" width="55" height="220" rx="10" fill="#A98F75"/><rect x="700" y="500" width="55" height="145" rx="10" fill="#D69A4B"/><rect x="790" y="455" width="55" height="190" rx="10" fill="#677A5B"/><rect x="880" y="540" width="55" height="105" rx="10" fill="#7A573A"/><text x="600" y="700" font-size="24" font-family="sans-serif" fill="#2B241F">延迟</text><text x="700" y="700" font-size="24" font-family="sans-serif" fill="#2B241F">Token</text><text x="800" y="700" font-size="24" font-family="sans-serif" fill="#2B241F">工具调用</text><text x="588" y="790" font-size="22" font-family="sans-serif" fill="#7A573A">回答：是否变慢，是否变贵，失败率是否上升</text><rect x="1026" y="220" width="440" height="620" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="1066" y="285" font-size="40" font-family="sans-serif" font-weight="700" fill="#2B241F">Events</text><text x="1066" y="335" font-size="25" font-family="sans-serif" fill="#7A573A">看某个时刻发生的动作</text><rect x="1085" y="410" width="320" height="70" rx="18" fill="#F1E5D4"/><rect x="1085" y="505" width="320" height="70" rx="18" fill="#F1E5D4"/><rect x="1085" y="600" width="320" height="70" rx="18" fill="#F3DDD7"/><text x="1110" y="455" font-size="23" font-family="sans-serif" fill="#2B241F">用户提交任务</text><text x="1110" y="550" font-size="23" font-family="sans-serif" fill="#2B241F">工具获得批准</text><text x="1110" y="645" font-size="23" font-family="sans-serif" fill="#A95B4D">测试失败</text><text x="1066" y="790" font-size="22" font-family="sans-serif" fill="#7A573A">回答：某个时刻发生了什么</text><rect x="250" y="890" width="1036" height="80" rx="24" fill="#2B241F"/><text x="330" y="942" font-size="28" font-family="sans-serif" fill="#FFF8EE">Trace 看因果链，Metrics 看趋势，Events 看离散动作。三者不能互相替代。</text></svg>