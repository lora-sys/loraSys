<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#F7F0E6"/><text x="85" y="100" font-size="50" font-family="sans-serif" font-weight="700" fill="#2B241F">Agent 可观测性里的内容采集边界</text><text x="85" y="150" font-size="26" font-family="sans-serif" fill="#7A573A">先用结构化元数据定位问题。只有确实需要时，再打开 prompt、response 和工具参数。</text><rect x="75" y="220" width="650" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="115" y="285" font-size="36" font-family="sans-serif" font-weight="700" fill="#2B241F">默认采集元数据</text><text x="115" y="335" font-size="22" font-family="sans-serif" fill="#7A573A">GitHub Copilot 文档说明，默认不包含提示词、回复和工具参数。</text><rect x="120" y="400" width="530" height="70" rx="16" fill="#EFE4D4"/><rect x="120" y="495" width="530" height="70" rx="16" fill="#EFE4D4"/><rect x="120" y="590" width="530" height="70" rx="16" fill="#EFE4D4"/><rect x="120" y="685" width="530" height="70" rx="16" fill="#EFE4D4"/><text x="155" y="445" font-size="23" font-family="sans-serif" fill="#2B241F">模型名与结束原因</text><text x="155" y="540" font-size="23" font-family="sans-serif" fill="#2B241F">输入与输出 token 数</text><text x="155" y="635" font-size="23" font-family="sans-serif" fill="#2B241F">工具名与错误类型</text><text x="155" y="730" font-size="23" font-family="sans-serif" fill="#2B241F">span 的耗时与父子关系</text><text x="115" y="815" font-size="21" font-family="sans-serif" fill="#677A5B">适合日常监控、趋势分析和大部分故障定位。</text><rect x="810" y="220" width="650" height="650" rx="28" fill="#FFF9F1" stroke="#7A573A" stroke-width="3"/><text x="850" y="285" font-size="36" font-family="sans-serif" font-weight="700" fill="#2B241F">按需打开内容采集</text><text x="850" y="335" font-size="22" font-family="sans-serif" fill="#7A573A">内容能帮助复盘复杂失败，但可能包含代码、文件内容和用户输入。</text><rect x="855" y="400" width="530" height="70" rx="16" fill="#F2E6D5"/><rect x="855" y="495" width="530" height="70" rx="16" fill="#F2E6D5"/><rect x="855" y="590" width="530" height="70" rx="16" fill="#F2E6D5"/><rect x="855" y="685" width="530" height="70" rx="16" fill="#F3DDD7"/><text x="890" y="445" font-size="23" font-family="sans-serif" fill="#2B241F">gen_ai.input.messages</text><text x="890" y="540" font-size="23" font-family="sans-serif" fill="#2B241F">gen_ai.output.messages</text><text x="890" y="635" font-size="23" font-family="sans-serif" fill="#2B241F">gen_ai.tool.call.arguments / result</text><text x="890" y="730" font-size="23" font-family="sans-serif" fill="#A95B4D">需要最小化采集并限制访问权限</text><text x="850" y="815" font-size="21" font-family="sans-serif" fill="#A95B4D">调试方便不能替代隐私和权限设计。</text><rect x="250" y="910" width="1030" height="70" rx="22" fill="#2B241F"/><text x="335" y="956" font-size="26" font-family="sans-serif" fill="#FFF8EE">默认只采结构和用量。遇到难题，再在受控范围内打开内容。</text></svg>