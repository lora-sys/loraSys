<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#F6EEDF"/>
<rect x="42" y="42" width="1316" height="100" rx="24" fill="#2E251F"/>
<text x="78" y="102" font-family="Arial, Liberation Sans, sans-serif" font-size="44" font-weight="700" fill="#FFF9EF">The core Plugin4Shell sequence</text>
<text x="78" y="134" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#E9D8BE">The SHA itself is not the problem. The installer treats the requested name as the final destination.</text>
<g font-family="Arial, Liberation Sans, sans-serif">
<rect x="54" y="190" width="238" height="430" rx="24" fill="#FFF9EF" stroke="#C89A62" stroke-width="3"/>
<text x="80" y="240" font-size="16.5" font-weight="700" fill="#2E251F" style="font-size:16.5px">1 Record the pinned SHA</text>
<text x="80" y="292" font-size="20" fill="#51443A">Plugin passes review</text><text x="80" y="326" font-size="18.5" fill="#51443A" style="font-size:18.5px">Marketplace records ID</text>
<rect x="80" y="370" width="186" height="80" rx="14" fill="#EFE1CA"/><text x="98" y="405" font-size="18" fill="#76512F">reviewed commit</text><text x="98" y="432" font-family="monospace" font-size="17" fill="#76512F">bbb...bbb</text>

<rect x="327" y="190" width="238" height="430" rx="24" fill="#FFF9EF" stroke="#C89A62" stroke-width="3"/>
<text x="353" y="240" font-size="18.5" font-weight="700" fill="#2E251F" style="font-size:18.5px">2 Repository takeover</text>
<text x="353" y="292" font-size="16.5" fill="#51443A" style="font-size:16.5px">Attacker gains write access</text><text x="353" y="326" font-size="16.5" fill="#51443A" style="font-size:16.5px">to the upstream repository</text>
<rect x="353" y="370" width="186" height="112" rx="14" fill="#F6D9D2"/><text x="371" y="405" font-size="16.5" fill="#963F32" style="font-size:16.5px">Set default branch to</text><text x="371" y="438" font-family="monospace" font-size="17" fill="#963F32">bbb...bbb</text><text x="371" y="468" font-size="13.0" fill="#963F32" style="font-size:13.0px">Points to another commit</text>

<rect x="600" y="190" width="238" height="430" rx="24" fill="#FFF9EF" stroke="#C89A62" stroke-width="3"/>
<text x="626" y="240" font-size="20.5" font-weight="700" fill="#2E251F" style="font-size:20.5px">3 Installer checkout</text>
<rect x="626" y="290" width="186" height="125" rx="14" fill="#2E251F"/><text x="642" y="330" font-family="monospace" font-size="17" fill="#FFF9EF">git clone repo</text><text x="642" y="366" font-family="monospace" font-size="17" fill="#FFF9EF">git checkout</text><text x="642" y="394" font-family="monospace" font-size="17" fill="#E9D8BE">bbb...bbb</text>
<text x="626" y="466" font-size="14.5" fill="#51443A" style="font-size:14.5px">Checks command status only</text><text x="626" y="500" font-size="16.5" fill="#51443A" style="font-size:16.5px">Does not read final HEAD</text>

<rect x="873" y="190" width="238" height="430" rx="24" fill="#FFF9EF" stroke="#963F32" stroke-width="3"/>
<text x="899" y="240" font-size="24" font-weight="700" fill="#2E251F">4 Git warns</text>
<rect x="899" y="290" width="186" height="110" rx="14" fill="#F6D9D2"/><text x="917" y="326" font-size="17" fill="#963F32">refname is</text><text x="917" y="358" font-size="17" fill="#963F32">ambiguous</text><text x="917" y="388" font-size="14.5" fill="#963F32" style="font-size:14.5px">But checkout succeeds</text>
<text x="899" y="466" font-size="17.0" fill="#51443A" style="font-size:17.0px">Program ignores warning</text><text x="899" y="500" font-size="19" fill="#51443A">Continues loading</text>

<rect x="1146" y="190" width="200" height="430" rx="24" fill="#FFF9EF" stroke="#963F32" stroke-width="3"/>
<text x="1172" y="240" font-size="19.0" font-weight="700" fill="#2E251F" style="font-size:19.0px">5 Wrong commit</text>
<text x="1172" y="300" font-size="17.0" fill="#51443A" style="font-size:17.0px">Working tree comes</text><text x="1172" y="334" font-size="17.0" fill="#51443A" style="font-size:17.0px">from another commit</text>
<rect x="1172" y="380" width="148" height="92" rx="14" fill="#F6D9D2"/><text x="1190" y="418" font-size="18" fill="#963F32">actual HEAD</text><text x="1190" y="450" font-size="18" fill="#963F32">≠ pinned SHA</text>
<text x="1172" y="526" font-size="16.5" font-weight="700" fill="#963F32" style="font-size:16.5px">Plugin is still loaded</text>

<g fill="#6F5A48"><polygon points="327,405 305,391 305,419"/><polygon points="600,405 578,391 578,419"/><polygon points="873,405 851,391 851,419"/><polygon points="1146,405 1124,391 1124,419"/></g>
<g stroke="#6F5A48" stroke-width="7"><line x1="292" y1="405" x2="315" y2="405"/><line x1="565" y1="405" x2="588" y2="405"/><line x1="838" y1="405" x2="861" y2="405"/><line x1="1111" y1="405" x2="1134" y2="405"/></g>

<rect x="54" y="672" width="1292" height="96" rx="22" fill="#E8D4B4"/>
<text x="86" y="714" font-size="24" font-weight="700" fill="#2E251F">Key limit</text>
<text x="220" y="714" font-size="21" fill="#51443A">The host must allow 40-character hexadecimal branch names. GitHub explicitly prohibits them.</text>
<text x="86" y="750" font-size="21" fill="#51443A">AIR also disclosed a Gemini CLI FETCH_HEAD variant. Both lack final-state verification after checkout.</text>
</g></svg>