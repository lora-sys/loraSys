<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#F6EEDF"/>
<rect x="42" y="42" width="1316" height="100" rx="24" fill="#2E251F"/>
<text x="78" y="100" font-family="Arial, Liberation Sans, sans-serif" font-size="36.5" font-weight="700" fill="#FFF9EF" style="font-size:36.5px">Harmless local test: checkout succeeds, but HEAD is the wrong commit</text>
<text x="78" y="132" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#E9D8BE">This run changed only marker.txt. No plugin code ran, and no external systems were accessed.</text>
<g font-family="Arial, Liberation Sans, sans-serif">
<rect x="60" y="190" width="600" height="430" rx="26" fill="#FFF9EF" stroke="#C89A62" stroke-width="3"/>
<text x="95" y="245" font-size="30" font-weight="700" fill="#2E251F">Test setup</text>
<text x="95" y="304" font-size="22" fill="#51443A">Expected commit</text><text x="95" y="338" font-family="monospace" font-size="17" fill="#76512F">f14dcf86f2c2ad34aaa47828eee80301e339950b</text>
<text x="95" y="405" font-size="19.0" fill="#51443A" style="font-size:19.0px">Create a same-named local branch pointing to another commit</text><text x="95" y="442" font-family="monospace" font-size="17" fill="#963F32">acae36d63f588241ab723a0348530f413626dc7a</text>
<text x="95" y="508" font-size="21" fill="#51443A">Set this as the default branch, then clone again</text><text x="95" y="548" font-size="21" fill="#51443A">marker.txt contains different</text>

<rect x="740" y="190" width="600" height="430" rx="26" fill="#FFF9EF" stroke="#A9503E" stroke-width="3"/>
<text x="775" y="245" font-size="30" font-weight="700" fill="#2E251F">Observed results</text>
<text x="775" y="304" font-size="20.5" fill="#51443A" style="font-size:20.5px">Exit status of git checkout for the expected SHA</text><text x="1220" y="304" font-size="24" font-weight="700" fill="#536044">0</text>
<rect x="775" y="340" width="500" height="74" rx="14" fill="#F6D9D2"/><text x="800" y="386" font-family="monospace" font-size="21" fill="#963F32">warning: refname is ambiguous</text>
<text x="775" y="468" font-size="22" fill="#51443A">Actual HEAD after checkout</text><text x="775" y="505" font-family="monospace" font-size="17" fill="#963F32">acae36d63f588241ab723a0348530f413626dc7a</text>
<text x="775" y="566" font-size="25" font-weight="700" fill="#963F32">actual HEAD ≠ expected SHA</text>

<rect x="60" y="662" width="1280" height="84" rx="20" fill="#E8D4B4"/>
<text x="90" y="700" font-size="21" fill="#2E251F">Result: Git warns but still returns success. Checking only the exit code misses the real security condition.</text>
<text x="90" y="730" font-size="18" fill="#51443A">Limit: GitHub hosting prohibits 40-character hexadecimal branch names, so this specific variant does not apply there.</text>
</g></svg>