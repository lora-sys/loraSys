<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Financial markets learning map</title><desc id="d">A beginner learning path through assets, prices, risk, and tax.</desc><rect width="1440" height="900" fill="#F7F1E7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#2B241F}.h{font-size:44px;font-weight:700}.s{font-size:28px;font-weight:700}.n{font-size:22px}.box{fill:#FFF9EF;stroke:#806B59;stroke-width:3}.line{stroke:#D89B3C;stroke-width:6;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#D89B3C"/></marker></defs><text x="720" y="80" text-anchor="middle" class="h">Financial markets: a beginner learning map</text><text x="720" y="125" text-anchor="middle" class="n">Understand assets, then prices, then risk. Tax applies throughout actual trading.</text><rect class="box" x="100" y="250" width="260" height="180" rx="28"/><text x="230" y="310" text-anchor="middle" class="s">Assets</text><text x="230" y="355" text-anchor="middle" class="n">Stocks, ETFs, indexes</text><text x="230" y="390" text-anchor="middle" class="n">Bitcoin</text><rect class="box" x="430" y="250" width="260" height="180" rx="28"/><text x="560" y="310" text-anchor="middle" class="s">Prices</text><text x="560" y="355" text-anchor="middle" class="n">Candlesticks, OHLC</text><text x="560" y="390" text-anchor="middle" class="n" font-size="19.0" style="font-size:19.0px">Volume, timeframes, trends</text><rect class="box" x="760" y="250" width="260" height="180" rx="28"/><text x="890" y="310" text-anchor="middle" class="s">Risk</text><text x="890" y="355" text-anchor="middle" class="n" font-size="16.5" style="font-size:16.5px">Position size, stops, drawdowns</text><text x="890" y="390" text-anchor="middle" class="n">Fees, slippage</text><rect class="box" x="1090" y="250" width="260" height="180" rx="28"/><text x="1220" y="310" text-anchor="middle" class="s">Tax</text><text x="1220" y="355" text-anchor="middle" class="n">Tax residency</text><text x="1220" y="390" text-anchor="middle" class="n" font-size="21.0" style="font-size:21.0px">Cost basis, capital gains</text><path class="line" d="M360 340H420"/><path class="line" d="M690 340H750"/><path class="line" d="M1020 340H1080"/><rect x="170" y="560" width="1100" height="120" rx="24" fill="#2B241F"/><text x="720" y="610" text-anchor="middle" class="s" style="fill:#FFF8EE">Learning order</text><text x="720" y="655" text-anchor="middle" class="n" style="fill:#FFF8EE">Understand markets → Paper trade → Record risk → Analyze and review → Decide on real-money trading</text></svg>