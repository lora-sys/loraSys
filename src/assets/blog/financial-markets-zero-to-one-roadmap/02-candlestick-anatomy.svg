<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">K 线结构示意</title><desc id="d">一根 K 线由开盘、最高、最低和收盘四个价格构成。站点重建版，非原附件。</desc><rect width="1200" height="760" fill="#F7F1E7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#2B241F}.h{font-size:42px;font-weight:700}.s{font-size:26px;font-weight:700}.n{font-size:21px}.line{stroke:#2B241F;stroke-width:7}.up{fill:#8DAA91;stroke:#2B241F;stroke-width:4}.down{fill:#C77C66;stroke:#2B241F;stroke-width:4}</style><text x="600" y="75" text-anchor="middle" class="h">一根 K 线只记录四个价格</text><line class="line" x1="380" y1="190" x2="380" y2="600"/><rect class="up" x="300" y="300" width="160" height="190" rx="8"/><text x="505" y="205" class="n">High 最高价</text><line x1="460" y1="200" x2="395" y2="200" stroke="#806B59" stroke-width="3"/><text x="505" y="330" class="n">Close 收盘价</text><line x1="460" y1="325" x2="445" y2="325" stroke="#806B59" stroke-width="3"/><text x="505" y="485" class="n">Open 开盘价</text><line x1="460" y1="480" x2="445" y2="480" stroke="#806B59" stroke-width="3"/><text x="505" y="610" class="n">Low 最低价</text><line x1="460" y1="600" x2="395" y2="600" stroke="#806B59" stroke-width="3"/><text x="130" y="330" class="s">实体</text><text x="115" y="370" class="n">开盘与收盘之间</text><text x="115" y="420" class="s">影线</text><text x="115" y="460" class="n">周期内到过的高低点</text><text x="760" y="250" class="s">读 K 线前先问</text><text x="760" y="305" class="n">1. 是 1 分钟、1 小时还是 1 天</text><text x="760" y="350" class="n">2. 整体是上涨、下跌还是震荡</text><text x="760" y="395" class="n">3. 成交量有没有变化</text><text x="760" y="440" class="n">4. 这根 K 线出现在哪里</text><text x="760" y="485" class="n">5. 判断错了，什么时候退出</text><text x="600" y="700" text-anchor="middle" class="n">站点重建版，非 Notion 原附件。依据 OHLC 定义和原文说明重建。</text></svg>