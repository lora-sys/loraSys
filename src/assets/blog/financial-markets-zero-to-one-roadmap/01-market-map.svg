<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">金融市场学习地图</title><desc id="d">从资产、价格、风险到税务的零基础学习路径。站点重建版，非原附件。</desc><rect width="1440" height="900" fill="#F7F1E7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#2B241F}.h{font-size:44px;font-weight:700}.s{font-size:28px;font-weight:700}.n{font-size:22px}.box{fill:#FFF9EF;stroke:#806B59;stroke-width:3}.line{stroke:#D89B3C;stroke-width:6;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#D89B3C"/></marker></defs><text x="720" y="80" text-anchor="middle" class="h">金融市场零基础学习地图</text><text x="720" y="125" text-anchor="middle" class="n">先理解资产，再读价格，再管风险，税务贯穿实际交易</text><rect class="box" x="100" y="250" width="260" height="180" rx="28"/><text x="230" y="310" text-anchor="middle" class="s">资产</text><text x="230" y="355" text-anchor="middle" class="n">股票 ETF 指数</text><text x="230" y="390" text-anchor="middle" class="n">Bitcoin</text><rect class="box" x="430" y="250" width="260" height="180" rx="28"/><text x="560" y="310" text-anchor="middle" class="s">价格</text><text x="560" y="355" text-anchor="middle" class="n">K 线 OHLC</text><text x="560" y="390" text-anchor="middle" class="n">成交量 周期 趋势</text><rect class="box" x="760" y="250" width="260" height="180" rx="28"/><text x="890" y="310" text-anchor="middle" class="s">风险</text><text x="890" y="355" text-anchor="middle" class="n">仓位 止损 回撤</text><text x="890" y="390" text-anchor="middle" class="n">手续费 滑点</text><rect class="box" x="1090" y="250" width="260" height="180" rx="28"/><text x="1220" y="310" text-anchor="middle" class="s">税务</text><text x="1220" y="355" text-anchor="middle" class="n">税务居民</text><text x="1220" y="390" text-anchor="middle" class="n">成本基础 资本利得</text><path class="line" d="M360 340H420"/><path class="line" d="M690 340H750"/><path class="line" d="M1020 340H1080"/><rect x="170" y="560" width="1100" height="120" rx="24" fill="#2B241F"/><text x="720" y="610" text-anchor="middle" class="s" fill="#FFF8EE">学习顺序</text><text x="720" y="655" text-anchor="middle" class="n" fill="#FFF8EE">看懂市场 → 模拟下单 → 记录风险 → 统计复盘 → 再决定是否实盘</text><text x="720" y="830" text-anchor="middle" class="n">站点重建版，非 Notion 原附件。依据原文四层学习结构重建。</text></svg>