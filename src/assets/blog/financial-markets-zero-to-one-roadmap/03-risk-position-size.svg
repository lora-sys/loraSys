<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">仓位计算示意</title><desc id="d">示例账户 10000，单笔风险 1%，入场 100，止损 98，理论仓位 50。站点重建版，非原附件。</desc><rect width="1200" height="760" fill="#F7F1E7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#2B241F}.h{font-size:42px;font-weight:700}.s{font-size:26px;font-weight:700}.n{font-size:22px}.box{fill:#FFF9EF;stroke:#806B59;stroke-width:3}.accent{fill:#D89B3C}</style><text x="600" y="75" text-anchor="middle" class="h">先算最多能亏多少，再反推仓位</text><rect class="box" x="90" y="180" width="280" height="150" rx="24"/><text x="230" y="235" text-anchor="middle" class="s">账户</text><text x="230" y="290" text-anchor="middle" class="h">10000</text><rect class="box" x="460" y="180" width="280" height="150" rx="24"/><text x="600" y="235" text-anchor="middle" class="s">单笔风险</text><text x="600" y="290" text-anchor="middle" class="h">1% = 100</text><rect class="box" x="830" y="180" width="280" height="150" rx="24"/><text x="970" y="235" text-anchor="middle" class="s">每单位风险</text><text x="970" y="290" text-anchor="middle" class="h">100 - 98 = 2</text><rect x="250" y="430" width="700" height="110" rx="24" fill="#2B241F"/><text x="600" y="480" text-anchor="middle" class="s" fill="#FFF8EE">Position Size = Allowed Loss ÷ |Entry - Stop|</text><text x="600" y="520" text-anchor="middle" class="n" fill="#FFF8EE">100 ÷ 2 = 50 个单位</text><text x="600" y="620" text-anchor="middle" class="n">实际交易还要考虑手续费、滑点、最小交易单位和税。</text><text x="600" y="705" text-anchor="middle" class="n">站点重建版，非 Notion 原附件。示例数字完全来自原文。</text></svg>