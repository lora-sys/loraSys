<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Candlestick anatomy</title><desc id="d">A candlestick consists of four prices: open, high, low, and close.</desc><rect width="1200" height="760" fill="#F7F1E7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#2B241F}.h{font-size:42px;font-weight:700}.s{font-size:26px;font-weight:700}.n{font-size:21px}.line{stroke:#2B241F;stroke-width:7}.up{fill:#8DAA91;stroke:#2B241F;stroke-width:4}.down{fill:#C77C66;stroke:#2B241F;stroke-width:4}</style><text x="600" y="75" text-anchor="middle" class="h">One candlestick records four prices</text><line class="line" x1="380" y1="190" x2="380" y2="600"/><rect class="up" x="300" y="300" width="160" height="190" rx="8"/><text x="505" y="205" class="n">High: highest price</text><line x1="460" y1="200" x2="395" y2="200" stroke="#806B59" stroke-width="3"/><text x="505" y="330" class="n">Close: closing price</text><line x1="460" y1="325" x2="445" y2="325" stroke="#806B59" stroke-width="3"/><text x="505" y="485" class="n">Open: opening price</text><line x1="460" y1="480" x2="445" y2="480" stroke="#806B59" stroke-width="3"/><text x="505" y="610" class="n">Low: lowest price</text><line x1="460" y1="600" x2="395" y2="600" stroke="#806B59" stroke-width="3"/><text x="130" y="330" class="s">Body</text><text x="115" y="370" class="n" font-size="15.0" style="font-size:15.0px">Between open and close</text><text x="115" y="420" class="s">Wicks</text><text x="115" y="460" class="n" font-size="18.5" style="font-size:18.5px">Period high and low</text><text x="760" y="250" class="s">Before reading a candle</text><text x="760" y="305" class="n">1. Is it 1 minute, 1 hour, or 1 day?</text><text x="760" y="350" class="n">2. Rising, falling, or ranging overall?</text><text x="760" y="395" class="n">3. Has volume changed?</text><text x="760" y="440" class="n">4. Where does this candle appear?</text><text x="760" y="485" class="n">5. When will you exit if wrong?</text></svg>