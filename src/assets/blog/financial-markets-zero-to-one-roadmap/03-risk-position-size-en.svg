<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Position-sizing example</title><desc id="d">Example: account 10000, risk per trade 1%, entry 100, stop 98, theoretical position size 50.</desc><rect width="1200" height="760" fill="#F7F1E7"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#2B241F}.h{font-size:42px;font-weight:700}.s{font-size:26px;font-weight:700}.n{font-size:22px}.box{fill:#FFF9EF;stroke:#806B59;stroke-width:3}.accent{fill:#D89B3C}</style><text x="600" y="75" text-anchor="middle" class="h">Set the maximum loss, then calculate position size</text><rect class="box" x="90" y="180" width="280" height="150" rx="24"/><text x="230" y="235" text-anchor="middle" class="s">Account</text><text x="230" y="290" text-anchor="middle" class="h">10000</text><rect class="box" x="460" y="180" width="280" height="150" rx="24"/><text x="600" y="235" text-anchor="middle" class="s">Risk per trade</text><text x="600" y="290" text-anchor="middle" class="h">1% = 100</text><rect class="box" x="830" y="180" width="280" height="150" rx="24"/><text x="970" y="235" text-anchor="middle" class="s">Risk per unit</text><text x="970" y="290" text-anchor="middle" class="h">100 - 98 = 2</text><rect x="250" y="430" width="700" height="110" rx="24" fill="#2B241F"/><text x="600" y="480" text-anchor="middle" class="s" style="fill:#FFF8EE">Position Size = Allowed Loss ÷ |Entry - Stop|</text><text x="600" y="520" text-anchor="middle" class="n" style="fill:#FFF8EE">100 ÷ 2 = 50 units</text><text x="600" y="620" text-anchor="middle" class="n">Actual trading also requires fees, slippage, minimum trade sizes, and tax.</text></svg>