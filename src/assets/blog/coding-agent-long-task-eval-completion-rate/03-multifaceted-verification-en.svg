<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#F5EFE4" /><rect x="0" y="0" width="1500" height="110" fill="#211B17" /><text x="70" y="67" font-size="43.0" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA" style="font-size:43.0px">How should long coding-agent tasks be evaluated?</text><text x="70" y="101" font-size="20.0" font-family="Arial, sans-serif" fill="#D9CDBD" style="font-size:20.0px">One task needs several kinds of evidence. Verify the result, then explain the process.</text><rect x="65" y="165" width="620" height="560" rx="28" fill="#E7DED1" stroke="#5A4B40" stroke-width="3" /><text x="105" y="225" font-size="32.0" font-family="Arial, sans-serif" font-weight="700" fill="#2C241F" style="font-size:32.0px">Deterministic verification</text><text x="105" y="265" font-size="21.0" font-family="Arial, sans-serif" fill="#5A4B40" style="font-size:21.0px">Use code to judge what code can check.</text><rect x="105" y="310" width="500" height="75" rx="16" fill="#FFF9F0" /><text x="135" y="357" font-size="15.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:15.0px">Instrumentation tests: real interactions and state changes</text><rect x="105" y="405" width="500" height="75" rx="16" fill="#FFF9F0" /><text x="135" y="452" font-size="22.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:22.0px">Database checks: verify actual writes</text><rect x="105" y="500" width="500" height="75" rx="16" fill="#FFF9F0" /><text x="135" y="547" font-size="16.5" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:16.5px">System boundaries: intents, network calls, sync events</text><rect x="105" y="595" width="500" height="75" rx="16" fill="#FFF9F0" /><text x="135" y="642" font-size="15.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:15.0px">Regression tests: changes must preserve existing features</text><rect x="815" y="165" width="620" height="560" rx="28" fill="#FFF9F0" stroke="#B77A2A" stroke-width="3" /><text x="855" y="225" font-size="32.0" font-family="Arial, sans-serif" font-weight="700" fill="#2C241F" style="font-size:32.0px">Multimodal verification</text><text x="855" y="265" font-size="20.5" font-family="Arial, sans-serif" fill="#5A4B40" style="font-size:20.5px">Unit tests alone cannot judge UI and user experience.</text><rect x="855" y="310" width="500" height="75" rx="16" fill="#F0E3D0" /><text x="885" y="357" font-size="21.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:21.0px">Emulator walkthroughs: real user journeys</text><rect x="855" y="405" width="500" height="75" rx="16" fill="#F0E3D0" /><text x="885" y="452" font-size="15.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:15.0px">Screenshot review: check layout and visual requirements</text><rect x="855" y="500" width="500" height="75" rx="16" fill="#F0E3D0" /><text x="885" y="547" font-size="15.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:15.0px">Accessibility tree: verify elements and interaction structure</text><rect x="855" y="595" width="500" height="75" rx="16" fill="#F0E3D0" /><text x="885" y="642" font-size="15.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:15.0px">Anti-cheating checks: reject hardcoding and test bypasses</text><rect x="280" y="760" width="940" height="78" rx="24" fill="#3B3029" /><text x="345" y="809" font-size="20.5" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA" style="font-size:20.5px">An average cannot hide build failures, cheating, or critical violations</text><text x="70" y="868" font-size="17.0" font-family="Arial, sans-serif" fill="#7B6A5D" style="font-size:17.0px">Redrawn from Android Bench 2.0 methodology. A lora visual teaching illustration.</text></svg>