<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#F5EFE4"/><rect x="0" y="0" width="1500" height="110" fill="#211B17"/><text x="70" y="70" font-size="44" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA">长任务做完 80%，为什么不能只记 0 分？</text><text x="70" y="101" font-size="20" font-family="Arial, sans-serif" fill="#D9CDBD">同一份 Coding Agent 结果，二元通过率和连续完成度回答的是两个不同问题</text><rect x="55" y="155" width="650" height="640" rx="28" fill="#E7DED1" stroke="#5A4B40" stroke-width="3"/><text x="95" y="215" font-size="34" font-family="Arial, sans-serif" font-weight="700" fill="#2C241F">Binary pass / fail</text><text x="95" y="255" font-size="22" font-family="Arial, sans-serif" fill="#5A4B40">只问：是否全部通过</text><rect x="95" y="300" width="360" height="330" rx="18" fill="#FFF9F0"/><text x="125" y="350" font-size="23" font-family="Arial, sans-serif" fill="#2C241F">✓ 多屏重构完成</text><text x="125" y="397" font-size="23" font-family="Arial, sans-serif" fill="#2C241F">✓ 数据库迁移完成</text><text x="125" y="444" font-size="23" font-family="Arial, sans-serif" fill="#2C241F">✓ 大部分需求满足</text><text x="125" y="491" font-size="23" font-family="Arial, sans-serif" fill="#2C241F">✓ 回归测试大多正常</text><text x="125" y="538" font-size="23" font-family="Arial, sans-serif" fill="#A34B36">✕ 一个边界条件失败</text><rect x="485" y="335" width="175" height="230" rx="22" fill="#3B3029"/><text x="540" y="405" font-size="30" font-family="Arial, sans-serif" fill="#F4C06A">FAIL</text><text x="540" y="500" font-size="92" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA">0</text><text x="95" y="705" font-size="22" font-family="Arial, sans-serif" fill="#5A4B40">它适合当硬门禁，但看不到“差在哪里、差多少”。</text><rect x="795" y="155" width="650" height="640" rx="28" fill="#FFF9F0" stroke="#B77A2A" stroke-width="3"/><text x="835" y="215" font-size="34" font-family="Arial, sans-serif" font-weight="700" fill="#2C241F">Continuous completion</text><text x="835" y="255" font-size="22" font-family="Arial, sans-serif" fill="#5A4B40">再问：已经完成了多少，缺口在哪里</text><text x="835" y="330" font-size="24" font-family="Arial, sans-serif" fill="#2C241F">功能</text><rect x="970" y="306" width="370" height="28" rx="14" fill="#E6DAC9"/><rect x="970" y="306" width="320" height="28" rx="14" fill="#C98B35"/><text x="835" y="405" font-size="24" font-family="Arial, sans-serif" fill="#2C241F">回归</text><rect x="970" y="381" width="370" height="28" rx="14" fill="#E6DAC9"/><rect x="970" y="381" width="345" height="28" rx="14" fill="#C98B35"/><text x="835" y="480" font-size="24" font-family="Arial, sans-serif" fill="#2C241F">需求</text><rect x="970" y="456" width="370" height="28" rx="14" fill="#E6DAC9"/><rect x="970" y="456" width="300" height="28" rx="14" fill="#C98B35"/><text x="835" y="555" font-size="24" font-family="Arial, sans-serif" fill="#2C241F">视觉</text><rect x="970" y="531" width="370" height="28" rx="14" fill="#E6DAC9"/><rect x="970" y="531" width="285" height="28" rx="14" fill="#C98B35"/><rect x="835" y="620" width="500" height="110" rx="20" fill="#3B3029"/><text x="875" y="668" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA">Pass rate 仍保留</text><text x="875" y="706" font-size="21" font-family="Arial, sans-serif" fill="#F4C06A">Completion rate 用来解释接近完成的失败</text><text x="62" y="850" font-size="18" font-family="Arial, sans-serif" fill="#7B6A5D">lora visual · 教学示意，不是 Android Bench 的原始图</text><text x="1210" y="850" font-size="18" font-family="Arial, sans-serif" fill="#7B6A5D">Mochi 说：硬门禁和进度信号都要留</text></svg>