<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#F5EFE4"/><rect x="0" y="0" width="1500" height="110" fill="#211B17"/><text x="70" y="67" font-size="43" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA">长任务 Coding Agent 应该怎样验收？</text><text x="70" y="101" font-size="20" font-family="Arial, sans-serif" fill="#D9CDBD">同一任务需要多种证据。先确认结果，再解释过程。</text><rect x="65" y="165" width="620" height="560" rx="28" fill="#E7DED1" stroke="#5A4B40" stroke-width="3"/><text x="105" y="225" font-size="32" font-family="Arial, sans-serif" font-weight="700" fill="#2C241F">确定性验收</text><text x="105" y="265" font-size="21" font-family="Arial, sans-serif" fill="#5A4B40">能用程序判断，就不要先用模型裁判</text><rect x="105" y="310" width="500" height="75" rx="16" fill="#FFF9F0"/><text x="135" y="357" font-size="22" font-family="Arial, sans-serif" fill="#2C241F">Instrumentation tests：真实交互和状态变化</text><rect x="105" y="405" width="500" height="75" rx="16" fill="#FFF9F0"/><text x="135" y="452" font-size="22" font-family="Arial, sans-serif" fill="#2C241F">数据库检查：确认数据真正写入</text><rect x="105" y="500" width="500" height="75" rx="16" fill="#FFF9F0"/><text x="135" y="547" font-size="22" font-family="Arial, sans-serif" fill="#2C241F">系统边界：Intent、网络调用、同步事件</text><rect x="105" y="595" width="500" height="75" rx="16" fill="#FFF9F0"/><text x="135" y="642" font-size="22" font-family="Arial, sans-serif" fill="#2C241F">回归测试：旧功能不能被新改动破坏</text><rect x="815" y="165" width="620" height="560" rx="28" fill="#FFF9F0" stroke="#B77A2A" stroke-width="3"/><text x="855" y="225" font-size="32" font-family="Arial, sans-serif" font-weight="700" fill="#2C241F">多模态验收</text><text x="855" y="265" font-size="21" font-family="Arial, sans-serif" fill="#5A4B40">界面和体验无法只靠单元测试判断</text><rect x="855" y="310" width="500" height="75" rx="16" fill="#F0E3D0"/><text x="885" y="357" font-size="22" font-family="Arial, sans-serif" fill="#2C241F">模拟器走查：执行真实用户路径</text><rect x="855" y="405" width="500" height="75" rx="16" fill="#F0E3D0"/><text x="885" y="452" font-size="22" font-family="Arial, sans-serif" fill="#2C241F">截图判断：看布局和视觉是否符合要求</text><rect x="855" y="500" width="500" height="75" rx="16" fill="#F0E3D0"/><text x="885" y="547" font-size="22" font-family="Arial, sans-serif" fill="#2C241F">Accessibility tree：确认元素和交互结构</text><rect x="855" y="595" width="500" height="75" rx="16" fill="#F0E3D0"/><text x="885" y="642" font-size="22" font-family="Arial, sans-serif" fill="#2C241F">反作弊检查：拒绝硬编码和测试绕过</text><rect x="280" y="760" width="940" height="78" rx="24" fill="#3B3029"/><text x="345" y="809" font-size="26" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA">构建失败、作弊、关键约束违背不能被平均分掩盖</text><text x="70" y="868" font-size="17" font-family="Arial, sans-serif" fill="#7B6A5D">基于 Android Bench 2.0 methodology 重绘。lora visual 教学图。</text></svg>