<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#F5EFE4" /><rect x="0" y="0" width="1500" height="110" fill="#211B17" /><text x="70" y="70" font-size="44.0" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA" style="font-size:44.0px">A long task is 80% done. Why record more than zero?</text><text x="70" y="101" font-size="20.0" font-family="Arial, sans-serif" fill="#D9CDBD" style="font-size:20.0px">For the same coding-agent result, binary pass rate and continuous completion answer different questions.</text><rect x="55" y="155" width="650" height="640" rx="28" fill="#E7DED1" stroke="#5A4B40" stroke-width="3" /><text x="95" y="215" font-size="34.0" font-family="Arial, sans-serif" font-weight="700" fill="#2C241F" style="font-size:34.0px">Binary pass / fail</text><text x="95" y="255" font-size="22.0" font-family="Arial, sans-serif" fill="#5A4B40" style="font-size:22.0px">Asks only: did everything pass?</text><rect x="95" y="300" width="360" height="330" rx="18" fill="#FFF9F0" /><text x="125" y="350" font-size="21.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:21.0px">✓ Multiple screens refactored</text><text x="125" y="397" font-size="19.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:19.0px">✓ Database migration complete</text><text x="125" y="444" font-size="23.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:23.0px">✓ Most requirements met</text><text x="125" y="491" font-size="22.5" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:22.5px">✓ Most regression tests pass</text><text x="125" y="538" font-size="23.0" font-family="Arial, sans-serif" fill="#A34B36" style="font-size:23.0px">✕ One edge case fails</text><rect x="485" y="335" width="175" height="230" rx="22" fill="#3B3029" /><text x="540" y="405" font-size="30.0" font-family="Arial, sans-serif" fill="#F4C06A" style="font-size:30.0px">FAIL</text><text x="540" y="500" font-size="92.0" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA" style="font-size:92.0px">0</text><text x="95" y="705" font-size="18.5" font-family="Arial, sans-serif" fill="#5A4B40" style="font-size:18.5px">A hard gate, but it cannot show where or how much is missing.</text><rect x="795" y="155" width="650" height="640" rx="28" fill="#FFF9F0" stroke="#B77A2A" stroke-width="3" /><text x="835" y="215" font-size="34.0" font-family="Arial, sans-serif" font-weight="700" fill="#2C241F" style="font-size:34.0px">Continuous completion</text><text x="835" y="255" font-size="22.0" font-family="Arial, sans-serif" fill="#5A4B40" style="font-size:22.0px">Also asks: how much is done, and what is missing?</text><text x="835" y="330" font-size="17.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:17.0px">Functionality</text><rect x="970" y="306" width="370" height="28" rx="14" fill="#E6DAC9" /><rect x="970" y="306" width="320" height="28" rx="14" fill="#C98B35" /><text x="835" y="405" font-size="21.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:21.0px">Regression</text><rect x="970" y="381" width="370" height="28" rx="14" fill="#E6DAC9" /><rect x="970" y="381" width="345" height="28" rx="14" fill="#C98B35" /><text x="835" y="480" font-size="16.5" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:16.5px">Requirements</text><rect x="970" y="456" width="370" height="28" rx="14" fill="#E6DAC9" /><rect x="970" y="456" width="300" height="28" rx="14" fill="#C98B35" /><text x="835" y="555" font-size="24.0" font-family="Arial, sans-serif" fill="#2C241F" style="font-size:24.0px">Visuals</text><rect x="970" y="531" width="370" height="28" rx="14" fill="#E6DAC9" /><rect x="970" y="531" width="285" height="28" rx="14" fill="#C98B35" /><rect x="835" y="620" width="500" height="110" rx="20" fill="#3B3029" /><text x="875" y="668" font-size="25.0" font-family="Arial, sans-serif" font-weight="700" fill="#FFF7EA" style="font-size:25.0px">Keep pass rate</text><text x="875" y="706" font-size="18.5" font-family="Arial, sans-serif" fill="#F4C06A" style="font-size:18.5px">Completion rate explains near-complete failures</text><text x="62" y="850" font-size="18.0" font-family="Arial, sans-serif" fill="#7B6A5D" style="font-size:18.0px">lora visual · Teaching illustration, not an original Android Bench figure</text><text x="1040" y="850" font-size="15" font-family="Arial, sans-serif" fill="#7B6A5D" style="font-size:15px">Mochi: keep both hard gates and progress signals</text></svg>