<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#F6EEDF"/>
  <style>
    .t{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#2E251F}
    .h{font-size:40px;font-weight:700}.s{font-size:22px}.b{font-size:25px;font-weight:700}.m{font-size:20px}.sm{font-size:17px}
    .card{fill:#FFF9EF;stroke:#B98A58;stroke-width:2}.bad{fill:#FDE9E3;stroke:#A9503E;stroke-width:2}.good{fill:#EEF2E7;stroke:#657052;stroke-width:2}
    .line{stroke:#6C5745;stroke-width:4;fill:none}.dash{stroke:#9A7B5D;stroke-width:3;stroke-dasharray:10 10;fill:none}
  </style>
  <text x="55" y="70" class="t h">迁移到 Lora PI Kit，控制信号应该放在哪一层？</text>
  <text x="55" y="108" class="t s">现有 Kit 已有 Session、Trace 和执行器。Steering 更适合做成宿主控制层，而不是塞进单个工具。</text>
  
<rect x="50" y="160" width="460" height="440" rx="24" class="card"/>
<text x="90" y="210" class="t b">已确认的现有能力</text>
<text x="90" y="265" class="t m">Pi Session：维护会话和模型上下文</text>
<text x="90" y="320" class="t m">trace-hooks.ts：记录 agent、turn、tool 事件</text>
<text x="90" y="375" class="t m"><tspan x="90">Docker sandbox executor：</tspan><tspan x="90" dy="29">execute、cancel、close</tspan></text>
<text x="90" y="452" class="t m">runtime.ts：目前只注册 lora-status</text>
<rect x="90" y="500" width="375" height="58" rx="14" fill="#EFE3D2"/>
<text x="115" y="537" class="t sm">这些模块没有现成的即时转向控制器</text>
<path d="M540 365 H635" class="line"/><polygon points="635,365 615,353 615,377" fill="#6C5745"/>
<rect x="665" y="160" width="485" height="460" rx="24" class="good"/>
<text x="705" y="210" class="t b">建议新增 Steering Controller</text>
<text x="705" y="255" class="t m"><tspan x="705">输入：新用户消息、当前 turn、</tspan><tspan x="705" dy="28">活动 task handle</tspan></text>
<text x="705" y="325" class="t m"><tspan x="705">动作：preempt 当前采样，</tspan><tspan x="705" dy="28">决定 continue 或 cancel</tspan></text>
<text x="705" y="395" class="t m"><tspan x="705">记录：steer_received、preempted、</tspan><tspan x="705" dy="28">task_state</tspan></text>
<text x="705" y="465" class="t m"><tspan x="705">输出：新的 turn 输入与</tspan><tspan x="705" dy="28">可恢复后台任务状态</tspan></text>
<rect x="705" y="530" width="400" height="58" rx="14" fill="#DCE7CE"/>
<text x="740" y="567" class="t sm">建议方案。当前 lora-pi-kit 尚未实现。</text>
<text x="600" y="665" text-anchor="middle" class="t s">验收重点：新输入不丢，工具结果不重复，取消语义明确，Trace 能还原转向过程。</text>
</svg>