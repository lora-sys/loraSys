<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#F6EEDF"/>
  <style>
    .t{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#2E251F}
    .h{font-size:40px;font-weight:700}.s{font-size:22px}.b{font-size:25px;font-weight:700}.m{font-size:20px}.sm{font-size:17px}
    .card{fill:#FFF9EF;stroke:#B98A58;stroke-width:2}.bad{fill:#FDE9E3;stroke:#A9503E;stroke-width:2}.good{fill:#EEF2E7;stroke:#657052;stroke-width:2}
    .line{stroke:#6C5745;stroke-width:4;fill:none}.dash{stroke:#9A7B5D;stroke-width:3;stroke-dasharray:10 10;fill:none}
  </style>
  <text x="55" y="70" class="t h">转向、取消、继续收集结果，是三件不同的事</text>
  <text x="55" y="108" class="t s">用户改主意后，系统要按任务副作用决定后台工作怎么处理。</text>
  
<rect x="55" y="170" width="330" height="390" rx="24" class="card"/>
<text x="95" y="220" class="t b">转向</text>
<text x="95" y="265" class="t m">当前模型回合先处理新要求</text>
<text x="95" y="315" class="t m">适合改变计划和优先级</text>
<text x="95" y="365" class="t m">不自动终止后台任务</text>
<rect x="95" y="430" width="250" height="72" rx="16" fill="#F4D6A8"/>
<text x="125" y="475" class="t b">控制流变化</text>
<rect x="435" y="170" width="330" height="390" rx="24" class="bad"/>
<text x="475" y="220" class="t b">取消</text>
<text x="475" y="265" class="t m">显式停止旧任务</text>
<text x="475" y="310" class="t m"><tspan x="475">适合有副作用或</tspan><tspan x="475" dy="28">已不再需要的操作</tspan></text>
<text x="475" y="385" class="t m">必要时还要检查部分执行结果</text>
<rect x="475" y="430" width="250" height="72" rx="16" fill="#F7C6B8"/>
<text x="505" y="475" class="t b">资源和副作用</text>
<rect x="815" y="170" width="330" height="390" rx="24" class="good"/>
<text x="855" y="220" class="t b">继续收集</text>
<text x="855" y="265" class="t m">让安全后台任务继续</text>
<text x="855" y="310" class="t m"><tspan x="855">之后凭 task handle </tspan><tspan x="855" dy="28">或 cell ID 取结果</tspan></text>
<text x="855" y="385" class="t m">适合测试、读取、检索等操作</text>
<rect x="855" y="430" width="250" height="72" rx="16" fill="#DCE7CE"/>
<text x="885" y="475" class="t b">保留后续价值</text>
<text x="300" y="635" class="t s">PR #48135 的 code mode 会提前返回正在运行的 cell ID，但不会停止底层 cell。</text>
</svg>