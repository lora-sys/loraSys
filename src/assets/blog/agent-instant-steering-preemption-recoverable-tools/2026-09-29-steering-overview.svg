<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <rect width="1500" height="900" fill="#F7F0E4"/>
  <style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#2D241E}
    .title{font-size:42px;font-weight:700}.sub{font-size:23px;fill:#65564B}
    .h{font-size:28px;font-weight:700}.t{font-size:22px}.s{font-size:18px;fill:#6B5C50}
    .card{fill:#FFF9EF;stroke:#C8B39E;stroke-width:2}.amber{fill:#F2D7A5;stroke:#B97B2B;stroke-width:2}
    .bad{fill:#F7DED6;stroke:#B85B47;stroke-width:2}.good{fill:#E6E9D8;stroke:#6F7C57;stroke-width:2}
    .line{stroke:#6B5C50;stroke-width:4;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6B5C50"/></marker></defs>
  <text x="70" y="80" class="title">Agent 正在运行时，用户改主意怎么办？</text>
<text x="70" y="125" class="sub">中途转向不等于强制取消。新的输入应该尽快进入下一次模型调用，同时保留已经完成的工作。</text>
<rect x="70" y="175" rx="28" ry="28" width="630" height="610" class="card"/>
<rect x="800" y="175" rx="28" ry="28" width="630" height="610" class="card"/>
<text x="105" y="230" class="h">旧流程：新输入只能排队</text>
<text x="835" y="230" class="h">即时转向：尽快调整当前回合</text>
<rect x="115" y="280" rx="18" width="250" height="90" class="amber"/><text x="145" y="325" class="t">原始任务</text><text x="145" y="355" class="s">修复登录测试</text>
<path d="M365 325 H500" class="line"/>
<rect x="505" y="280" rx="18" width="145" height="90" class="card"/><text x="535" y="333" class="t">执行中</text>
<rect x="220" y="445" rx="18" width="330" height="105" class="bad"/><text x="250" y="490" class="t">用户新要求</text><text x="250" y="525" class="s">不要改认证接口，只改缓存逻辑</text>
<path d="M385 550 V650" class="line"/>
<rect x="220" y="660" rx="18" width="330" height="75" class="bad"/><text x="255" y="707" class="t">等待旧任务结束后才处理</text>

<rect x="845" y="280" rx="18" width="250" height="90" class="amber"/><text x="875" y="325" class="t">原始任务正在执行</text>
<rect x="980" y="420" rx="18" width="360" height="105" class="good"/><text x="1010" y="465" class="t">用户新要求到达</text><text x="1010" y="500" class="s">写入同一回合的待处理输入</text>
<path d="M1090 370 V410" class="line"/>
<rect x="845" y="585" rx="18" width="250" height="100" class="good"/><text x="875" y="625" class="t">当前模型响应</text><text x="875" y="660" class="s">提前结束并清理未完成输出</text>
<rect x="1135" y="585" rx="18" width="250" height="100" class="good"/><text x="1165" y="625" class="t">长任务</text><text x="1165" y="660" class="s">可让行并保留继续句柄</text>
<path d="M1160 525 V570" class="line"/>
<text x="520" y="845" class="h">关键点：新输入改变方向，但不自动抹掉已经完成的真实结果。</text></svg>