<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#F7F0E4"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#2D241E}.h{font-size:42px;font-weight:700}.t{font-size:25px}.s{font-size:20px;fill:#6B5C50}.c{fill:#FFF9EF;stroke:#C8B39E;stroke-width:2}.g{fill:#E6E9D8;stroke:#6F7C57;stroke-width:2}.r{fill:#F7DED6;stroke:#B85B47;stroke-width:2}.a{fill:#F2D7A5;stroke:#B97B2B;stroke-width:2}</style><text x="70" y="85" class="h">即时转向时，哪些状态必须保留？</text><text x="70" y="130" class="s">下一次模型调用只应该看到已经确认的事实。</text><rect x="70" y="185" width="390" height="560" rx="26" class="c"/><text x="105" y="240" class="t">转向前</text><rect x="105" y="290" width="320" height="85" rx="15" class="g"/><text x="135" y="342" class="t">已完成 commentary　保留</text><rect x="105" y="405" width="320" height="85" rx="15" class="g"/><text x="135" y="457" class="t">真实工具结果　只记一次</text><rect x="105" y="520" width="320" height="85" rx="15" class="r"/><text x="135" y="572" class="t">未完成 assistant 文本　丢弃</text><rect x="105" y="635" width="320" height="70" rx="15" class="a"/><text x="135" y="680" class="t">用户新要求　保留</text><rect x="550" y="265" width="360" height="380" rx="25" class="a"/><text x="590" y="325" class="t">优雅中断与 drain</text><text x="590" y="390" class="t">发送中断信号</text><text x="590" y="445" class="t">继续读取终止事件</text><text x="590" y="500" class="t">保留 usage</text><text x="590" y="555" class="t">当前回合未结束</text><rect x="1000" y="265" width="400" height="380" rx="25" class="g"/><text x="1040" y="325" class="t">下一次请求</text><text x="1040" y="390" class="t">带上新的用户输入</text><text x="1040" y="445" class="t">沿用已确认历史</text><text x="1040" y="500" class="t">使用 previous_response_id</text><text x="305" y="825" class="t">完成的内容留下。半截输出丢掉。工具结果不能重复记账。</text></svg>