<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#F6EEDF"/>
  <style>
    .t{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#2E251F}
    .h{font-size:40px;font-weight:700}.s{font-size:22px}.b{font-size:25px;font-weight:700}.m{font-size:20px}.sm{font-size:17px}
    .card{fill:#FFF9EF;stroke:#B98A58;stroke-width:2}.bad{fill:#FDE9E3;stroke:#A9503E;stroke-width:2}.good{fill:#EEF2E7;stroke:#657052;stroke-width:2}
    .line{stroke:#6C5745;stroke-width:4;fill:none}.dash{stroke:#9A7B5D;stroke-width:3;stroke-dasharray:10 10;fill:none}
  </style>
  <text x="55" y="70" class="t h">Why subscribe before checking the input queue?</text>
  <text x="55" y="108" class="t s">Close the race window so new input cannot slip between checking and waiting.</text>
  
<rect x="55" y="160" width="500" height="430" rx="24" class="bad"/>
<text x="90" y="210" class="t b">Wrong order</text>
<text x="90" y="255" class="t m">1. Check the queue: empty</text>
<text x="90" y="310" class="t m">2. User sends a new requirement</text>
<text x="90" y="365" class="t m">3. Register the listener afterward</text>
<text x="90" y="420" class="t m">4. The listener misses that message</text>
<rect x="95" y="470" width="420" height="78" rx="16" fill="#F7C6B8"/>
<text x="120" y="518" class="t b">Result: missed input</text>
<path d="M600 350 H650" class="line"/><polygon points="650,350 630,338 630,362" fill="#6C5745"/>
<rect x="680" y="160" width="465" height="430" rx="24" class="good"/>
<text x="715" y="210" class="t b">Correct order</text>
<text x="715" y="255" class="t m">1. Subscribe to queue changes</text>
<text x="715" y="310" class="t m">2. Check the current queue</text>
<text x="715" y="365" class="t m">3. Handle existing input immediately</text>
<text x="715" y="420" class="t m">4. Later input wakes the listener</text>
<rect x="715" y="470" width="390" height="78" rx="16" fill="#DCE7CE"/>
<text x="745" y="518" class="t b" style=";font-size:18.0px">Result: both arrival times covered</text>
<text x="390" y="650" class="t s">Source: input-listener implementation in openai/codex PR #48135</text>
</svg>