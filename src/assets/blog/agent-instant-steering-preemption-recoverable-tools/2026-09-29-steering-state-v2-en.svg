<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#F7F0E4"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#2D241E}.h{font-size:42px;font-weight:700}.t{font-size:25px}.s{font-size:20px;fill:#6B5C50}.c{fill:#FFF9EF;stroke:#C8B39E;stroke-width:2}.g{fill:#E6E9D8;stroke:#6F7C57;stroke-width:2}.r{fill:#F7DED6;stroke:#B85B47;stroke-width:2}.a{fill:#F2D7A5;stroke:#B97B2B;stroke-width:2}</style><text x="70" y="85" class="h">Which state must survive instant steering?</text><text x="70" y="130" class="s">The next model call should see only confirmed facts.</text><rect x="70" y="185" width="390" height="560" rx="26" class="c"/><text x="105" y="240" class="t">Before steering</text><rect x="105" y="290" width="320" height="85" rx="15" class="g"/><text x="135" y="322" class="t"><tspan x="135" style=";font-size:22.7px">Completed commentary</tspan><tspan x="135" dy="35">  Keep</tspan></text><rect x="105" y="405" width="320" height="85" rx="15" class="g"/><text x="135" y="457" class="t" style=";font-size:17.7px">Actual tool results: record once</text><rect x="105" y="520" width="320" height="85" rx="15" class="r"/><text x="135" y="552" class="t"><tspan x="135" style=";font-size:22.2px">Unfinished assistant text</tspan><tspan x="135" dy="35">  Discard</tspan></text><rect x="105" y="635" width="320" height="70" rx="15" class="a"/><text x="135" y="680" class="t" style=";font-size:19.4px">New user requirement: keep</text><rect x="550" y="265" width="360" height="380" rx="25" class="a"/><text x="590" y="325" class="t">Interrupt and drain</text><text x="590" y="390" class="t">Send interrupt signal</text><text x="590" y="445" class="t" style=";font-size:18.7px">Read through the terminal event</text><text x="590" y="500" class="t">Retain usage</text><text x="590" y="555" class="t">Current turn unfinished</text><rect x="1000" y="265" width="400" height="380" rx="25" class="g"/><text x="1040" y="325" class="t">Next request</text><text x="1040" y="390" class="t">Include new user input</text><text x="1040" y="445" class="t">Reuse confirmed history</text><text x="1040" y="500" class="t">Use previous_response_id</text><text x="305" y="825" class="t">Keep completed content. Discard partial output. Record each tool result once.</text></svg>