<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700">
<rect width="1200" height="700" fill="#f7f0e6"/>
<g font-family="sans-serif" fill="#2d241f">
<text x="60" y="75" font-size="40" font-weight="700">Why rollback must use logical order</text>
<text x="60" y="115" font-size="22" fill="#5d5148">With concurrency, completion time and logical task order may differ</text>
<rect x="65" y="165" width="1070" height="390" rx="22" fill="#fffaf0" stroke="#b88a55" stroke-width="2"/>
<line x1="150" y1="320" x2="1050" y2="320" stroke="#6f5a49" stroke-width="4"/>
<circle cx="240" cy="320" r="18" fill="#b88a55"/><text x="185" y="275" font-size="21">User constraint</text><text x="185" y="375" font-size="19">order 1</text>
<circle cx="470" cy="320" r="18" fill="#b88a55"/><text x="405" y="275" font-size="21">Tool call A</text><text x="415" y="375" font-size="19">order 2</text>
<circle cx="700" cy="320" r="18" fill="#c45b49"/><text x="640" y="275" font-size="21">User addition</text><text x="645" y="375" font-size="19">order 3</text>
<circle cx="930" cy="320" r="18" fill="#c45b49"/><text x="855" y="275" font-size="21">Assistant result B</text><text x="875" y="375" font-size="19">order 4</text>
<rect x="130" y="425" width="420" height="80" rx="14" fill="#efe7da"/><text x="155" y="462" font-size="20" font-weight="700">Physical write order</text><text x="155" y="492" font-size="18">May differ from logical order</text>
<rect x="650" y="425" width="420" height="80" rx="14" fill="#f3d9a6"/><text x="675" y="462" font-size="20" font-weight="700">Rollback boundary</text><text x="675" y="492" font-size="18">Remove later evidence by logical order</text>
<text x="60" y="610" font-size="22" font-weight="700">A synthetic summary must not count as a real user turn.</text>
<text x="60" y="660" font-size="18" fill="#5d5148">Teaching diagram based on OpenAI Codex PR 48779.</text>
</g></svg>