<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700">
<rect width="1200" height="700" fill="#f7f0e6"/>
<g font-family="sans-serif" fill="#2d241f">
<text x="60" y="75" font-size="40" font-weight="700">rollback 为什么要看逻辑顺序</text>
<text x="60" y="115" font-size="22" fill="#5d5148">并发执行时，完成时间和任务中的逻辑顺序可能不同</text>
<rect x="65" y="165" width="1070" height="390" rx="22" fill="#fffaf0" stroke="#b88a55" stroke-width="2"/>
<line x1="150" y1="320" x2="1050" y2="320" stroke="#6f5a49" stroke-width="4"/>
<circle cx="240" cy="320" r="18" fill="#b88a55"/><text x="185" y="275" font-size="21">用户限制</text><text x="185" y="375" font-size="19">order 1</text>
<circle cx="470" cy="320" r="18" fill="#b88a55"/><text x="405" y="275" font-size="21">工具调用 A</text><text x="415" y="375" font-size="19">order 2</text>
<circle cx="700" cy="320" r="18" fill="#c45b49"/><text x="640" y="275" font-size="21">用户补充</text><text x="645" y="375" font-size="19">order 3</text>
<circle cx="930" cy="320" r="18" fill="#c45b49"/><text x="855" y="275" font-size="21">助手结果 B</text><text x="875" y="375" font-size="19">order 4</text>
<rect x="130" y="425" width="420" height="80" rx="14" fill="#efe7da"/><text x="155" y="462" font-size="20" font-weight="700">物理写入顺序</text><text x="155" y="492" font-size="18">可能与逻辑顺序不同</text>
<rect x="650" y="425" width="420" height="80" rx="14" fill="#f3d9a6"/><text x="675" y="462" font-size="20" font-weight="700">rollback 边界</text><text x="675" y="492" font-size="18">按逻辑顺序移除后续证据</text>
<text x="60" y="610" font-size="22" font-weight="700">合成摘要不能被当成一次真实用户输入。</text>
<text x="60" y="660" font-size="18" fill="#5d5148">教学图。机制依据 OpenAI Codex PR 48779。</text>
</g></svg>