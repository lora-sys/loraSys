<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F5EDDE"/><rect width="930" height="900" fill="#1C1816"/><g font-family="Noto Sans CJK SC, Arial, sans-serif"><text x="68" y="108" fill="#E1A341" font-size="28">GITHUB AGENTIC WORKFLOWS</text><text x="64" y="242" fill="#FCF8EF" font-size="76" font-weight="700">一个靠谱的 Agent</text><text x="64" y="350" fill="#E1A341" font-size="76" font-weight="700">今天可能不改代码</text><text x="68" y="430" fill="#DAD0C1" font-size="33">先读 80 行，判断值不值得做。</text><text x="68" y="480" fill="#DAD0C1" font-size="33">不值得就停止，不为了产出硬开 PR。</text><rect x="68" y="550" width="235" height="142" rx="24" fill="#2B2521" stroke="#685546" stroke-width="2"/><text x="90" y="605" fill="#FCF8EF" font-size="31" font-weight="700">候选文件</text><text x="90" y="655" fill="#DAD0C1" font-size="23">每天只处理 1 个</text><rect x="338" y="550" width="235" height="142" rx="24" fill="#2B2521" stroke="#685546" stroke-width="2"/><text x="360" y="605" fill="#FCF8EF" font-size="31" font-weight="700">快速 triage</text><text x="360" y="655" fill="#DAD0C1" font-size="23">先读前 80 行</text><rect x="608" y="550" width="235" height="142" rx="24" fill="#543A2A" stroke="#8A654C" stroke-width="2"/><text x="630" y="605" fill="#E1A341" font-size="31" font-weight="700">noop</text><text x="630" y="655" fill="#E4D4C3" font-size="23">没必要改就停止</text><text x="68" y="806" fill="#B8AA99" font-size="20">github/gh-aw · MIT · 2026.09.13 核验</text><text x="68" y="848" fill="#827466" font-size="20">jsweep：小范围、先筛选、无改动也算正常结果</text><rect x="930" y="0" width="670" height="900" fill="#F5EDDE"/><rect x="1055" y="72" width="450" height="690" rx="105" fill="#E8D8BE" stroke="#694C39" stroke-width="3"/><circle cx="1280" cy="315" r="158" fill="#30251F"/><circle cx="1382" cy="205" r="77" fill="#30251F"/><ellipse cx="1270" cy="390" rx="136" ry="156" fill="#F0C7A6"/><path d="M1138 352 Q1156 212 1270 225 Q1405 230 1400 382 Q1345 325 1282 320 Q1200 316 1138 352Z