<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#F4EFE6"/><text x="55" y="70" font-family="sans-serif" font-size="38" font-weight="700" fill="#1F1A17">Vault 和 Credential Broker 分别解决什么</text><rect x="55" y="125" width="510" height="485" rx="28" fill="#FFF9F1" stroke="#332B26" stroke-width="3"/><text x="90" y="180" font-family="sans-serif" font-size="28" font-weight="700" fill="#9B641E">服务侧连接：用 Vault</text><text x="90" y="230" font-family="sans-serif" font-size="22" fill="#332B26">服务直接连接远程 MCP</text><rect x="110" y="280" width="140" height="90" rx="18" fill="#E9DED0"/><text x="145" y="335" font-family="sans-serif" font-size="24" fill="#332B26">Agent</text><path d="M255 325 L340 325" stroke="#9B641E" stroke-width="8"/><polygon points="340,325 315,310 315,340" fill="#9B641E"/><rect x="350" y="260" width="155" height="130" rx="18" fill="#E2C38A"/><text x="390" y="310" font-family="sans-serif" font-size="24" font-weight="700" fill="#332B26">Vault</text><text x="372" y="350" font-family="sans-serif" font-size="18" fill="#332B26">MCP 凭据</text><text x="90" y="445" font-family="sans-serif" font-size="22" fill="#332B26">Agent 使用认证工具</text><text x="90" y="485" font-family="sans-serif" font-size="22" fill="#332B26">但不接收原始 secret</text><rect x="635" y="125" width="510" height="485" rx="28" fill="#E9DED0" stroke="#332B26" stroke-width="3"/><text x="670" y="180" font-family="sans-serif" font-size="28" font-weight="700" fill="#8C3D24">sandbox 发请求：用 Broker</text><text x="670" y="230" font-family="sans-serif" font-size="22" fill="#332B26">生成代码主动访问第三方 API</text><rect x="690" y="280" width="140" height="90" rx="18" fill="#FFF9F1"/><text x="712" y="335" font-family="sans-serif" font-size="22" fill="#332B26">sandbox</text><path d="M835 325 L920 325" stroke="#9B641E" stroke-width="8"/><polygon points="920,325 895,310 895,340" fill="#9B641E"/><rect x="930" y="255" width="165" height="140" rx="18" fill="#C99542"/><text x="955" y="307" font-family="sans-serif" font-size="22" font-weight="700" fill="#1F1A17">Credential</text><text x="975" y="342" font-family="sans-serif" font-size="22" font-weight="700" fill="#1F1A17">Broker</text><text x="670" y="445" font-family="sans-serif" font-size="22" fill="#332B26">校验目标和策略</text><text x="670" y="485" font-family="sans-serif" font-size="22" fill="#332B26">在出站边界注入 secret</text><rect x="220" y="630" width="760" height="45" rx="18" fill="#332B26"/><text x="320" y="660" font-family="sans-serif" font-size="24" font-weight="700" fill="#F4EFE6">连接从哪里发起，决定凭据放在哪里</text></svg>