<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#F4EFE6" /><text x="60" y="70" font-family="sans-serif" font-size="35" font-weight="700" fill="#1F1A17">Why agents should not receive raw production secrets</text><rect x="55" y="115" width="505" height="500" rx="28" fill="#E9DED0" stroke="#332B26" stroke-width="3" /><text x="90" y="165" font-family="sans-serif" font-size="28" font-weight="700" fill="#8C3D24">The wrong approach</text><rect x="95" y="205" width="420" height="115" rx="18" fill="#FFF9F1" /><text x="125" y="248" font-family="monospace" font-size="24" fill="#332B26">GITHUB_TOKEN = ghp_...</text><text x="125" y="285" font-family="monospace" font-size="24" fill="#332B26">DB_PASSWORD = ...</text><text x="95" y="365" font-family="sans-serif" font-size="26" fill="#332B26">Secrets enter the sandbox</text><text x="95" y="410" font-family="sans-serif" font-size="26" fill="#332B26">Generated code can read them</text><text x="95" y="455" font-family="sans-serif" font-size="26" fill="#332B26">More ways for secrets to leak</text><rect x="640" y="115" width="505" height="500" rx="28" fill="#FFF9F1" stroke="#332B26" stroke-width="3" /><text x="680" y="165" font-family="sans-serif" font-size="28" font-weight="700" fill="#9B641E">A more reliable approach</text><rect x="680" y="205" width="180" height="115" rx="18" fill="#E7DED3" /><text x="710" y="250" font-family="sans-serif" font-size="24" fill="#332B26">sandbox</text><text x="710" y="285" font-family="monospace" font-size="20" fill="#332B26">placeholder</text><path d="M870 260 L950 260" stroke="#9B641E" stroke-width="8" /><polygon points="950,260 925,245 925,275" fill="#9B641E" /><rect x="965" y="200" width="135" height="125" rx="18" fill="#C99542" /><text x="987" y="245" font-family="sans-serif" font-size="16.5" font-weight="700" fill="#1F1A17"><tspan x="987" dy="0">Credential</tspan><tspan x="987" dy="19.5">broker</tspan></text><text x="985" y="285" font-family="sans-serif" font-size="18" fill="#1F1A17"><tspan x="985" dy="0">Outbound</tspan><tspan x="985" dy="21.2">injection</tspan></text><text x="680" y="375" font-family="sans-serif" font-size="26" fill="#332B26">Real secrets stay outside</text><text x="680" y="420" font-family="sans-serif" font-size="22.5" fill="#332B26">Inject only for approved destinations</text><text x="680" y="465" font-family="sans-serif" font-size="24.5" fill="#332B26">The agent never reads raw values</text><text x="60" y="660" font-family="sans-serif" font-size="23" font-weight="700" fill="#6B503D">The key boundary: permission to use credentials is not permission to read them</text></svg>