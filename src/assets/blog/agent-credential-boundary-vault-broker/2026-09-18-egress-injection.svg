<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#F4EFE6"/><text x="55" y="68" font-family="sans-serif" font-size="38" font-weight="700" fill="#1F1A17">密钥怎样在出站边界被使用</text><g font-family="sans-serif" fill="#332B26"><rect x="55" y="150" width="190" height="330" rx="24" fill="#FFF9F1" stroke="#332B26" stroke-width="3"/><text x="92" y="205" font-size="27" font-weight="700">1 sandbox</text><text x="92" y="265" font-size="22">Agent 代码</text><text x="92" y="315" font-size="20">placeholder</text><text x="92" y="355" font-size="20">HTTPS 请求</text><rect x="315" y="150" width="220" height="330" rx="24" fill="#E9DED0" stroke="#332B26" stroke-width="3"/><text x="355" y="205" font-size="27" font-weight="700">2 边界检查</text><text x="355" y="265" font-size="22">目标域名</text><text x="355" y="310" font-size="22">请求方法</text><text x="355" y="355" font-size="22">策略允许</text><rect x="605" y="150" width="225" height="330" rx="24" fill="#E2C38A" stroke="#332B26" stroke-width="3"/><text x="642" y="205" font-size="27" font-weight="700">3 注入凭据</text><text x="642" y="270" font-size="22">Authorization</text><text x="642" y="320" font-size="20">真实 Token</text><text x="642" y="365" font-size="20">只在外部层出现</text><rect x="900" y="150" width="245" height="330" rx="24" fill="#FFF9F1" stroke="#332B26" stroke-width="3"/><text x="938" y="205" font-size="27" font-weight="700">4 外部 API</text><text x="938" y="275" font-size="22">批准目标</text><text x="938" y="325" font-size="22">执行请求</text><text x="938" y="375" font-size="22">返回结果</text></g><g stroke="#9B641E" stroke-width="8" fill="#9B641E"><line x1="245" y1="315" x2="310" y2="315"/><polygon points="310,315 285,300 285,330"/><line x1="535" y1="315" x2="600" y2="315"/><polygon points="600,315 575,300 575,330"/><line x1="830" y1="315" x2="895" y2="315"/><polygon points="895,315 870,300 870,330"/></g><rect x="230" y="535" width="735" height="90" rx="24" fill="#332B26"/><text x="290" y="590" font-family="sans-serif" font-size="27" font-weight="700" fill="#F4EFE6">密钥不进 sandbox，只在批准的出站请求上使用</text></svg>