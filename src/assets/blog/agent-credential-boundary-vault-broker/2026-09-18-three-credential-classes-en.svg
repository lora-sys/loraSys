<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#F4EFE6" /><text x="55" y="70" font-family="sans-serif" font-size="35" font-weight="700" fill="#1F1A17">Keep three credential types in separate environments</text><g font-family="sans-serif" fill="#332B26"><rect x="55" y="135" width="320" height="435" rx="26" fill="#FFF9F1" stroke="#332B26" stroke-width="3" /><text x="90" y="190" font-size="26.5" font-weight="700">Application keys</text><text x="90" y="240" font-size="22"><tspan x="90" dy="0">Outside the execution</tspan><tspan x="90" dy="26.0">sandbox</tspan></text><text x="90" y="295" font-size="20.5">Purpose: create sessions</text><text x="90" y="335" font-size="22">Call models</text><text x="90" y="375" font-size="22">Manage vaults</text><text x="90" y="440" font-size="20.5" fill="#8C3D24">Keep out of the sandbox</text><rect x="440" y="135" width="320" height="435" rx="26" fill="#E9DED0" stroke="#332B26" stroke-width="3" /><text x="475" y="190" font-size="28" font-weight="700">Executor keys</text><text x="475" y="240" font-size="17">Location: inside the sandbox</text><text x="475" y="285" font-size="21"><tspan x="475" dy="0">Purpose: connect the</tspan><tspan x="475" dy="24.8">execution environment</tspan></text><text x="475" y="350" font-size="17">Permissions must be limited</text><text x="475" y="390" font-size="17">Cannot authorize other APIs</text><text x="475" y="455" font-size="17" fill="#9B641E">Readable by generated code</text><rect x="825" y="135" width="320" height="435" rx="26" fill="#E2C38A" stroke="#332B26" stroke-width="3" /><text x="860" y="175" font-size="28" font-weight="700"><tspan x="860" dy="0">Third-party</tspan><tspan x="860" dy="33.0">credentials</tspan></text><text x="860" y="240" font-size="21">Location: vault or proxy</text><text x="860" y="295" font-size="22">GitHub token</text><text x="860" y="335" font-size="22">Cloud API key</text><text x="860" y="375" font-size="22">Database credentials</text><text x="860" y="440" font-size="20.5" fill="#6B503D"><tspan x="860" dy="0">Authorize by destination</tspan><tspan x="860" dy="24.2">and purpose</tspan></text></g><rect x="250" y="610" width="700" height="55" rx="20" fill="#332B26" /><text x="330" y="647" font-family="sans-serif" font-size="21" font-weight="700" fill="#F4EFE6">Different purposes, locations, and permissions</text></svg>