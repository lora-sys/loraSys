<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#F4EFE6"/><text x="55" y="70" font-family="sans-serif" font-size="38" font-weight="700" fill="#1F1A17">三类凭据不要放在同一个环境里</text><g font-family="sans-serif" fill="#332B26"><rect x="55" y="135" width="320" height="435" rx="26" fill="#FFF9F1" stroke="#332B26" stroke-width="3"/><text x="90" y="190" font-size="28" font-weight="700">应用密钥</text><text x="90" y="240" font-size="22">位置：控制面外部</text><text x="90" y="295" font-size="22">用途：创建 Session</text><text x="90" y="335" font-size="22">调用模型</text><text x="90" y="375" font-size="22">管理 Vault</text><text x="90" y="440" font-size="22" fill="#8C3D24">不要放进 sandbox</text><rect x="440" y="135" width="320" height="435" rx="26" fill="#E9DED0" stroke="#332B26" stroke-width="3"/><text x="475" y="190" font-size="28" font-weight="700">执行器密钥</text><text x="475" y="240" font-size="22">位置：sandbox 内</text><text x="475" y="295" font-size="22">用途：连接执行环境</text><text x="475" y="335" font-size="22">权限必须受限</text><text x="475" y="375" font-size="22">不能授权其它 API</text><text x="475" y="440" font-size="22" fill="#9B641E">可被生成代码读取</text><rect x="825" y="135" width="320" height="435" rx="26" fill="#E2C38A" stroke="#332B26" stroke-width="3"/><text x="860" y="190" font-size="28" font-weight="700">第三方凭据</text><text x="860" y="240" font-size="22">位置：Vault 或代理</text><text x="860" y="295" font-size="22">GitHub Token</text><text x="860" y="335" font-size="22">云 API Key</text><text x="860" y="375" font-size="22">数据库凭据</text><text x="860" y="440" font-size="22" fill="#6B503D">按目标与用途授权</text></g><rect x="250" y="610" width="700" height="55" rx="20" fill="#332B26"/><text x="330" y="647" font-family="sans-serif" font-size="25" font-weight="700" fill="#F4EFE6">不同用途，不同位置，不同权限</text></svg>