<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">loraSys build and publishing map</title>
  <desc id="desc">Markdown and structured data flow through Astro Theme Pure and build-time GitHub snapshots into a static GitHub Pages site.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f2eb"/><stop offset="1" stop-color="#ebe7df"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd3e2d"/></marker>
  </defs>
  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <text x="56" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" letter-spacing="3" fill="#6d6a64">LORASYS / STATIC BY DESIGN</text>
  <text x="56" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="38" font-weight="700" fill="#1d1c1a">Content becomes a site, not a runtime.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="56" y="150" width="220" height="150" rx="16" fill="#fffdf9" stroke="#c9c2b8"/><text x="78" y="184" font-size="16" fill="#bd3e2d">01 / SOURCE</text><text x="78" y="220" font-size="24" font-weight="700" fill="#1d1c1a">Content</text><text x="78" y="251" font-size="18" fill="#6d6a64">Markdown · TS · JSON</text><text x="78" y="279" font-size="16" fill="#6d6a64">articles, notes, projects</text>
    <rect x="354" y="150" width="220" height="150" rx="16" fill="#1d1c1a"/><text x="376" y="184" font-size="16" fill="#74e38e">02 / COMPOSE</text><text x="376" y="220" font-size="24" font-weight="700" fill="#fffdf9">Astro + Pure</text><text x="376" y="251" font-size="18" fill="#c9c2b8">editorial routes · TOC</text><text x="376" y="279" font-size="16" fill="#c9c2b8">search · RSS · sitemap</text>
    <rect x="652" y="150" width="220" height="150" rx="16" fill="#fffdf9" stroke="#c9c2b8"/><text x="674" y="184" font-size="16" fill="#bd3e2d">03 / SNAPSHOT</text><text x="674" y="220" font-size="24" font-weight="700" fill="#1d1c1a">Build-time data</text><text x="674" y="251" font-size="18" fill="#6d6a64">GitHub REST / GraphQL</text><text x="674" y="279" font-size="16" fill="#6d6a64">projects · contributions</text>
    <rect x="950" y="150" width="194" height="150" rx="16" fill="#223b2c"/><text x="972" y="184" font-size="16" fill="#74e38e">04 / PUBLISH</text><text x="972" y="220" font-size="24" font-weight="700" fill="#fffdf9">GitHub Pages</text><text x="972" y="251" font-size="18" fill="#d4e4d7">static dist/</text><text x="972" y="279" font-size="16" fill="#d4e4d7">/loraSys · HTTPS</text>
  </g>
  <path d="M282 225H344" stroke="#bd3e2d" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 225H642" stroke="#bd3e2d" stroke-width="3" marker-end="url(#arrow)"/><path d="M878 225H940" stroke="#bd3e2d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M56 354H1144" stroke="#b9b2a7"/><text x="56" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#6d6a64">push main → install with Bun → refresh cached snapshots → build → deploy</text>
</svg>
