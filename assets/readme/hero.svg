<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%">
  <defs>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c6412c" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e0483a"/>
      <stop offset="100%" stop-color="#c6412c" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#c4b4a0"/>
    </linearGradient>
    <filter id="inkBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <pattern id="dotGrid" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.35" fill="#c6412c" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="#0a0808" rx="0"/>

  <!-- Subtle dot texture -->
  <rect width="1200" height="380" fill="url(#dotGrid)" rx="0"/>

  <!-- Left side content -->
  <g transform="translate(60, 50)">
    <!-- Magazine masthead: "墨 刊" -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="38" height="38" rx="0" fill="none" stroke="#c6412c" stroke-width="1.5" opacity="0.6"/>
      <text x="19" y="26" font-family="'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif" font-size="20" fill="#c6412c" text-anchor="middle" font-weight="900">墨</text>
      <text x="48" y="26" font-family="'Noto Serif SC', serif" font-size="13" fill="#c6412c" opacity="0.5" letter-spacing="4">墨刊</text>
      <text x="48" y="38" font-family="ui-monospace, monospace" font-size="9" fill="#c6412c" opacity="0.3" letter-spacing="2">INK EDITION · 2026</text>
    </g>

    <!-- Edition line -->
    <text x="0" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#c6412c" opacity="0.4" letter-spacing="3">在建造中记录</text>

    <!-- Main title — lora -->
    <text x="2" y="145" font-family="'Fraunces', 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', serif" font-size="76" font-weight="900" fill="url(#titleGrad)" letter-spacing="2">lora</text>

