<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="FDE 真实项目的公开证据浏览器，汇总生产 Agent、企业部署和中国案例的结果、实施机制与证据边界。"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>FDE 真实项目证据浏览器</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f6f5f1;--panel:#fff;--ink:#18201d;--muted:#68716d;--line:#d7d8d2;--accent:#295f57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:940px;margin:auto;padding:20px}h1{font-size:clamp(23px,4vw,34px);margin:0 0 6px}.lead,.note{color:var(--muted);line-height:1.6}.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}.filter{font:inherit;white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:999px;padding:9px 13px;cursor:pointer}.filter[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}.filter:focus-visible{outline:3px solid #d59c55;outline-offset:2px}.case{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.case h2{font-size:22px;margin:0 0 8px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}.metric{border:1px solid var(--line);border-radius:12px;padding:11px}.metric b{display:block;font-size:22px}.flow{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.step{border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px}.source{font-size:12px;color:var(--muted)}@media(max-width:650px){main{padding:15px}.metrics{grid-template-columns:1fr}.case h2{font-size:20px}}@media(prefers-color-scheme:dark){:root{--bg:#171b19;--panel:#202622;--ink:#f1f2ed;--muted:#aeb6b1;--line:#3b4540;--accent:#70b5a8}.filter[aria-pressed=true]{color:#10211d}}
</style></head><body><main><h1>FDE 真实项目证据浏览器</h1><p class="lead">站点重建版，非 Notion 原附件。点击案例查看公开结果、实施机制和证据边界。指标均来自公司或项目方公开披露，不等于第三方审计。</p><div class="filters" role="toolbar" aria-label="案例选择"><button class="filter" aria-pressed="true" data-i="0">OpenAI Presence</button><button class="filter" aria-pressed="false" data-i="1">John Deere</button><button class="filter" aria-pressed="false" data-i="2">DXC OASIS</button><button class="filter" aria-pressed="false" data-i="3">跨境电商</button><button class="filter" aria-pressed="false" data-i="4">零售对账</button><button class="filter" aria-pressed="false" data-i="5">制造业</button></div><article class="case" aria-live="polite"><h2 id="title"></h2><p id="summary"></p><div class="metrics" id="metrics"></div><div class="flow" id="flow"></div><p class="source" id="source"></p></article><p class="note">读法：先看结果，再看它依赖的系统接入、Eval、数据治理或现场流程。FDE 的工作量通常不止模型调用本身。</p></main><script>
const data=[
{title:'OpenAI Presence',summary:'OpenAI 英文电话支持中的生产 Agent。上线后继续用生产会话和人工升级记录做改进。',metrics:[['75%','入站问题无需人工处理'],['15 个百分点','10 天内人工转接率下降']],flow:['限定 Job','接知识与账户上下文','定义可批准动作','上线','读失败样本','回归测试再发布'],source:'来源：OpenAI Presence。公司自报。'},
{title:'John Deere × OpenAI',summary:'团队先与领域专家审查数百个真实样本，建立自定义 Eval，再迭代推荐系统。',metrics:[['6 倍','客户互动提升'],['70%','化学品使用减少']],flow:['领域样本','自定义 Eval','快速迭代','生产部署'],source:'来源：OpenAI Deployment Company / deploy.co。公司自报。'},
{title:'DXC OASIS × Anthropic',summary:'DXC 先在内部生产验证，再训练和认证工程师，由 FDE 进入联合客户。',metrics:[['约 10 倍','软件交付加速'],['>95%','代码由 Claude 生成后人工审查'],['50+','联合客户生产运行']],flow:['Customer Zero','内部生产验证','90 天认证','FDE 入场','行业复制'],source:'来源：DXC × Anthropic 联盟公告。公司自报。'},
{title:'Datawhale FDE100：跨境电商',summary:'连接库存、物流、补货和广告数据，重点是跨系统数据孤岛和流程。',metrics:[['约 4 小时/天','物流信息处理时间减少'],['约 3000','年新增 SKU 规模']],flow:['接多系统数据','统一信息','自动化处理','业务复核'],source:'来源：Datawhale FDE100。项目方自报。'},
{title:'Datawhale FDE100：线下零售对账',summary:'把纸质单据、收银系统和商场结算系统做三源交叉核对，并按差异分级。',metrics:[['1 至 2 人天','原周期工作量'],['数小时','上线后周期'],['70% 至 80%','项目方估算效率提升']],flow:['OCR / 视觉识别','三源交叉核对','差异分级','人工处理异常'],source:'来源：Datawhale FDE100 案例 015。项目方自报。'},
{title:'创新奇智：制造业 FDE',summary:'公司判断工业智能体落地的大部分工作仍在业务逻辑、数据治理、模型选择和算力优化。',metrics:[['30% 至 40%','软件开发占整体落地工作量']],flow:['头部客户 0→1','FDE 现场攻坚','沉淀平台资产','形成行业套件','同类客户 1→N'],source:'来源：创新奇智公开访谈。公司自报。'}
];const buttons=[...document.querySelectorAll('.filter')],title=document.querySelector('#title'),summary=document.querySelector('#summary'),metrics=document.querySelector('#metrics'),flow=document.querySelector('#flow'),source=document.querySelector('#source');function render(i,focus=false){buttons.forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));const x=data[i];title.textContent=x.title;summary.textContent=x.summary;metrics.replaceChildren(...x.metrics.map(([a,b])=>{const el=document.createElement('div');el.className='metric';const strong=document.createElement('b');strong.textContent=a;const span=document.createElement('span');span.textContent=b;el.append(strong,span);return el}));flow.replaceChildren(...x.flow.map(t=>{const el=document.createElement('span');el.className='step';el.textContent=t;return el}));source.textContent=x.source;if(focus)buttons[i].focus()}buttons.forEach((b,i)=>{b.addEventListener('click',()=>render(i));b.addEventListener('keydown',e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%buttons.length;else if(e.key==='ArrowLeft')n=(i-1+buttons.length)%buttons.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=buttons.length-1;else return;e.preventDefault();render(n,true)})});render(0);
</script></body></html>
