<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">四月是你的谎言收藏卡</title>
  <desc id="desc">以樱花、钢琴键和流动乐谱表达春日记忆的原创视觉卡片。</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff2ff"/><stop offset="1" stop-color="#fff3e8"/></linearGradient><linearGradient id="petal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f18ba7"/><stop offset="1" stop-color="#fff2e5"/></linearGradient></defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <path d="M-20 170 C230 40 370 300 520 170 S820 40 1220 150" fill="none" stroke="#7188b7" stroke-width="4" opacity=".55"/>
  <path d="M-20 250 C230 120 370 380 520 250 S820 120 1220 230" fill="none" stroke="#7188b7" stroke-width="2" opacity=".4"/>
  <g fill="url(#petal)" opacity=".85"><circle cx="170" cy="170" r="18"/><circle cx="230" cy="260" r="11"/><circle cx="940" cy="180" r="16"/><circle cx="1030" cy="300" r="12"/><circle cx="790" cy="100" r="9"/></g>
  <g fill="#34415d" opacity=".85"><rect x="120" y="470" width="960" height="26" rx="5"/><rect x="145" y="505" width="55" height="170"/><rect x="1000" y="505" width="55" height="170"/></g>
  <g fill="#fafafa"><rect x="220" y="495" width="72" height="170"/><rect x="300" y="495" width="72" height="170"/><rect x="380" y="495" width="72" height="170"/><rect x="460" y="495" width="72" height="170"/><rect x="540" y="495" width="72" height="170"/><rect x="620" y="495" width="72" height="170"/><rect x="700" y="495" width="72" height="170"/><rect x="780" y="495" width="72" height="170"/><rect x="860" y="495" width="72" height="170"/></g>
  <text x="78" y="106" fill="#53627e" font-family="sans-serif" font-size="34" letter-spacing="8">ANIME ARCHIVE / 02</text>
  <text x="78" y="710" fill="#34415d" font-family="sans-serif" font-size="61" font-weight="700">四月是你的谎言</text>
  <text x="82" y="760" fill="#7188b7" font-family="sans-serif" font-size="27" letter-spacing="4">有些旋律，会把青春重新点亮。</text>
</svg>
