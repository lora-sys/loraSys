name: Export pinned audit inputs
on:
  push:
    branches: [audit/i18n-zhihu-20260909]
    paths: [.github/workflows/export-audit-inputs.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0ab4b21c9373bb6adf56cf93bda7bbb51009e8e5
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: lora-sys/zhihu-threads
          ref: 461a130fd00b24551648775757c55df2f84722a7
          persist-credentials: false
          path: threads
      - name: Package tracked public files without Git credentials
        run: |
          mkdir -p "$RUNNER_TEMP/audit-inputs"
          git -C site archive --format=tar.gz HEAD > "$RUNNER_TEMP/audit-inputs/site-source.tar.gz"
          git -C threads archive --format=tar.gz HEAD > "$RUNNER_TEMP/audit-inputs/threads-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-audit-inputs
          path: ${{ runner.temp }}/audit-inputs
          retention-days: 7
