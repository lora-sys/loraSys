name: Verify Notion article sync

on:
  push:
    branches:
      - verify/notion-sync-20260918-tool-search

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check content schema
        run: bun run check
      - name: Build production site
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: bun run build
      - name: Verify article assets and rendered output
        run: |
          test -f src/content/blog/agent-tool-search-mcp-ard.md
          test -f src/assets/blog/agent-tool-search-mcp-ard/2026-09-17-tool-search-flow.svg
          test -f src/assets/blog/agent-tool-search-mcp-ard/2026-09-17-defer-loading-cache.svg
          test -f src/assets/blog/agent-tool-search-mcp-ard/2026-09-17-mcp-toolsearch-ard.svg
          test -f src/assets/blog/agent-tool-search-mcp-ard/2026-09-17-tool-search-experiment.svg
          test -f dist/blog/agent-tool-search-mcp-ard/index.html
          grep -q "Tool Search" dist/blog/agent-tool-search-mcp-ard/index.html
      - name: Install browser
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install chromium
      - name: Check desktop and mobile rendering
        run: |
          mkdir -p /tmp/site
          cp -a dist /tmp/site/loraSys
          python3 -m http.server 4321 --directory /tmp/site >/tmp/site.log 2>&1 &
          cat > browser-check.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({headless: true})
          const url = 'http://127.0.0.1:4321/loraSys/blog/agent-tool-search-mcp-ard/'
          for (const [name, viewport] of Object.entries({desktop:{width:1280,height:900},mobile:{width:390,height:844}})) {
            const page = await browser.newPage({ viewportSize: viewport })
            const response = await page.goto(url, { waitUntil: 'networkidle' })
            if (!response || response.status() !== 200) throw new Error(`${name}: article status ${response?.status()}`)
            const title = await page.locator('h1').first().textContent()
            if (!title?.includes('Tool Search')) throw new Error(`${name}: wrong title`)
            const articleText = await page.locator('article').first().textContent()
            if (!articleText?.includes('MCP、Tool Search 和 ARD')) throw new Error(`${name}: article body missing`)
            const imgs = page.locator('article img')
            const count = await imgs.count()
            if (count < 4) throw new Error(`${name}: expected at least 4 article images, got ${count}`)
            for (let i = 0; i < count; i++) {
              const ok = await imgs.nth(i).evaluate(img => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0)
              if (!ok) throw new Error(`${name}: image ${i + 1} failed to decode`)
            }
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1)
            if (overflow) throw new Error(`${name}: horizontal overflow`)
            await page.screenshot({ path: `/tmp/${name}.png`, fullPage: true })
            await page.close()
          }
          await browser.close()
          EOF
          node browser-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: notion-sync-render-check
          path: |
            /tmp/desktop.png
            /tmp/mobile.png
