name: Verify published Notion article

on:
  push:
    branches:
      - verify/notion-sync-20260918-tool-search

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install browser
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install chromium
      - name: Check live article on desktop and mobile
        run: |
          cat > live-check.mjs <<'EOF'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({headless: true})
          const url = 'https://lora-sys.github.io/loraSys/blog/agent-tool-search-mcp-ard/'
          const expected = [
            '全部预加载与按需加载的区别',
            'defer_loading 与稳定缓存前缀',
            'ARD、MCP 与 Tool Search 的职责分层',
            'Tool Search 对照实验'
          ]
          for (const [name, viewport] of Object.entries({desktop:{width:1280,height:900},mobile:{width:390,height:844}})) {
            const page = await browser.newPage({ viewportSize: viewport })
            const failed = []
            page.on('requestfailed', request => failed.push(`${request.url()} :: ${request.failure()?.errorText}`))
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 })
            if (!response || response.status() !== 200) throw new Error(`${name}: article status ${response?.status()}`)
            const title = await page.locator('h1').first().textContent()
            if (!title?.includes('Tool Search')) throw new Error(`${name}: wrong title`)
            for (const needle of expected) {
              const image = page.locator(`article img[alt*="${needle}"]`).first()
              if (await image.count() !== 1) throw new Error(`${name}: missing expected image: ${needle}`)
              await image.scrollIntoViewIfNeeded()
              const handle = await image.elementHandle()
              await page.waitForFunction(el => el.complete, handle, { timeout: 10000 })
              const state = await image.evaluate(img => ({complete: img.complete, width: img.naturalWidth, height: img.naturalHeight, src: img.currentSrc || img.src}))
              console.log(`${name} ${needle}`, JSON.stringify(state))
              if (!(state.complete && state.width > 0 && state.height > 0)) throw new Error(`${name}: image failed to decode: ${needle} :: ${state.src}`)
            }
            const relevantFailures = failed.filter(x => x.includes('/loraSys/'))
            if (relevantFailures.length) throw new Error(`${name}: failed site requests ${JSON.stringify(relevantFailures)}`)
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1)
            if (overflow) throw new Error(`${name}: horizontal overflow`)
            await page.screenshot({ path: `/tmp/live-${name}.png`, fullPage: true })
            await page.close()
          }
          await browser.close()
          EOF
          node live-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: notion-sync-live-check
          path: |
            /tmp/live-desktop.png
            /tmp/live-mobile.png
