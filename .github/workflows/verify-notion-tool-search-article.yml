name: Verify Notion article sync

on:
  push:
    branches: [sync/notion-2026-09-18-tool-search]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check content
        run: bun run check

      - name: Build site
        run: NODE_OPTIONS=--max-old-space-size=3072 bun run build

      - name: Start preview and wait for article
        shell: bash
        run: |
          bun run preview --host 127.0.0.1 > /tmp/lora-preview.log 2>&1 &
          echo $! > /tmp/lora-preview.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4321/loraSys/blog/agent-tool-search-mcp-ard > /tmp/article.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lora-preview.log
          exit 1

      - name: Verify article and original illustrations
        shell: bash
        run: |
          grep -q 'Agent 工具越接越多' /tmp/article.html
          grep -q '2026-09-17-tool-search-flow' /tmp/article.html
          grep -q '2026-09-17-defer-loading-cache' /tmp/article.html
          grep -q '2026-09-17-mcp-toolsearch-ard' /tmp/article.html
          grep -q '2026-09-17-tool-search-experiment' /tmp/article.html

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture desktop and mobile article views
        shell: bash
        run: |
          npx --yes playwright@1.55.0 screenshot --full-page --browser=chromium --viewport-size="1440,900" http://127.0.0.1:4321/loraSys/blog/agent-tool-search-mcp-ard /tmp/notion-sync-desktop.png
          npx --yes playwright@1.55.0 screenshot --full-page --browser=chromium --viewport-size="390,844" http://127.0.0.1:4321/loraSys/blog/agent-tool-search-mcp-ard /tmp/notion-sync-mobile.png

      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lora-preview.pid ]; then
            kill "$(cat /tmp/lora-preview.pid)" 2>/dev/null || true
          fi

      - name: Upload verification screenshots
        uses: actions/upload-artifact@v4
        with:
          name: notion-tool-search-article-preview
          path: |
            /tmp/notion-sync-desktop.png
            /tmp/notion-sync-mobile.png
          if-no-files-found: error
