name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    name: Sync and quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run sync:github
      - name: Validate synced data
        run: bun run validate:sync
      - name: Write sync audit summary
        run: bun scripts/write-actions-summary.mjs
      - name: Package verified snapshots
        run: tar -czf sync-data.tar.gz src/data/github-projects.json src/data/external-contributions.json src/data/contributions.json src/data/sync-report.json
      - name: Upload verified snapshots
        uses: actions/upload-artifact@v4
        with:
          name: verified-sync-data
          path: sync-data.tar.gz
          if-no-files-found: error

  build:
    name: Build verified site
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download verified snapshots
        uses: actions/download-artifact@v4
        with:
          name: verified-sync-data
          path: /tmp/verified-sync-data
      - name: Restore verified snapshots
        run: tar -xzf /tmp/verified-sync-data/sync-data.tar.gz
      - name: Run site quality check
        run: bun run check
      - name: Build site
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
