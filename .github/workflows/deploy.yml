name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const https = require('https');
            const fs = require('fs');
            const query = JSON.stringify({
              query: \`
                query(\$login: String!) {
                  user(login: \$login) {
                    contributionsCollection {
                      contributionCalendar {
                        totalContributions
                        weeks {
                          contributionDays {
                            date
                            contributionCount
                          }
                        }
                      }
                    }
                  }
                }
              \`,
              variables: { login: 'lora-sys' }
            });
            const options = {
              hostname: 'api.github.com',
              path: '/graphql',
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN,
                'Content-Type': 'application/json',
                'User-Agent': 'loraSys-deploy'
              }
            };
            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                const json = JSON.parse(data);
                if (json.errors) {
                  console.error('GraphQL errors:', JSON.stringify(json.errors));
                  process.exit(1);
                }
                const calendar = json.data.user.contributionsCollection.contributionCalendar;
                const output = {
                  totalContributions: calendar.totalContributions,
                  lastUpdated: new Date().toISOString(),
                  weeks: calendar.weeks
                };
                fs.mkdirSync('src/lib/data', { recursive: true });
                fs.writeFileSync('src/lib/data/contributions.json', JSON.stringify(output, null, 2));
                console.log('Fetched ' + calendar.totalContributions + ' contributions across ' + calendar.weeks.length + ' weeks');
              });
            });
            req.on('error', (e) => { console.error(e); process.exit(1); });
            req.write(query);
            req.end();
          "

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Build for GitHub Pages
        run: pnpm run build:github

      - name: Verify build output
        run: |
          ls -la build/
          test -f build/index.html || (echo "Build failed: index.html not found" && exit 1)
          echo "✅ Build verified successfully"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
