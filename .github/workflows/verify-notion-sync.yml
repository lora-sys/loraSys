name: Verify Notion article candidate

on:
  push:
    branches: [verify/notion-sync-20260917-session-context]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate and check
        run: |
          bun run validate:sync
          bun run check
      - name: Build production output
        run: bun run build
      - name: Install Chromium test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/notion-sync-browser" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/notion-sync-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/notion-sync-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify new article on desktop and mobile
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createServer } from 'node:http'
          import { readFile, stat } from 'node:fs/promises'
          import path from 'node:path'
          import { pathToFileURL } from 'node:url'

          const dist = path.resolve('dist')
          const home = await readFile(path.join(dist, 'index.html'), 'utf8')
          const attrs = (tag) => Object.fromEntries([...tag.matchAll(/([\w:-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g)].map((m) => [m[1], m[2] ?? m[3]]))
          const canonical = [...home.matchAll(/<link\b[^>]*>/g)].map(([tag]) => attrs(tag)).find((tag) => tag.rel === 'canonical')?.href
          assert.ok(canonical, 'canonical URL missing')
          const base = `${new URL(canonical).pathname.replace(/\/$/, '')}/`
          const mime = { '.html':'text/html; charset=utf-8', '.svg':'image/svg+xml', '.css':'text/css', '.js':'text/javascript', '.mjs':'text/javascript', '.webp':'image/webp', '.png':'image/png', '.jpg':'image/jpeg', '.jpeg':'image/jpeg', '.woff2':'font/woff2', '.woff':'font/woff' }
          const server = createServer(async (req, res) => {
            try {
              const url = new URL(req.url, 'http://localhost')
              if (!url.pathname.startsWith(base)) { res.writeHead(404); res.end(); return }
              let file = path.resolve(dist, decodeURIComponent(url.pathname.slice(base.length)))
              if (file !== dist && !file.startsWith(`${dist}${path.sep}`)) { res.writeHead(403); res.end(); return }
              let info
              try { info = await stat(file) } catch { file += '.html'; info = await stat(file) }
              if (info.isDirectory()) file = path.join(file, 'index.html')
              const body = await readFile(file)
              res.writeHead(200, { 'Content-Type': mime[path.extname(file)] ?? 'application/octet-stream' })
              res.end(body)
            } catch { res.writeHead(404); res.end('Not found') }
          })
          await new Promise((resolve, reject) => { server.once('error', reject); server.listen(0, '127.0.0.1', resolve) })
          const origin = `http://127.0.0.1:${server.address().port}`
          const { chromium } = await import(pathToFileURL(path.resolve(process.env.PLAYWRIGHT_MODULE)).href)
          const browser = await chromium.launch({ headless: true })
          const expectedAlts = [
            'Session 不等于 Context Window，长任务靠持久状态接力。',
            '长任务要分清工作上下文、任务状态和环境状态。',
            '交接文件应保存可继续执行的信息，而不是聊天摘要。',
            '迁移到 Agent Harness 的最小结构。'
          ]
          try {
            for (const viewport of [{ width: 1280, height: 900 }, { width: 390, height: 844 }]) {
              const context = await browser.newContext({ viewport })
              const page = await context.newPage()
              page.setDefaultTimeout(12000)
              const response = await page.goto(`${origin}${base}blog/long-running-agent-session-context-state`, { waitUntil: 'load' })
              assert.equal(response?.status(), 200)
              assert.equal((await page.locator('h1').first().textContent())?.trim(), '长任务为什么不能只靠一条越来越长的对话')
              for (const alt of expectedAlts) {
                const image = page.getByAltText(alt, { exact: true })
                await image.scrollIntoViewIfNeeded()
                await image.evaluate((img) => img.decode())
                const dimensions = await image.evaluate((img) => ({ width: img.naturalWidth, height: img.naturalHeight }))
                assert.equal(dimensions.width, 1200, `${alt} width`)
                assert.equal(dimensions.height, 650, `${alt} height`)
              }
              await page.evaluate(() => document.fonts.ready)
              assert.ok(await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth) <= 1, `horizontal overflow at ${viewport.width}px`)
              const codeWidth = await page.locator('pre').first().evaluate((node) => node.getBoundingClientRect().width)
              assert.ok(codeWidth <= viewport.width, `code block exceeds ${viewport.width}px viewport`)
              await context.close()
            }
          } finally {
            await browser.close()
            await new Promise((resolve) => server.close(resolve))
          }
          NODE
