name: Verify Notion article candidate

on:
  push:
    branches: [verify/notion-sync-20260917-session-context]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate retained snapshots
        run: bun run validate:sync
      - name: Check Astro types
        run: bun run check
      - name: Build production output
        run: bun run build
      - name: Install Chromium test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/notion-sync-browser" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/notion-sync-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PW_MODULE=$RUNNER_TEMP/notion-sync-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Check article on desktop and mobile
        run: |
          bun run preview -- --host 127.0.0.1 --port 4321 >/tmp/notion-sync-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill $preview_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/loraSys/blog/long-running-agent-session-context-state >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require(process.env.PW_MODULE)
          const url = 'http://127.0.0.1:4321/loraSys/blog/long-running-agent-session-context-state'
          const browser = await chromium.launch({ headless: true })
          try {
            for (const viewport of [{ width: 1280, height: 900 }, { width: 390, height: 844 }]) {
              const page = await browser.newPage({ viewport })
              const response = await page.goto(url, { waitUntil: 'networkidle' })
              if (!response || !response.ok()) throw new Error(`article request failed: ${response?.status()}`)
              const title = await page.locator('h1').first().textContent()
              if (!title?.includes('长任务为什么不能只靠一条越来越长的对话')) throw new Error('article title missing')
              const images = page.locator('img[src*="long-running-agent-session-context-state"]')
              const count = await images.count()
              if (count !== 4) throw new Error(`expected 4 article images, found ${count}`)
              for (let i = 0; i < count; i++) {
                const ok = await images.nth(i).evaluate(img => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0)
                if (!ok) throw new Error(`article image ${i + 1} failed to decode`)
              }
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1)
              if (overflow) throw new Error(`horizontal overflow at ${viewport.width}px`)
              const code = page.locator('pre').first()
              if (await code.count()) {
                const box = await code.boundingBox()
                if (box && box.width > viewport.width) throw new Error(`code block exceeds viewport at ${viewport.width}px`)
              }
              await page.close()
            }
          } finally {
            await browser.close()
          }
          NODE
