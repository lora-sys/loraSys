name: Verify Notion article candidate

on:
  push:
    branches: [verify/notion-sync-20260917-session-context]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate retained snapshots
        run: bun run validate:sync
      - name: Check Astro types
        run: bun run check
      - name: Build production output
        run: bun run build
      - name: Install Chromium test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/notion-sync-browser" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/notion-sync-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/notion-sync-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Run site browser regression
        env:
          SITE_TEST_OUTPUT: ${{ runner.temp }}/notion-sync-regressions
        run: node scripts/test-site-regressions.mjs
      - name: Inspect new article on desktop and mobile
        env:
          REPORT: ${{ runner.temp }}/notion-sync-article.json
        run: |
          node --input-type=module <<'NODE'
          import { createServer } from 'node:http'
          import { readFile, stat, writeFile } from 'node:fs/promises'
          import path from 'node:path'
          import { pathToFileURL } from 'node:url'
          const dist = path.resolve('dist')
          const home = await readFile(path.join(dist, 'index.html'), 'utf8')
          const canonical = [...home.matchAll(/<link\b[^>]*>/g)].map(([tag]) => Object.fromEntries([...tag.matchAll(/([\w:-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g)].map((m) => [m[1], m[2] ?? m[3]]))).find((tag) => tag.rel === 'canonical')?.href
          const canonicalUrl = new URL(canonical)
          const base = `${canonicalUrl.pathname.replace(/\/$/, '')}/`
          const mime = { '.html':'text/html; charset=utf-8', '.svg':'image/svg+xml', '.css':'text/css', '.js':'text/javascript', '.mjs':'text/javascript', '.webp':'image/webp', '.png':'image/png', '.jpg':'image/jpeg', '.jpeg':'image/jpeg', '.woff2':'font/woff2', '.woff':'font/woff' }
          const server = createServer(async (req, res) => {
            try {
              const url = new URL(req.url, 'http://localhost')
              if (!url.pathname.startsWith(base)) { res.writeHead(404); res.end(); return }
              let file = path.resolve(dist, decodeURIComponent(url.pathname.slice(base.length)))
              let info
              try { info = await stat(file) } catch { file += '.html'; info = await stat(file) }
              if (info.isDirectory()) file = path.join(file, 'index.html')
              const body = await readFile(file)
              res.writeHead(200, { 'Content-Type': mime[path.extname(file)] ?? 'application/octet-stream' })
              res.end(body)
            } catch { res.writeHead(404); res.end('Not found') }
          })
          await new Promise((resolve, reject) => { server.once('error', reject); server.listen(0, '127.0.0.1', resolve) })
          const origin = `http://127.0.0.1:${server.address().port}`
          const { chromium } = await import(pathToFileURL(path.resolve(process.env.PLAYWRIGHT_MODULE)).href)
          const browser = await chromium.launch({ headless: true })
          const results = { canonical, base, route: `${base}blog/long-running-agent-session-context-state`, viewports: [] }
          try {
            for (const viewport of [{ width: 1280, height: 900 }, { width: 390, height: 844 }]) {
              const context = await browser.newContext({ viewport })
              const page = await context.newPage()
              const response = await page.goto(`${origin}${base}blog/long-running-agent-session-context-state`, { waitUntil: 'load' })
              await page.evaluate(() => document.fonts.ready)
              results.viewports.push({
                width: viewport.width,
                status: response?.status() ?? null,
                url: page.url(),
                h1: await page.locator('h1').first().textContent().catch(() => null),
                images: await page.locator('main img').evaluateAll((imgs) => imgs.map((img) => ({ alt: img.getAttribute('alt'), src: img.getAttribute('src'), complete: img.complete, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight }))),
                overflow: await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth),
                codeWidths: await page.locator('pre').evaluateAll((nodes) => nodes.map((n) => n.getBoundingClientRect().width))
              })
              await context.close()
            }
          } finally {
            await browser.close()
            await new Promise((resolve) => server.close(resolve))
          }
          await writeFile(process.env.REPORT, JSON.stringify(results, null, 2))
          console.log(JSON.stringify(results, null, 2))
          NODE
      - name: Preserve article inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-sync-article-inspection
          path: ${{ runner.temp }}/notion-sync-article.json
          if-no-files-found: error
          retention-days: 2
