name: Verify site pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=3072

concurrency:
  group: site-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build verified site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Restore Astro asset cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('bun.lock', 'astro.config.ts') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('bun.lock', 'astro.config.ts') }}-
      - name: Validate retained snapshots
        run: bun run validate:sync
      - name: Check and build production output
        run: bun run build
      - name: Package tested site
        run: tar -czf "$RUNNER_TEMP/verified-site.tar.gz" -C dist .
      - name: Share tested site with parallel browser audits
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: ${{ runner.temp }}/verified-site.tar.gz
          retention-days: 7

  regression:
    name: Build and browser regression
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download tested site
        uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: ${{ runner.temp }}
      - name: Restore production output
        run: mkdir dist && tar -xzf "$RUNNER_TEMP/verified-site.tar.gz" -C dist
      - name: Install isolated browser test runner
        id: browser
        run: |
          npm install --prefix "$RUNNER_TEMP/lorasys-browser" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/lorasys-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test production pages in Chromium
        env:
          SITE_TEST_OUTPUT: ${{ runner.temp }}/lorasys-site-regressions
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lorasys-browser/node_modules/playwright/index.mjs
        run: node scripts/test-site-regressions.mjs
      - name: Verify project fold search deduplication and readable resumes
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          SITE_TEST_OUTPUT: ${{ runner.temp }}/lorasys-site-regressions/reading-quality
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lorasys-browser/node_modules/playwright/index.mjs
        run: node scripts/test-reading-quality.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-regression-evidence
          path: ${{ runner.temp }}/lorasys-site-regressions
          if-no-files-found: warn
          retention-days: 14

  localization:
    name: Localization and project asset audit
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download tested site
        uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: ${{ runner.temp }}
      - name: Restore production output
        run: mkdir dist && tar -xzf "$RUNNER_TEMP/verified-site.tar.gz" -C dist
      - name: Audit rendered pages and local targets
        env:
          SITE_TEST_OUTPUT: ${{ runner.temp }}/site-locale-evidence
        run: python scripts/audit-rendered-site.py
      - name: Install isolated quality tools
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/locale-tools" --no-save --package-lock=false playwright@1.58.2 axe-core@4.10.3 lighthouse@12.8.2 chrome-launcher@1.2.0
          node "$RUNNER_TEMP/locale-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser route, language and interaction audit
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/locale-tools/node_modules/playwright/index.mjs
          AXE_PATH: ${{ runner.temp }}/locale-tools/node_modules/axe-core/axe.min.js
          SITE_TEST_OUTPUT: ${{ runner.temp }}/site-locale-evidence
        run: |
          node scripts/audit-i18n-site.mjs
          node scripts/audit-microinteractions.mjs
      - name: Verify contact hero layout
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/locale-tools/node_modules/playwright/index.mjs
          SITE_TEST_OUTPUT: ${{ runner.temp }}/site-locale-evidence
        run: node scripts/test-contact-layout.mjs
      - name: Lighthouse measurements
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/locale-tools/node_modules/playwright/index.mjs
          QUALITY_TOOLS: ${{ runner.temp }}/locale-tools/node_modules
          SITE_TEST_OUTPUT: ${{ runner.temp }}/site-locale-evidence/lighthouse
        run: node scripts/audit-lighthouse.mjs
      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-browser-evidence
          path: ${{ runner.temp }}/site-locale-evidence
          retention-days: 14
