name: Restore original Notion blog images
on:
  push:
    branches: [fix/restore-notion-images-20260916]
    paths: [.github/workflows/restore-notion-images.yml]
permissions:
  contents: write
concurrency:
  group: restore-notion-images-20260916
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Receive encrypted source links and store original images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TRANSFER_BRANCH: fix/restore-notion-images-20260916
        shell: python
        run: |
          import base64, hashlib, hmac, json, os, pathlib, struct, subprocess, tempfile, time
          import urllib.error, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          repo = os.environ['GH_REPOSITORY']
          branch = os.environ['TRANSFER_BRANCH']
          assert repo == 'lora-sys/loraSys'
          api_root = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'notion-image-transfer'}
          def api(path, data=None, method=None):
              payload = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(api_root + path, data=payload, headers=headers, method=method or ('GET' if data is None else 'POST'))
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
              return json.loads(body) if body else None
          def read_file(path):
              return api('/contents/' + path + '?ref=' + urllib.parse.quote(branch, safe=''))
          def put_new(path, data):
              return api('/contents/' + path, {'message': 'chore(blog): publish image transfer metadata', 'content': base64.b64encode(data).decode(), 'branch': branch}, 'PUT')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'notion-images-output'
          out.mkdir()
          with tempfile.TemporaryDirectory() as work:
              key_path = pathlib.Path(work) / 'private.pem'
              subprocess.run(['openssl', 'genpkey', '-algorithm', 'RSA', '-pkeyopt', 'rsa_keygen_bits:2048', '-out', str(key_path)], check=True, capture_output=True)
              public = subprocess.run(['openssl', 'pkey', '-in', str(key_path), '-pubout'], check=True, capture_output=True).stdout
              put_new('transfer/public-key.pem', public)
              print('Ephemeral public key ready. Private key remains only on this runner.', flush=True)
              deadline = time.monotonic() + 1200
              envelope = None
              while time.monotonic() < deadline:
                  try:
                      entry = read_file('transfer/encrypted-manifest.json')
                      envelope = json.loads(base64.b64decode(entry['content']))
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise RuntimeError('Cannot read encrypted transfer manifest') from None
                  time.sleep(5)
              if envelope is None:
                  raise RuntimeError('Encrypted transfer manifest was not received')
              keys = subprocess.run(['openssl', 'pkeyutl', '-decrypt', '-inkey', str(key_path), '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256', '-pkeyopt', 'rsa_mgf1_md:sha256'], input=base64.b64decode(envelope['key']), check=True, capture_output=True).stdout
              if len(keys) != 64:
                  raise RuntimeError('Invalid transfer key')
              iv = base64.b64decode(envelope['iv'])
              ciphertext = base64.b64decode(envelope['ciphertext'])
              tag = base64.b64decode(envelope['hmac'])
              if not hmac.compare_digest(hmac.new(keys[32:], iv + ciphertext, hashlib.sha256).digest(), tag):
                  raise RuntimeError('Encrypted transfer integrity check failed')
              plain = subprocess.run(['openssl', 'enc', '-d', '-aes-256-cbc', '-K', keys[:32].hex(), '-iv', iv.hex()], input=ciphertext, check=True, capture_output=True).stdout
              manifest = json.loads(plain)
              expected = {
                  'agent-evaluation-flow.png': ('agent-budget-memory-evaluation', '65c65e96-ad51-4430-9ef4-41464354d708'),
                  'best-so-far.svg': ('agent-budget-memory-evaluation', 'a2ba4a5f-34f4-414c-8229-e2086a897158'),
                  'session-allocation.svg': ('agent-budget-memory-evaluation', '51edbf74-50fe-43b1-aee4-429922420920'),
                  'pass-at-k-and-pass-all.png': ('agent-budget-memory-evaluation', 'aed5e0b6-dcb9-429b-a806-e5109ed2dcb2'),
                  'tau_three_layers.png': ('tau-agent-architecture', 'c922327f-cff4-4990-ae4b-b96f01ba562c'),
                  'agent_event_loop.png': ('tau-agent-loop-events', '50f008de-1f0b-445b-b19b-d428dab65659')
              }
              if set(manifest) != set(expected):
                  raise RuntimeError('Manifest must contain exactly the six requested article images')
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      raise RuntimeError('Image source redirects are not permitted')
              client = urllib.request.build_opener(NoRedirect())
              assets = []
              for name, (slug, attachment) in expected.items():
                  url = manifest[name]
                  parsed = urllib.parse.urlsplit(url)
                  expected_path = '/a6130166-6d07-416f-9899-ddf9bc53fc30/' + attachment + '/' + name
                  if parsed.scheme != 'https' or parsed.netloc != 'prod-files-secure.s3.us-west-2.amazonaws.com' or parsed.path != expected_path:
                      raise RuntimeError('Unexpected source for ' + name)
                  # Signed URLs never enter the public Git history, logs, or artifacts.
                  print('::add-mask::' + url, flush=True)
                  try:
                      with client.open(url, timeout=45) as response:
                          data = response.read(8 * 1024 * 1024 + 1)
                  except Exception:
                      raise RuntimeError('Could not download ' + name + '; source may have expired') from None
                  if not data or len(data) > 8 * 1024 * 1024:
                      raise RuntimeError('Invalid image size for ' + name)
                  width = height = None
                  if name.endswith('.png'):
                      if not data.startswith(b'\x89PNG\r\n\x1a\n') or data[12:16] != b'IHDR':
                          raise RuntimeError('Invalid PNG for ' + name)
                      width, height = struct.unpack('>II', data[16:24])
                      if not 0 < width <= 20000 or not 0 < height <= 20000:
                          raise RuntimeError('Invalid PNG dimensions')
                  else:
                      root = ET.fromstring(data)
                      if root.tag.split('}')[-1] != 'svg':
                          raise RuntimeError('Invalid SVG for ' + name)
                      for element in root.iter():
                          if element.tag.split('}')[-1].lower() in {'script', 'foreignobject'}:
                              raise RuntimeError('Active SVG content is not permitted')
                          for attr, value in element.attrib.items():
                              attr = attr.split('}')[-1].lower()
                              if attr.startswith('on') or (attr in {'href', 'src'} and not value.startswith('#')):
                                  raise RuntimeError('External SVG resource is not permitted')
                      if any(token in data.lower() for token in (b'<!entity', b'@import', b'url(http', b'url(https')):
                          raise RuntimeError('External SVG dependency is not permitted')
                  path = 'src/assets/blog/' + slug + '/' + name
                  target = out / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  blob = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
                  assets.append({'path': path, 'sha': blob['sha'], 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'width': width, 'height': height})
                  print('Stored original image: ' + name + ' (' + str(len(data)) + ' bytes)', flush=True)
              report = json.dumps({'original_images': assets, 'count': len(assets)}, ensure_ascii=False, indent=2).encode()
              (out / 'manifest.json').write_bytes(report)
              result_blob = api('/git/blobs', {'content': report.decode(), 'encoding': 'utf-8'})
              ref = api('/git/ref/heads/' + branch)
              parent = ref['object']['sha']
              base = api('/git/commits/' + parent)['tree']['sha']
              entries = [{'path': item['path'], 'mode': '100644', 'type': 'blob', 'sha': item['sha']} for item in assets]
              entries.append({'path': 'transfer/result.json', 'mode': '100644', 'type': 'blob', 'sha': result_blob['sha']})
              tree = api('/git/trees', {'base_tree': base, 'tree': entries})
              commit = api('/git/commits', {'message': 'fix(blog): recover six original Notion image assets', 'tree': tree['sha'], 'parents': [parent]})
              api('/git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False}, 'PATCH')
              print('All six originals stored. No main branch changes were made.', flush=True)
      - name: Save original image files for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: original-notion-blog-images
          path: ${{ runner.temp }}/notion-images-output/
          retention-days: 1
