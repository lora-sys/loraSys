name: Update Contribution Graph

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: lora-sys
        run: |
          node -e "
            const https = require('https');
            const fs = require('fs');

            const query = JSON.stringify({
              query: \`
                query(\$login: String!) {
                  user(login: \$login) {
                    contributionsCollection {
                      contributionCalendar {
                        totalContributions
                        weeks {
                          contributionDays {
                            date
                            contributionCount
                          }
                        }
                      }
                    }
                  }
                }
              \`,
              variables: { login: process.env.GITHUB_USER }
            });

            const options = {
              hostname: 'api.github.com',
              path: '/graphql',
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN,
                'Content-Type': 'application/json',
                'User-Agent': 'loraSys-actions'
              }
            };

            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                const json = JSON.parse(data);
                if (json.errors) {
                  console.error('GraphQL errors:', JSON.stringify(json.errors));
                  process.exit(1);
                }
                const calendar = json.data.user.contributionsCollection.contributionCalendar;
                const output = {
                  totalContributions: calendar.totalContributions,
                  lastUpdated: new Date().toISOString(),
                  weeks: calendar.weeks
                };
                fs.mkdirSync('src/lib/data', { recursive: true });
                fs.writeFileSync('src/lib/data/contributions.json', JSON.stringify(output, null, 2));
                console.log('✅ Fetched ' + calendar.totalContributions + ' total contributions across ' + calendar.weeks.length + ' weeks');
              });
            });

            req.on('error', (e) => {
              console.error('Request error:', e);
              process.exit(1);
            });

            req.write(query);
            req.end();
          "

      - name: Commit contribution data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/contributions.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update contribution graph data [skip ci]"
          git push
