name: Inspect published site in Chromium

on:
  push:
    branches: ['audit/live-browser-20260908']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-inspection
  cancel-in-progress: true

jobs:
  inspect:
    name: Published site browser quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audit script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium runner
        run: |
          npm install --prefix "$RUNNER_TEMP/lorasys-live-browser" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/lorasys-live-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Inspect real published pages
        env:
          SITE_TEST_OUTPUT: ${{ runner.temp }}/lorasys-live-evidence
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lorasys-live-browser/node_modules/playwright/index.mjs
        run: node scripts/audit-live-site.mjs
      - name: Preserve actual page screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-browser-evidence
          path: ${{ runner.temp }}/lorasys-live-evidence
          if-no-files-found: warn
          retention-days: 14
