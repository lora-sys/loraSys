name: Verify Notion article 2026-09-20

on:
  push:
    branches:
      - verify/notion-sync-20260920

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate MDX contract
        run: bun run content:validate
      - name: Check Astro types
        run: bun run check
      - name: Build production output
        run: NODE_OPTIONS=--max-old-space-size=3072 bun run build
      - name: Install browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check changed articles on desktop and mobile
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright/index.mjs
          EVIDENCE_DIR: ${{ runner.temp }}/notion-article-evidence
        run: |
          cat > "$RUNNER_TEMP/check-changed-articles.mjs" <<'EOF'
          import assert from 'node:assert/strict'
          import { createServer } from 'node:http'
          import { readFile, stat, mkdir } from 'node:fs/promises'
          import path from 'node:path'
          import { pathToFileURL } from 'node:url'
          const { chromium } = await import(pathToFileURL(process.env.PLAYWRIGHT_MODULE).href)
          const dist = path.resolve('dist')
          const base = '/loraSys/'
          const mime = {'.html':'text/html; charset=utf-8','.js':'text/javascript','.mjs':'text/javascript','.css':'text/css','.svg':'image/svg+xml','.png':'image/png','.webp':'image/webp','.woff2':'font/woff2','.xml':'application/xml'}
          const server = createServer(async (req,res) => {
            try {
              const url = new URL(req.url,'http://localhost')
              if (!url.pathname.startsWith(base)) { res.writeHead(404); res.end(); return }
              let file = path.resolve(dist, decodeURIComponent(url.pathname.slice(base.length)))
              let info
              try { info = await stat(file) } catch { file += '.html'; info = await stat(file) }
              if (info.isDirectory()) file = path.join(file,'index.html')
              res.writeHead(200, {'Content-Type': mime[path.extname(file)] ?? 'application/octet-stream'})
              res.end(await readFile(file))
            } catch { res.writeHead(404); res.end('Not found') }
          })
          await new Promise((resolve,reject) => { server.once('error',reject); server.listen(0,'127.0.0.1',resolve) })
          const root = `http://127.0.0.1:${server.address().port}${base}`
          const browser = await chromium.launch({headless:true, channel:'chromium'})
          const evidence = process.env.EVIDENCE_DIR
          await mkdir(evidence,{recursive:true})
          const cases = [
            { slug:'agent-durable-execution-step-idempotency', images:4, details:3, table:false },
            { slug:'kitaru-agent-regression-testing', images:4, details:3, table:true }
          ]
          try {
            for (const testCase of cases) {
              for (const viewport of [{width:1440,height:1000},{width:390,height:844}]) {
                const context = await browser.newContext({viewport})
                const page = await context.newPage()
                const errors = []
                page.on('pageerror', e => errors.push(e.message))
                const response = await page.goto(`${root}blog/${testCase.slug}`, {waitUntil:'load'})
                assert.equal(response?.status(), 200)
                const images = page.locator('article img')
                assert.equal(await images.count(), testCase.images, `${testCase.slug} image count`)
                for (let i = 0; i < await images.count(); i++) await images.nth(i).scrollIntoViewIfNeeded()
                await page.waitForFunction(() => [...document.querySelectorAll('article img')].every(img => img.complete && img.naturalWidth > 0), null, {timeout:12000})
                assert.equal(await page.locator('article details').count(), testCase.details, `${testCase.slug} details count`)
                if (testCase.table) assert.ok(await page.locator('article table').count() >= 1, 'Kitaru native Markdown table should render')
                assert.ok(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1), `${testCase.slug} page-level horizontal overflow`)
                assert.deepEqual(errors, [], `${testCase.slug} page errors: ${errors.join('; ')}`)
                const first = page.locator('article details').first()
                await first.locator('summary').click()
                assert.ok(await first.getAttribute('open') !== null, `${testCase.slug} details should open`)
                await page.screenshot({path:path.join(evidence,`${testCase.slug}-${viewport.width}.png`), fullPage:true, animations:'disabled'})
                await context.close()
              }
            }
          } finally {
            await browser.close()
            server.close()
          }
          EOF
          node "$RUNNER_TEMP/check-changed-articles.mjs"
      - name: Run site regression suite
        env:
          SITE_TEST_OUTPUT: ${{ runner.temp }}/site-regression-evidence
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright/index.mjs
        run: node scripts/test-site-regressions.mjs
      - name: Run reading-quality suite
        env:
          SITE_TEST_OUTPUT: ${{ runner.temp }}/reading-quality-evidence
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright/index.mjs
        run: node scripts/test-reading-quality.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-sync-20260920-evidence
          path: |
            ${{ runner.temp }}/notion-article-evidence
            ${{ runner.temp }}/site-regression-evidence
            ${{ runner.temp }}/reading-quality-evidence
          if-no-files-found: warn
          retention-days: 7
