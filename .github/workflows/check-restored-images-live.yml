name: Check restored article images on Pages
on:
  push:
    branches: [fix/restore-notion-images-20260916]
    paths: [.github/workflows/check-restored-images-live.yml]
permissions:
  contents: read
  actions: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTPUT: /tmp/notion-images-live-${{ github.run_id }}
    steps:
      - name: Install temporary browser tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Wait for the verified image commit and its Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, json, os, pathlib, time, urllib.error, urllib.request
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          out = pathlib.Path(os.environ['OUTPUT'])
          out.mkdir()
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(root + path, headers=headers), timeout=30) as r:
                  return json.load(r)
          deadline = time.monotonic() + 600
          candidate = None
          target = None
          deployment = None
          while time.monotonic() < deadline:
              if candidate is None:
                  try:
                      f = api('/contents/transfer/verified-result.json?ref=fix%2Frestore-notion-images-20260916')
                      candidate = json.loads(base64.b64decode(f['content']))
                  except urllib.error.HTTPError as e:
                      if e.code != 404:
                          raise
              if candidate is not None:
                  current = api('/git/ref/heads/main')['object']['sha']
                  commit = api('/git/commits/' + current)
                  if commit['tree']['sha'] == candidate['candidate_tree']:
                      target = current
                      runs = api('/actions/runs?head_sha=' + target + '&per_page=10')['workflow_runs']
                      matches = [r for r in runs if r['path'] == '.github/workflows/deploy.yml']
                      if matches and matches[0]['status'] == 'completed':
                          if matches[0]['conclusion'] != 'success':
                              raise RuntimeError('Pages deployment did not succeed')
                          deployment = matches[0]['html_url']
                          break
              time.sleep(10)
          if deployment is None:
              raise RuntimeError('Verified image commit has not finished deploying')
          homepage = api('')['homepage'].rstrip('/')
          assert homepage == 'https://lora-sys.github.io/loraSys'
          (out / 'target.json').write_text(json.dumps({'commit': target, 'homepage': homepage, 'deployment': deployment}))
          print('Verified commit deployed: ' + target)
      - name: Load all restored images on desktop and mobile
        shell: python
        run: |
          import json, os, pathlib, re, urllib.parse
          from playwright.sync_api import sync_playwright
          out = pathlib.Path(os.environ['OUTPUT'])
          target = json.loads((out / 'target.json').read_text())
          base = target['homepage']
          captions = {
              'agent-budget-memory-evaluation': [
                  '图 1，普通问答评测与 Agent 评测的区别。图片来源为 Anthropic。',
                  '图 2，历史最好成绩与本次提交成绩。教学假设数据，不是论文实验结果。',
                  '图 3，依据论文 Figure 8 右下图数值重绘。横轴为六种离散配置，连线只帮助阅读，不代表测过中间配置。',
                  '图 4，至少成功一次与每次都成功，是两种不同要求。图片来源为 Anthropic，图中使用原文的示例参数。'
              ],
              'tau-agent-architecture': ['Tau 三层架构示意图。'],
              'tau-agent-loop-events': ['Agent 事件循环示意图。']
          }
          results = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for label, width, height in [('desktop', 1440, 1000), ('mobile', 390, 844)]:
                  context = browser.new_context(viewport={'width': width, 'height': height}, reduced_motion='reduce')
                  page = context.new_page()
                  for slug, alts in captions.items():
                      url = base + '/blog/' + slug + '?image_restore=' + target['commit'][:12]
                      response = page.goto(url, wait_until='load')
                      assert response.status == 200, slug
                      for i, alt in enumerate(alts):
                          image = page.get_by_alt_text(alt, exact=True)
                          image.wait_for(state='visible')
                          assert image.count() == 1
                          image.scroll_into_view_if_needed()
                          image.evaluate('(img) => img.decode()')
                          info = image.evaluate('(img) => ({src: img.currentSrc, width: img.naturalWidth, height: img.naturalHeight, left: img.getBoundingClientRect().left, right: img.getBoundingClientRect().right})')
                          assert info['src'].startswith(base + '/'), info['src']
                          assert info['width'] > 0 and info['height'] > 0
                          assert info['left'] >= -1 and info['right'] <= width + 1
                          r = context.request.get(info['src'])
                          assert r.status == 200 and r.headers.get('content-type', '').startswith('image/')
                          image.screenshot(path=str(out / (label + '-' + slug + '-' + str(i + 1) + '.png')))
                          results.append({'viewport': label, 'article': slug, 'page': page.url, 'alt': alt, 'http_status': r.status, **info})
                      page.get_by_alt_text(alts[0], exact=True).scroll_into_view_if_needed()
                      page.screenshot(path=str(out / (label + '-' + slug + '-context.png')))
                  context.close()
              browser.close()
          report = {**target, 'passed_image_checks': len(results), 'results': results}
          (out / 'live-verification.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False, indent=2))
      - name: Save live screenshots and image checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-notion-images-live
          path: ${{ env.OUTPUT }}/
          retention-days: 1
